<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title></title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #080808;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #sa {
    position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }
  .btn {
    position: fixed; bottom: calc(8px + env(safe-area-inset-bottom));
    width: 44px; height: 44px; border: 0; background: none; padding: 0;
    color: #888; opacity: .45; font: 18px/44px system-ui, sans-serif; cursor: pointer;
  }
  .btn:active { opacity: .9; }
  #mute { left: calc(8px + env(safe-area-inset-left)); }
  #next { right: calc(8px + env(safe-area-inset-right)); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<button class="btn" id="mute" aria-label="Toggle music (M)">♪</button>
<button class="btn" id="next" aria-label="Next track (N)">»</button>
<script>
"use strict";
// Tap/click/space exactly when every orbiting ball sits on a spoke.
// Wrong tap = instant loss. Let two alignments slip by = loss.

const TAU = Math.PI * 2;
const mod = (a, n) => ((a % n) + n) % n;
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
function shuffle(t) {
  for (let i = t.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [t[i], t[j]] = [t[j], t[i]];
  }
  return t;
}

// =========================================================================
// Audio — NES-style music + SFX, generated entirely at runtime.
// =========================================================================
const Audio = (() => {
  const RATE = 32768, CHUNK = 2048, inv = 1 / RATE, AHEAD = 0.3;
  const { floor, sin, min, max } = Math;

  const SCALES = {
    minor:    [0, 2, 3, 5, 7, 8, 10],
    harmonic: [0, 2, 3, 5, 7, 8, 11],
    phrygian: [0, 1, 3, 5, 7, 8, 10],
  };
  const nfreq = n => 440 * 2 ** ((n - 69) / 12);

  // structure sections (8 bars each): N intro · A groove · B +lead · C breakdown · F full
  const SONGS = [
    { name: "NULL ORBIT", bpm: 116, root: 33, scale: "phrygian", seed: 11, prog: [1,2,1,6],
      arp: [0,1,2,4,2,1], arpOct: 2, bass: 2, duty1: 0.25, duty2: 0.50, echo: true, saw: false,
      drumA: "K...h...S...h...", drumB: "K.h.h.K.S.h.h.h.", structure: "NAABBABBCF" },
    { name: "HOLLOW SIGNAL", bpm: 140, root: 38, scale: "harmonic", seed: 23, prog: [1,6,3,7],
      arp: [0,1,2,3], arpOct: 2, bass: 1, duty1: 0.50, duty2: 0.25, echo: true, saw: true,
      drumA: "K..h..K.S..h..h.", drumB: "K.hhK.h.S.hhK.hH", structure: "NAABABBFABBF" },
    { name: "BLACK MERIDIAN", bpm: 100, root: 36, scale: "minor", seed: 37, prog: [1,4,6,5],
      arp: [0,2,1,2,4,2], arpOct: 2, bass: 3, duty1: 0.25, duty2: 0.50, echo: false, saw: true,
      drumA: "K.......S....h..", drumB: "K...h...S..K.h.h", structure: "NABBACBF" },
    { name: "STATIC VEIL", bpm: 128, root: 40, scale: "phrygian", seed: 41, prog: [1,2,6,2],
      arp: [0,4,2,4,1,4], arpOct: 2, bass: 1, duty1: 0.125, duty2: 0.50, echo: true, saw: false,
      drumA: "K..h..S...hK..S.", drumB: "K.h.S.h.K.h.S.hH", structure: "NAABBABABBF" },
    { name: "LOW ECLIPSE", bpm: 92, root: 31, scale: "minor", seed: 53, prog: [1,6,7,1],
      arp: [0,1,2,1], arpOct: 2, bass: 4, duty1: 0.50, duty2: 0.25, echo: false, saw: true,
      drumA: "K.....h.S.....h.", drumB: "K..h..h.S..h..hh", structure: "NABABCABF" },
    { name: "VECTOR MOURN", bpm: 150, root: 35, scale: "harmonic", seed: 67, prog: [1,3,6,7],
      arp: [0,1,2,4], arpOct: 2, bass: 2, duty1: 0.25, duty2: 0.25, echo: true, saw: false,
      drumA: "K.h.K.h.S.h.K.h.", drumB: "K.h.Khh.S.h.KhhH", structure: "NAABBABBAABBF" },
    { name: "PALE AXIS", bpm: 124, root: 37, scale: "phrygian", seed: 71, prog: [1,6,2,7],
      arp: [0,2,4,2], arpOct: 2, bass: 1, duty1: 0.50, duty2: 0.50, echo: true, saw: true,
      drumA: "K...h.K.S...h...", drumB: "K..hh.K.S..hh.hH", structure: "NAABABBCABBF" },
    { name: "TERMINAL DRIFT", bpm: 108, root: 34, scale: "minor", seed: 83, prog: [1,7,6,5],
      arp: [0,1,2,3,4,3,2,1], arpOct: 2, bass: 3, duty1: 0.25, duty2: 0.50, echo: false, saw: true,
      drumA: "K.......S...h...", drumB: "K...h..KS...h.h.", structure: "NABBACABBACF" },
  ];

  const DRMAP = { K: 1, S: 2, h: 3, H: 4, k: 5 };
  const DRUMS = [null,                                 // hold, env decay, volume
    { hold: 24, dk: 0.99870, vol: 0.34, kick: true  }, // kick
    { hold: 5,  dk: 0.99935, vol: 0.40, kick: false }, // snare
    { hold: 2,  dk: 0.99700, vol: 0.15, kick: false }, // closed hat
    { hold: 2,  dk: 0.99950, vol: 0.15, kick: false }, // open hat
    { hold: 24, dk: 0.99800, vol: 0.20, kick: true  }, // soft kick
  ];

  const LEADT = ["x...x...x.x.....", "x..x..x...x.....", "x.x...x.x...x...",
                 "x...x..x....x.x.", "x.......x..x.x..", "x.x.x...x...x..."];
  const LEADC = ["x...............", "x.......x......."];
  const DRUMC = "..h...h...h...h.";

  // seeded RNG (mulberry32) — rand(n) returns 1..n like love's rng:random(n)
  function seeded(seed) {
    let a = seed >>> 0;
    return n => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return floor((((t ^ (t >>> 14)) >>> 0) / 4294967296) * n) + 1;
    };
  }

  // score generator --------------------------------------------------------
  function buildScore(song) {
    const rand  = seeded(song.seed);
    const scale = SCALES[song.scale];
    const root  = song.root;
    const nBars = song.structure.length * 8;
    const total = nBars * 16;
    const S = { p1: [], p2: [], tri: [], saw: [], drum: [], p2m: [], total };
    let si = 21;                                     // lead position in scale space

    const noteOf = ix => root + scale[mod(ix, 7)] + 12 * floor(ix / 7);
    const ctone  = (deg, k) => noteOf(deg - 1 + 2 * k);

    for (let bar = 0; bar < nBars; bar++) {
      const base  = bar * 16;
      const sec   = song.structure[floor(bar / 8)];
      const deg   = song.prog[bar % song.prog.length];
      const barIn = bar % 8;
      const bn    = ctone(deg, 0);

      // arp (pulse 1)
      if (sec !== "C") {
        for (let r = 0; r < 16; r++) {
          const v = song.arp[r % song.arp.length];
          S.p1[base + r] = ctone(deg, v % 4) + 12 * (song.arpOct + floor(v / 4));
        }
      } else {
        S.p1[base] ??= -1;
      }

      // bass (triangle)
      if (song.bass === 1) {                         // pumping 8ths
        for (let r = 0; r <= 14; r += 2) S.tri[base + r] = bn;
      } else if (song.bass === 2) {                  // driving syncopation
        for (const [r, off] of [[0,0],[3,0],[6,0],[8,12],[11,0],[14,7]]) S.tri[base + r] = bn + off;
      } else if (song.bass === 3) {                  // long tones
        S.tri[base] = bn; S.tri[base + 10] = -1; S.tri[base + 12] = bn;
      } else {                                       // floating offbeats
        for (let r = 2; r <= 14; r += 4) S.tri[base + r] = bn;
      }

      // saw pad (B/F sections only)
      if (song.saw) {
        if (sec === "B" || sec === "F") S.saw[base] = bn + 12;
        else S.saw[base] ??= -1;
      }

      // pulse 2: lead in B/C/F, echo of the arp elsewhere
      const leadSec = sec === "B" || sec === "C" || sec === "F";
      S.p2m[bar] = leadSec;
      if (leadSec) {
        const temps = sec === "C" ? LEADC : LEADT;
        const tpl   = temps[rand(temps.length) - 1];
        const ons   = [];
        for (let r = 0; r < 16; r++) if (tpl[r] === "x") ons.push(r);
        ons.forEach((r, oi) => {
          if (r % 8 === 0 || oi === 0) {             // snap to chord tone
            const set = new Set([mod(deg - 1, 7), mod(deg + 1, 7), mod(deg + 3, 7)]);
            for (const d of [0, 1, -1, 2, -2, 3, -3]) {
              if (set.has(mod(si + d, 7))) { si += d; break; }
            }
          } else {                                   // scale-wise walk
            si += [-2, -1, -1, 1, 1, 2][rand(6) - 1];
          }
          if (si < 16) si += 7; else if (si > 26) si -= 7;
          const nlen = min(ons[oi + 1] !== undefined ? ons[oi + 1] - r : 16 - r,
                           sec === "C" ? 12 : 4);
          S.p2[base + r] = noteOf(si);
          const off = base + r + nlen;
          if (off < total && S.p2[off] === undefined) S.p2[off] = -1;
        });
      } else if (song.echo) {                        // delayed ghost of the arp
        for (let r = 0; r < 16; r++) {
          const src = S.p1[base + r - 3];
          if (src > 0) S.p2[base + r] = src;
        }
      } else {
        S.p2[base] ??= -1;
      }

      // drums
      if (sec !== "N") {
        let pat = sec === "A" ? song.drumA : sec === "C" ? DRUMC : song.drumB;
        if (barIn === 7 && sec !== "C") pat = pat.slice(0, 12) + "S.SS";
        for (let r = 0; r < 16; r++) {
          const id = DRMAP[pat[r]];
          if (id) S.drum[base + r] = id;
        }
      }
    }
    return S;
  }

  // synth voices -------------------------------------------------------------
  const V = {
    p1:   { ph: 0, f: 0, ef: 0, env: 0, duty: 0.5, dk: 0.99920, rel: false, vol: 0.150 },
    p2:   { ph: 0, f: 0, ef: 0, env: 0, duty: 0.5, dk: 0.99993, rel: false, vol: 0.10, vibd: 0 },
    tri:  { ph: 0, f: 0, env: 0, rel: false, vol: 0.32, since: 0, gate: null },
    saw:  { ph: 0, f: 0, env: 0, rel: false, vol: 0.058 },
    no:   { cnt: 0, hold: 1, val: 0, env: 0, dk: 1, vol: 0, seed: 48271 },
    kick: { ph: 0, f: 0, env: 0 },
  };

  const M = {
    order: [], oi: 0, song: null, score: null,
    row: -1, spr: 4096, acc: 0, gap: 0, t: 0, gain: 0, rowGain: 0,
    muted: false, nameAge: 0, cc: 0,
  };

  function trig(v, n) { v.f = nfreq(n); v.ef = v.f; v.env = 1; v.rel = false; }

  function trigDrum(id) {
    const d = DRUMS[id], no = V.no;
    no.hold = d.hold; no.dk = d.dk; no.vol = d.vol; no.env = 1; no.cnt = 0;
    if (d.kick) { V.kick.f = 165; V.kick.env = id === 1 ? 0.9 : 0.5; }
  }

  function releaseAll() { V.p1.rel = V.p2.rel = V.tri.rel = V.saw.rel = true; }

  function loadTrack(i) {
    M.oi    = i;
    M.song  = SONGS[M.order[i]];
    M.score = buildScore(M.song);
    M.spr   = RATE * 60 / (M.song.bpm * 4);          // samples per 16th-note row
    M.row = -1; M.acc = 0; M.gap = 0; M.nameAge = 0;
    V.tri.gate = { 1: 1, 2: 2, 4: 2 }[M.song.bass] ?? null;
    V.p1.dk = 0.99920;
  }

  const nextTrack = () => loadTrack((M.oi + 1) % M.order.length);

  function advanceRow() {
    if (M.gap > 0) {
      if (--M.gap === 0) nextTrack();
      return;
    }
    M.row++;
    const sc = M.score;
    if (M.row >= sc.total) { M.gap = 20; releaseAll(); return; }
    const r = M.row;

    if (r % 16 === 0) {
      const lead = sc.p2m[floor(r / 16)];
      V.p2.vol  = lead ? 0.185 : 0.085;
      V.p2.duty = lead ? M.song.duty2 : M.song.duty1;
      V.p2.vibd = lead ? 0.006 : 0;
      V.p2.dk   = lead ? 0.99993 : 0.99920;
      M.rowGain = min(1, (sc.total - r) / 32, (r + 16) / 16);
    }

    let n;
    n = sc.p1[r];  if (n !== undefined) { if (n >= 0) { trig(V.p1, n); V.p1.duty = M.song.duty1; } else V.p1.rel = true; }
    n = sc.p2[r];  if (n !== undefined) { if (n >= 0) trig(V.p2, n); else V.p2.rel = true; }
    n = sc.tri[r]; if (n !== undefined) { if (n >= 0) { trig(V.tri, n); V.tri.since = 0; } else V.tri.rel = true; }
    if (V.tri.gate && !V.tri.rel) {
      if (++V.tri.since > V.tri.gate) V.tri.rel = true;
    }
    n = sc.saw[r]; if (n !== undefined) { if (n >= 0) trig(V.saw, n); else V.saw.rel = true; }
    n = sc.drum[r]; if (n !== undefined) trigDrum(n);
  }

  function renderChunk(out) {
    const { p1, p2, tri, saw, no, kick } = V;
    const g = M.gain;
    for (let i = 0; i < out.length; i++) {
      if (--M.acc <= 0) { advanceRow(); M.acc += M.spr; }

      if (++M.cc >= 64) {                            // control rate: vibrato
        M.cc = 0;
        p2.ef = p2.f * (1 + p2.vibd * sin(M.t * 6.2 * TAU));
      }
      M.t += inv;

      let s = 0;

      if (p1.env > 0.002) {
        p1.ph += p1.ef * inv;
        s += ((p1.ph % 1 < p1.duty) ? p1.env : -p1.env) * p1.vol;
        p1.env *= p1.rel ? 0.995 : p1.dk;
      }
      if (p2.env > 0.002) {
        p2.ph += p2.ef * inv;
        s += ((p2.ph % 1 < p2.duty) ? p2.env : -p2.env) * p2.vol;
        p2.env *= p2.rel ? 0.995 : p2.dk;
      }
      if (tri.env > 0.002) {
        tri.ph += tri.f * inv;
        const x = tri.ph % 1;
        let tv = x < 0.5 ? 4 * x - 1 : 3 - 4 * x;
        tv = floor((tv * 0.5 + 0.5) * 15 + 0.5) / 7.5 - 1;   // 16-step NES quantize
        s += tv * tri.env * tri.vol;
        if (tri.rel) tri.env *= 0.99;
      }
      if (saw.env > 0.002) {
        saw.ph += saw.f * inv;
        s += (floor((saw.ph % 1) * 15) / 7.5 - 1) * saw.env * saw.vol;
        saw.env *= saw.rel ? 0.995 : 1;
      }
      if (no.env > 0.003) {                          // 1-bit-ish noise
        if (--no.cnt <= 0) {
          no.cnt  = no.hold;
          no.seed = (no.seed * 16807) % 2147483647;
          no.val  = (no.seed / 2147483647) * 2 - 1;
        }
        s += no.val * no.env * no.vol;
        no.env *= no.dk;
      }
      if (kick.env > 0.003) {                        // sine-drop kick body
        kick.f   = max(46, kick.f * 0.99920);
        kick.ph += kick.f * inv;
        s += sin(TAU * kick.ph) * kick.env;
        kick.env *= 0.99930;
      }

      s *= g * M.rowGain;
      out[i] = s > 1 ? 1 : s < -1 ? -1 : s;
    }
  }

  // web audio plumbing --------------------------------------------------------
  let ctx = null, nextTime = 0;
  const SFX = {}, playing = {};

  function mkSfx(dur, gen) {
    const n = floor(dur * RATE);
    const buf = ctx.createBuffer(1, n, RATE);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) {
      const v = gen(i / RATE);
      d[i] = v > 1 ? 1 : v < -1 ? -1 : v;
    }
    return buf;
  }

  function buildSfx() {
    let ph = 0;
    SFX.success = mkSfx(0.12, t => {               // rising two-note square blip
      ph += (t < 0.055 ? 659 : 988) * inv;
      return (ph % 1 < 0.25 ? 1 : -1) * 0.22 * (1 - t / 0.12);
    });
    ph = 0;
    SFX.strike = mkSfx(0.16, t => {                // dull square drop + click
      ph += max(55, 160 * (1 - t * 3.5)) * inv;
      const e = 1 - t / 0.16;
      return (ph % 1 < 0.5 ? 1 : -1) * 0.26 * e * e
           + (Math.random() * 2 - 1) * 0.12 * max(0, 1 - t * 14);
    });
    ph = 0;
    SFX.death = mkSfx(0.75, t => {                 // long saw fall + noise wash
      ph += 440 * 0.5 ** (t * 4) * inv;
      const e = 1 - t / 0.75;
      return (2 * (ph % 1) - 1) * 0.28 * e + (Math.random() * 2 - 1) * 0.16 * e * e;
    });
    ph = 0;
    SFX.blip = mkSfx(0.05, t => {                  // ui tick
      ph += 880 * inv;
      return (ph % 1 < 0.5 ? 1 : -1) * 0.15 * (1 - t / 0.05);
    });
  }

  // playlist is set up immediately so the "now playing" label works pre-unlock
  M.order = shuffle(SONGS.map((_, i) => i));
  loadTrack(0);

  return {
    // must be called from a user gesture (browser autoplay rules, iOS)
    unlock() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        buildSfx();
        M.nameAge = 0;
      }
      if (ctx.state !== "running") ctx.resume();
    },
    suspend() { if (ctx && ctx.state === "running") ctx.suspend(); },
    update(dt, duck) {
      M.nameAge += dt;
      const target = M.muted ? 0 : (duck ? 0.16 : 0.42);
      M.gain += (target - M.gain) * min(1, dt * 6);
      if (!ctx || ctx.state !== "running") return;
      const now = ctx.currentTime;
      if (nextTime < now + 0.01) nextTime = now + 0.05;      // underrun / first run
      while (nextTime < now + AHEAD) {
        const buf = ctx.createBuffer(1, CHUNK, RATE);
        renderChunk(buf.getChannelData(0));
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(nextTime);
        nextTime += CHUNK / RATE;
      }
    },
    play(name) {
      if (!ctx || !SFX[name]) return;
      try { playing[name]?.stop(); } catch (e) {}
      const src = ctx.createBufferSource();
      src.buffer = SFX[name];
      src.connect(ctx.destination);
      src.start();
      playing[name] = src;
    },
    next() { nextTrack(); },
    toggleMute() { M.muted = !M.muted; return M.muted; },
    muted: () => M.muted,
    nowPlaying: () => [M.song ? M.song.name : "", M.nameAge],
  };
})();

// =========================================================================
// Game
// =========================================================================
const FG  = [0.95, 0.95, 0.95];
const BG  = [0.03, 0.03, 0.03];
const RED = [0.86, 0.28, 0.28];
const FONT = "'Helvetica Neue', Helvetica, Arial, sans-serif";

let state;            // "play" | "dead"
let score, strikes;
let invertT = 0;      // seconds left of color inversion (success flash)
let strikeT = 0;      // seconds left of strike feedback
let deadT = 0;        // time spent on death screen (blocks instant restart)

const test = {};
// test.k  spokes · test.T  seconds between alignments · test.W  click window half-width
// test.wL line angular velocity · test.phi initial angle · test.balls {w, off, rf}
// test.t  time inside this test · test.next time of the next alignment

const lerp = (a, b, u) => a + (b - a) * u;

// difficulty curve --------------------------------------------------------
function params(s) {
  const k = s < 2 ? 1 : s < 4 ? 2 : s < 7 ? 3 : s < 10 ? 4 : s < 14 ? 5 : s < 18 ? 6 : 7;
  const nBalls = Math.min(10, 2 + Math.floor(s / 2));
  const T = Math.max(1.5, 3.4 - s * 0.07);           // time between alignments
  const L = Math.min(1.7, 0.45 + s * 0.06);          // |line speed|
  const W = Math.max(0.055, 0.095 - s * 0.0015);     // click window half-width
  let nSame = 0;                                     // balls co-rotating with lines
  if (s >= 12) nSame = Math.min(nBalls - 1, Math.floor((s - 9) / 3));
  return { k, n: nBalls, T, L, W, nSame };
}

// build a fresh test ------------------------------------------------------
function newTest() {
  const { k, n, T, L, W, nSame } = params(score);
  const dir  = Math.random() < 0.5 ? 1 : -1;         // 50/50 line direction
  const base = (TAU / k) / T;                        // relative speed quantum

  // guarantee balls can be genuinely opposite the lines
  const cMin = Math.max(1, Math.ceil((L + 0.3) / base));

  // pick which balls co-rotate with the lines
  const pool = shuffle([...Array(n).keys()]);
  const sameIdx = new Set(pool.slice(0, nSame));

  // distinct speed multipliers so no two balls (or a ball and the lines) match
  const cOpp  = shuffle(Array.from({ length: n - nSame }, (_, i) => cMin + i));
  const cSame = shuffle(Array.from({ length: nSame }, (_, i) => i + 1));

  const wL = dir * L;
  let oi = 0, si = 0;
  const balls = [];
  for (let i = 0; i < n; i++) {
    const w = sameIdx.has(i)
      ? dir * (L + cSame[si++] * base)               // same direction, never same speed
      : dir * (L - cOpp[oi++] * base);               // opposite direction
    balls.push({ w, off: randInt(0, k - 1), rf: n === 1 ? 0.6 : lerp(0.30, 0.92, i / (n - 1)) });
  }

  Object.assign(test, { k, T, W, wL, phi: Math.random() * TAU, balls, t: 0, next: T });
}

function reset() {
  state = "play"; score = 0; strikes = 0;
  invertT = 0; strikeT = 0; deadT = 0;
  newTest();
}

function die() {
  state = "dead"; deadT = 0;
  Audio.play("death");
}

function update(dt) {
  invertT = Math.max(0, invertT - dt);
  strikeT = Math.max(0, strikeT - dt);
  Audio.update(dt, state === "dead");

  if (state === "dead") { deadT += dt; return; }

  test.t += dt;

  // alignment window slipped by unclicked -> strike
  if (test.t > test.next + test.W) {
    strikes++;
    strikeT = 0.3;
    Audio.play("strike");
    if (strikes >= 2) { die(); return; }
    test.next += test.T;
  }
}

function press() {
  Audio.unlock();
  if (state === "dead") {
    if (deadT > 0.35) { reset(); Audio.play("blip"); }
    return;
  }
  if (Math.abs(test.t - test.next) <= test.W) {
    score++;
    invertT = 0.12;
    Audio.play("success");
    newTest();
  } else {
    die();                                           // tapped off-alignment
  }
}

// input -------------------------------------------------------------------
const canvas = document.getElementById("c");
const g = canvas.getContext("2d");

canvas.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
canvas.addEventListener("contextmenu", e => e.preventDefault());
addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); press(); }
  else if (e.code === "KeyM") toggleMute();
  else if (e.code === "KeyN") { Audio.unlock(); Audio.next(); }
});

const muteBtn = document.getElementById("mute");
function toggleMute() {
  Audio.unlock();
  muteBtn.style.textDecoration = Audio.toggleMute() ? "line-through" : "none";
}
muteBtn.addEventListener("pointerdown", e => e.stopPropagation());
muteBtn.addEventListener("click", e => { toggleMute(); e.currentTarget.blur(); });
const nextBtn = document.getElementById("next");
nextBtn.addEventListener("pointerdown", e => e.stopPropagation());
nextBtn.addEventListener("click", e => { Audio.unlock(); Audio.next(); e.currentTarget.blur(); });

// pause when the tab is hidden so a backgrounded game doesn't rack up strikes
document.addEventListener("visibilitychange", () => {
  if (document.hidden) Audio.suspend();
  else Audio.unlock();
});

// sizing ------------------------------------------------------------------
let W = 0, H = 0, safeTop = 0, safeBot = 0;
const sa = document.getElementById("sa");
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(sa);
  safeTop = parseFloat(cs.paddingTop) || 0;
  safeBot = parseFloat(cs.paddingBottom) || 0;
}
addEventListener("resize", resize);
resize();

// drawing -----------------------------------------------------------------
const rgba = (c, a = 1) =>
  `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;

function circle(mode, x, y, r) {
  g.beginPath();
  g.arc(x, y, r, 0, TAU);
  mode === "fill" ? g.fill() : g.stroke();
}

function text(str, y, size, color) {
  g.font = `${size}px ${FONT}`;
  g.fillStyle = color;
  g.textAlign = "center";
  g.textBaseline = "top";
  g.fillText(str, W / 2, y);
}

function draw() {
  const cx = W / 2, cy = H / 2;
  const R = Math.max(40, Math.min(W, H - safeTop - safeBot) / 2 - 56);
  const top = safeTop;

  let fg = FG, bg = BG;
  if (invertT > 0) { fg = BG; bg = FG; }
  if (state === "dead") fg = RED;

  g.fillStyle = rgba(bg);
  g.fillRect(0, 0, W, H);

  const t   = test.t;
  const ang = test.phi + test.wL * t;
  const pulse = Math.max(0, 1 - Math.abs(t - test.next) / test.W);

  // faint orbit rings
  g.lineWidth = 1;
  g.strokeStyle = rgba(fg, 0.07);
  for (const b of test.balls) circle("line", cx, cy, b.rf * R);

  // spokes
  g.lineWidth = 1.6;
  g.lineCap = "round";
  g.strokeStyle = rgba(fg, 0.85 + 0.15 * pulse);
  g.beginPath();
  for (let j = 0; j < test.k; j++) {
    const a = ang + j * TAU / test.k;
    g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
  }
  g.stroke();

  // center dot
  g.fillStyle = rgba(fg);
  circle("fill", cx, cy, 3.5);

  // balls
  const br = 7 * (1 + 0.35 * pulse);
  for (const b of test.balls) {
    const a = test.phi + b.off * TAU / test.k + b.w * t;
    const r = b.rf * R;
    circle("fill", cx + Math.cos(a) * r, cy + Math.sin(a) * r, br);
  }

  // HUD
  text(String(score), top + 26, 30, rgba(fg, 0.9));

  // strike dots
  {
    for (let i = 1; i <= 2; i++) {
      const x = cx + (i - 1.5) * 22;
      if (i <= strikes) {
        const a = (strikeT > 0 && i === strikes) ? 0.5 + 0.5 * strikeT / 0.3 : 0.9;
        g.fillStyle = rgba(RED, a);
        circle("fill", x, top + 74, 4.5);
      } else {
        g.lineWidth = 1;
        g.strokeStyle = rgba(fg, 0.35);
        circle("line", x, top + 74, 4.5);
      }
    }
  }

  // now playing (fades a few seconds after each track change)
  const [trackName, age] = Audio.nowPlaying();
  const ta = Math.min(1, Math.max(0, 1 - (age - 4) / 1.5)) * Math.min(1, age * 2);
  if (ta > 0 && trackName) {
    text("~ " + trackName, H - safeBot - 30, 14, rgba(fg, 0.35 * ta));
  }

  // death overlay
  if (state === "dead") {
    g.fillStyle = rgba(bg, 0.55);
    g.fillRect(0, 0, W, H);
    text(String(score), cy - 64, 56, rgba(RED));
    text("click to retry", cy + 10, 14, rgba(fg, 0.8));
  }
}

// main loop ---------------------------------------------------------------
reset();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);    // clamp: no huge jumps after a stall
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
