<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VOIDRAIL</title>
<style>
  :root { --danger: 0; --asc: 0; --paper: #E8E6DF; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--paper); overflow: hidden; }
  body {
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    color: #0D0D10; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* pressure vignette: close-danger heartbeat only (sky quad owns ambient) */
  #vig { position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 18vmin rgba(0,0,0,0.55);
    opacity: calc(var(--danger) * 0.34); transition: opacity 90ms linear; }
  #vig.lastlife { animation: heartbeat 1.15s ease-in-out infinite; }
  @keyframes heartbeat {
    0%, 100% { opacity: calc(var(--danger) * 0.34 + 0.12); }
    50%      { opacity: calc(var(--danger) * 0.34 + 0.02); }
  }

  .hud { position: absolute; pointer-events: none; letter-spacing: 0.14em; }
  #hudTL, #hudBL, #rail, #bossbar, #foot { opacity: calc(1 - var(--asc) * 0.25); }

  /* top-left: the ledger */
  #hudTL { top: 18px; left: 20px; line-height: 1.6; }
  #hudTL .lbl, #hudBL .lbl { font-size: 10px; opacity: 0.45; }
  #score { font-size: 20px; letter-spacing: 0.18em; }
  #hi { font-size: 10px; opacity: 0.32; }
  #graze { font-size: 11px; opacity: 0.55; transition: transform 120ms ease; }
  #graze.pop { transform: scale(1.25); }
  #ringv { font-size: 11px; opacity: 0.55; }

  /* bottom-left: the body */
  #hudBL { bottom: 18px; left: 20px; line-height: 1.6; }
  #lives, #bombs { font-size: 13px; letter-spacing: 0.3em; }
  #power i { display: inline-block; width: 10px; height: 3px; margin-right: 5px;
    border: none; background: #0D0D10; opacity: 0.18; }
  #power i.on { opacity: 1; }

  /* right edge: the rail — stage progress, three boss stations */
  #rail { top: 50%; right: 22px; transform: translateY(-50%);
    height: 46vh; width: 1px; background: rgba(13,13,16,0.32); }
  #rail i { position: absolute; right: 0; width: 5px; height: 1px;
    background: rgba(13,13,16,0.32); }
  #rail i.t1 { bottom: 33%; }
  #rail i.t2 { bottom: 66%; }
  #rail i.t3 { bottom: 100%; }
  #rail i.on { background: #0D0D10; }
  #railDot { position: absolute; right: -2px; bottom: 0; width: 5px; height: 5px;
    background: #0D0D10; border-radius: 50%; }

  #bossbar { top: 14px; left: 50%; transform: translateX(-50%);
    width: min(46vw, 560px); display: none; }
  #bossbar .rail { height: 4px; border: 1px solid rgba(13,13,16,0.55); padding: 1px; }
  #bossbar .fill { height: 100%; background: #0D0D10; width: 100%; transform-origin: left; }
  #bossbar .cap { font-size: 10px; opacity: 0.6; margin-top: 5px; text-align: center; letter-spacing: 0.4em; }

  /* whiteout overlay: above canvas + hud clusters, below #center text */
  #white { position: absolute; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 5; }

  #center { inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 2.2vmin; text-align: center; z-index: 6; }
  #center.veil { background: color-mix(in srgb, var(--paper) 62%, transparent); }
  #center .big { font-size: clamp(28px, 7vmin, 64px); letter-spacing: 0.5em; padding-left: 0.5em; font-weight: 300; }
  #center .sub { font-size: clamp(10px, 1.8vmin, 14px); opacity: 0.55; letter-spacing: 0.35em; line-height: 2.1; }
  #center .blink { animation: bl 1.1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0.15; } }
  #warn .big { animation: bl 0.45s steps(2) infinite; }
  .hidden { display: none !important; }

  /* stage card: THE RAIL — fade 0.4s, hold 1.6s, fade 0.6s */
  #stagecard { opacity: 0; }
  #stagecard.show { animation: card 2.6s linear forwards; }
  @keyframes card { 0% { opacity: 0; } 15% { opacity: 1; } 77% { opacity: 1; } 100% { opacity: 0; } }

  /* epiphany sequence: staged reveals */
  #clear .ep { opacity: 0; transition: opacity 0.8s linear; }
  #clear .ep.show { opacity: 1; }
  #clear .ep.dim { opacity: 0.25; }
  #clear .ep2 { opacity: 0; transition: opacity 1.2s ease; }
  #clear .ep2.show { opacity: 1; }

  #foot { bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 10px; opacity: 0.35; letter-spacing: 0.3em; white-space: nowrap; }

  #tapzone { position: absolute; inset: 0; touch-action: none; }
  .padBtn { position: absolute; bottom: 5vmin; width: 15vmin; height: 15vmin;
    max-width: 90px; max-height: 90px; border: 1px solid rgba(13,13,16,0.55); border-radius: 50%;
    color: rgba(13,13,16,0.75); background: rgba(255,255,255,0.5); font-size: 11px; letter-spacing: 0.2em;
    display: none; align-items: center; justify-content: center; font-family: inherit;
    touch-action: none; }
  #bombBtn { right: 4vmin; }
  #riseBtn { left: 4vmin; }
  @media (pointer: coarse) { .padBtn { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="vig"></div>

  <div class="hud" id="hudTL">
    <div class="lbl">SCORE</div><div class="val" id="score">0000000</div>
    <div class="lbl">HI</div><div class="val" id="hi">0000000</div>
    <div class="lbl">GRAZE</div><div class="val" id="graze">&#10022; 0</div>
    <div class="lbl">WORTH</div><div class="val" id="ringv">100</div>
  </div>
  <div class="hud" id="hudBL">
    <div class="lbl">SYNCHRO</div><div class="val" id="lives"></div>
    <div class="lbl">CALM</div><div class="val" id="bombs"></div>
    <div class="lbl">POWER</div><div class="val" id="power"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="hud hidden" id="rail"><i class="t1"></i><i class="t2"></i><i class="t3"></i><b id="railDot"></b></div>

  <div class="hud" id="bossbar">
    <div class="rail"><div class="fill" id="bossfill"></div></div>
    <div class="cap" id="bossname">GRACE</div>
  </div>

  <div id="white"></div>

  <div class="hud" id="center">
    <div id="title">
      <div class="big">VOIDRAIL</div>
      <div class="sub">SYNCHRO SLEEPS.</div>
      <div class="sub blink">Z &mdash; DREAM</div>
    </div>
    <div id="stagecard" class="hidden"><div class="big">THE RAIL</div></div>
    <div id="warn" class="hidden"><div class="big" id="warnBig">DUE</div></div>
    <div id="extend" class="hidden"><div class="sub" style="opacity:1">EXTEND &#9650;</div></div>
    <div id="pause" class="hidden"><div class="big">PAUSE</div><div class="sub blink">P</div></div>
    <div id="over" class="hidden">
      <div class="big">AWAKE</div>
      <div class="sub">TOO SOON.</div>
      <div class="sub" id="overStats"></div>
      <div class="sub blink">Z &mdash; SLEEP AGAIN</div>
    </div>
    <div id="clear" class="hidden">
      <div class="sub ep" id="cl1">YOU HELD ON ALL THE WAY UP.</div>
      <div class="sub ep" id="cl2">LET GO.</div>
      <div class="big ep2" id="clWord">ENOUGH.</div>
      <div class="sub ep2" id="clearStats"></div>
      <div class="sub ep2" id="clPrompt"><span class="blink">Z &mdash; ANOTHER NIGHT</span></div>
    </div>
  </div>

  <div class="hud" id="foot">MOVE WASD &middot; RISE SPACE &middot; FOCUS SHIFT &middot; CALM X &middot; PAUSE P &middot; MUTE M</div>
  <div id="tapzone"></div>
  <button class="padBtn" id="bombBtn">CALM</button>
  <button class="padBtn" id="riseBtn">RISE</button>
</div>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
if (!gl) document.body.innerHTML = '<div style="padding:2em;font-family:monospace;color:#0D0D10">WebGL2 is required.</div>';

// --------------------------------------------------------- gl helpers -----
function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

// mat4 (column-major)
function persp(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function lookAt(e, c) {
  let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
  let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = -zz, xy = 0, xz = zx; // up=(0,1,0) cross
  l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
  // y = x cross z (NOT z cross x): keeps world +x on screen-right AND +y up
  const yx = xy * zz - xz * zy, yy = xz * zx - xx * zz, yz = xx * zy - xy * zx;
  return {
    m: new Float32Array([
      xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
      -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]),
    right: [xx, xy, xz], up: [yx, yy, yz]
  };
}
function mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}

const SPRITE_VS = `#version 300 es
layout(location=0) in vec2 q;
layout(location=1) in vec4 i0; // x,y,z,size
layout(location=2) in vec4 i1; // r,g,b,style+anim
uniform mat4 uVP;
uniform vec3 uRight, uUp, uFwd;
out vec2 vUv;
flat out float vStyle;
flat out float vAnim;
out vec3 vCol;
out float vFog;
void main() {
  float style = floor(i1.w);
  float anim = fract(i1.w);
  vec3 wp;
  if (style == 10.0 || style == 12.0) {
    // shadow / reticle: a quad lying IN the ground plane, not a billboard
    wp = vec3(i0.x, i0.y, i0.z) + vec3(q.x, 0.0, q.y) * i0.w;
  } else if (style == 11.0) {
    // altitude pillar: thin quad standing on world-up
    wp = vec3(i0.x, i0.y, i0.z) + uRight * q.x * 0.05 + vec3(0.0, 1.0, 0.0) * q.y * i0.w;
  } else {
    vec3 upAxis = (style == 3.0) ? uFwd : uUp;
    float ys = (style == 3.0) ? 2.1 : 1.0;
    wp = vec3(i0.x, i0.y, i0.z) + uRight * q.x * i0.w + upAxis * q.y * i0.w * ys;
  }
  gl_Position = uVP * vec4(wp, 1.0);
  vUv = q;
  vStyle = style;
  vAnim = anim;
  vCol = i1.rgb;
  vFog = clamp((24.5 - i0.z) / 8.5, 0.0, 1.0);
}`;

      a *= 1.0 - (1.0 - smoothstep(0.02, 0.06, abs(dd - 0.50))) * 0.55;
    }
  } else if (st == 3) {                // player shot: dark streak
    float w = exp(-9.0 * vUv.x * vUv.x);
    float t = smoothstep(1.0, -0.6, vUv.y);
    col = vec3(0.10, 0.13, 0.20);
    a = w * t * 0.6;
  } else if (st == 4) {                // spark
    float k = 1.0 - vAnim;
    float dot_ = smoothstep(1.0, 0.0, d);
    col = vCol;
    a = dot_ * k;
  } else if (st == 5) {                // shockwave: expanding ink ring
    float k = vAnim;
    float rad = 0.15 + k * 0.85;
    float band = 1.0 - smoothstep(0.0, 0.10 + k * 0.1, abs(d - rad));
    col = INK;
    a = band * (1.0 - k) * 0.8;
  } else if (st == 6) {                // player: thin dart, swallowtail, cold thruster
    vec2 p = vUv;
    float body = step(abs(p.x) * 1.9 - 0.95, -p.y) * step(-0.62 + abs(p.x) * 0.95, p.y);
    body *= 1.0 - step(abs(p.x), 0.16) * step(p.y, -0.38); // tail notch
    float tl = 1.0 + uRise * 0.6;      // climbing lengthens the flame
    float thr = smoothstep(0.25, 0.0, abs(p.x)) * smoothstep(-0.55, -0.55 - 0.45 * tl, p.y)
              * (0.6 + 0.4 * (1.0 + 0.3 * uRise) * sin(uTime * 40.0));
    col = mix(INK, vec3(0.08, 0.22, 0.55), clamp(thr * 2.0, 0.0, 1.0));
    a = max(body, thr * 0.7);
  } else if (st == 7) {                // player TRUE hitbox: white core, ink ring at the kill edge
    float ring = smoothstep(0.34, 0.42, d) - smoothstep(0.50, 0.60, d);
    float fillW = 1.0 - smoothstep(0.30, 0.40, d);
    float pin = 1.0 - smoothstep(0.08, 0.16, d);
    col = mix(vec3(1.0), INK, max(clamp(ring, 0.0, 1.0), pin));
    a = max(fillW * 0.95, clamp(ring, 0.0, 1.0) * 0.95);
    a = max(a, pin);
  } else if (st == 8) {                // power chip: magenta square
    vec2 p = rot(vUv, vAnim * 6.2831853);
    float sq = max(abs(p.x), abs(p.y));
    float edge = 1.0 - smoothstep(0.0, 0.16, abs(sq - 0.62));
    float bar = (1.0 - smoothstep(0.0, 0.14, abs(p.y))) * step(abs(p.x), 0.4);
    col = vCol * 0.9;
    a = max(edge, bar);
  } else if (st == 10) {               // ground shadow, tinted by owner color
    float h = vAnim;                   // altitude, 0..1 of max
    // objects near YOUR altitude cast a darker, more present shadow
    float lv = 1.0 - smoothstep(0.075, 0.24, abs(h - uPY));
    // crisp edge: mostly-solid disc with a short falloff; a touch sharper
    // still when the caster is at your level
    float inner = mix(0.60, 0.20, h) + 0.10 * lv;
    float aa = (1.0 - smoothstep(inner, 1.0, d)) * 0.55 * (1.0 - 0.45 * h);
    col = mix(INK, vCol * 0.48 + 0.02, step(0.05, vCol.r + vCol.g + vCol.b));
    a = aa * (0.50 + 0.60 * lv);
  } else if (st == 12) {               // player ground reticle: crisp ring + crosshair
    float ring = smoothstep(0.42, 0.50, d) - smoothstep(0.58, 0.66, d);
    float cross = (1.0 - smoothstep(0.030, 0.075, min(abs(vUv.x), abs(vUv.y))))
                * smoothstep(0.98, 0.72, d) * step(0.30, d);
    float pin = 1.0 - smoothstep(0.05, 0.11, d);
    col = INK;
    a = max(max(clamp(ring, 0.0, 1.0) * 0.85, cross * 0.55), pin * 0.9);
  } else if (st == 13) {               // graze boundary: honest radius, flashes on graze
    float k = vAnim;                   // 0 = fresh graze -> 1 = idle
    float flash = 1.0 - k;
    float w = 0.045 + flash * 0.10;
    float ring = 1.0 - smoothstep(0.0, w, abs(d - 0.90));
    // idle: faint ink guide while focused; graze: bright pulse in the bullet's color
    col = mix(INK, vCol * 0.75, clamp(flash * 1.6, 0.0, 1.0));
    a = ring * (uFocus * 0.20 + flash * flash * 0.85);
  } else if (st == 11) {               // altitude pillar: faint vertical thread
    col = vec3(0.12);
    a = 0.20 * (1.0 - abs(vUv.y) * 0.5) * exp(-3.0 * vUv.x * vUv.x);
  } else if (st == 14) {               // LENS — sweeper: a thin eye that banks
    float fl = clamp((1.0 - vCol.g) * 2.5, 0.0, 1.0);
    vec2 p = rot(vUv, (vAnim - 0.5) * 0.42);   // anim = bank, ±12°
    float f = 1.0 - smoothstep(0.55, 0.62, abs(p.x));
    a = f * (1.0 - smoothstep(0.16 * (1.0 - p.x * p.x), 0.22, abs(p.y)));
    col = INK + fl * 0.60;
  } else if (st == 15) {               // TRIBLADE — spinner: three 120° kite blades
    float fl = clamp((1.0 - vCol.g) * 2.5, 0.0, 1.0);
    vec2 p = rot(vUv, vAnim * 6.2831853);      // anim = spin
    float an = mod(atan(p.y, p.x) + 1.5707963, 2.0943951) - 1.0471976;
    vec2 q2 = length(p) * vec2(sin(an), cos(an)); // fold into one sector, blade on +y
    float bd = abs(q2.x) * 2.6 + abs(q2.y - 0.3);
    a = 1.0 - smoothstep(0.58, 0.66, bd);
    col = INK + fl * 0.60;
  } else if (st == 16) {               // GATE — curtain: torii uprights + lintel
    float fl = clamp((1.0 - vCol.g) * 2.5, 0.0, 1.0);
    float w2 = 0.42 * (1.0 + 0.04 * sin(vAnim * 6.2831853)); // 4% width pulse
    float bar = (1.0 - smoothstep(0.10, 0.17, abs(abs(vUv.x) - w2))) * step(vUv.y, 0.60);
    float lintel = (1.0 - smoothstep(0.07, 0.14, abs(vUv.y - 0.58)))
                 * (1.0 - smoothstep(0.62, 0.72, abs(vUv.x)));
    a = max(bar, lintel);
    col = INK + fl * 0.60;
  }
  o = vec4(col, a * vFog);
}`;

const GRID_VS = `#version 300 es
layout(location=0) in vec4 aPos;  // x,y,z,scrollFlag
layout(location=1) in float aBr;
uniform mat4 uVP;
uniform float uScroll;
uniform vec3 uBomb;               // x, z, age (0..2 live; big = idle)
out float vBr;
out float vFog;
void main() {
  float z = aPos.w > 0.5 ? mod(aPos.z - uScroll, 26.0) : aPos.z;
  float y = aPos.y;
  // bomb ripple: the ground shudders outward with the clearing ring
  float bd = distance(vec2(aPos.x, z), uBomb.xy) - uBomb.z * 11.0;
  y += 0.22 * exp(-bd * bd * 0.4) * max(0.0, 1.0 - uBomb.z * 0.5);
  gl_Position = uVP * vec4(aPos.x, y, z, 1.0);
  vBr = aBr;
  vFog = clamp((24.5 - z) / 8.5, 0.0, 1.0) * smoothstep(-0.5, 0.8, z);
}`;

const GRID_FS = `#version 300 es
precision mediump float;
in float vBr;
in float vFog;
uniform float uPulse;
uniform float uAsc;   // ascension: the drawing dissolves into the light
out vec4 o;
void main() {
  float b = vBr * vFog * (0.9 + uPulse * 0.4) * (1.0 - 0.55 * uAsc);
  o = vec4(vec3(0.051, 0.051, 0.063), clamp(b, 0.0, 1.0));
}`;

// sky: one fullscreen triangle — paper gradient, epiphany disc, bleach,
// death dip, danger pressure, dread dim. Drawn first, before the grid.
const SKY_VS = `#version 300 es
out vec2 ndc;
void main() {
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  ndc = p;
  gl_Position = vec4(p, 0.9999, 1.0);
}`;

const SKY_FS = `#version 300 es
precision mediump float;
in vec2 ndc;
uniform vec3  uPaper;   // paper at current A
uniform float uAsc;     // ascension scalar
uniform float uFlash;   // bleach flash (boss/phase deaths, bomb)
uniform float uDip;     // death dip: the dream falters gray
uniform float uDread;   // boss-incoming darkening
uniform float uDanger;  // hud[13]
uniform vec2  uVanish;  // NDC of the corridor vanishing point
uniform float uAspect;
out vec4 o;
void main() {
  vec2 uv = ndc;
  // ground slightly darker than sky above the horizon line -> depth for free
  float horiz = smoothstep(uVanish.y - 0.35, uVanish.y + 0.25, uv.y);
  vec3 c = mix(uPaper * 0.965, uPaper, horiz);
  // epiphany disc: white core, faint warm fringe; radius grows with A
  float d = distance(uv * vec2(uAspect, 1.0), uVanish * vec2(uAspect, 1.0));
  float rDisc = mix(0.035, 1.9, uAsc * uAsc);
  c = mix(c, vec3(1.0, 0.965, 0.87), smoothstep(rDisc + 0.30, rDisc, d) * 0.5);
  c = mix(c, vec3(1.0), smoothstep(rDisc + 0.06, rDisc - 0.02, d));
  // danger pressure: paper cools at the edges (ambient half of the vignette)
  c *= 1.0 - uDanger * 0.10 * smoothstep(0.5, 1.4, length(uv));
  c *= 1.0 - uDread * 0.06;                       // the drawing tenses
  c = mix(c, vec3(1.0), clamp(uFlash, 0.0, 1.0)); // bleach
  c = mix(c, vec3(0.62, 0.61, 0.63), clamp(uDip, 0.0, 1.0)); // dream falters
  o = vec4(c, 1.0);
}`;

function auEnterEpiphany() {

  auPadsSilence(now);

  auApplySection('epiphany', now);

  auEpBar = 0; auStep = 0; auNext = now + 1.0;

function auEnterGameover() {

function auDirector(hud, events) {

        auRiser(ac.currentTime, auTimeToNextBar() + auBarLen());
        if (stageT >= 125) auPending = 'lull'; break;
      case 12: auPending = 'subA'; auRoar(ac.currentTime); break;   // GRACE
      case 13: auPending = 'subB'; auRoar(ac.currentTime); break;   // INTEREST
      case 14: auPending = 'bossP1'; auRoar(ac.currentTime); break; // PRINCIPAL
      case 11:                                      // TERM -> BALANCE -> MATURITY
        auSlam();

    if (auSection === 'title' && !auPending) auPending = 'intro';
    if (auSection === 'gameover' && !auPending) auPending = 'intro';

  }
  if (bombPulse > 0) { b |= 32; bombPulse--; }
  if (pausePulse > 0) { b |= 64; pausePulse--; }
  if (startPulse > 0) { b |= 128; startPulse--; }
  return b;
}

// ------------------------------------------------------------- hud --------
const $ = id => document.getElementById(id);
const root = document.documentElement;
const el = {
  score: $('score'), hi: $('hi'), lives: $('lives'), bombs: $('bombs'),
  power: $('power').children, graze: $('graze'), ringv: $('ringv'),
  bossbar: $('bossbar'), bossfill: $('bossfill'), bossname: $('bossname'),
  title: $('title'), warn: $('warn'), warnBig: $('warnBig'),
  pause: $('pause'), over: $('over'), clear: $('clear'), extend: $('extend'),
  overStats: $('overStats'), clearStats: $('clearStats'),
  center: $('center'), vig: $('vig'), foot: $('foot'), white: $('white'),
  stagecard: $('stagecard'), rail: $('rail'), railDot: $('railDot'),
  t1: $('rail').children[0], t2: $('rail').children[1], t3: $('rail').children[2],
  cl1: $('cl1'), cl2: $('cl2'), clWord: $('clWord'), clPrompt: $('clPrompt'),
};
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('voidrail_hi') || '0') || 0; } catch (e) {}
el.hi.textContent = String(hiScore).padStart(7, '0');
const pad7 = n => String(Math.round(n)).padStart(7, '0');
let lastHud = new Array(20).fill(-999);
function setVis(node, on) { node.classList.toggle('hidden', !on); }
function cls(node, c, on) { node.classList.toggle(c, on); }

// ---- visual state: the ascension arc + feedback (design §0, contract §4) --
let asc = 0, ascendBonus = 0, flash = 0, dip = 0, dread = 0, gridSpike = 0;
let epiph = false, phaseSteps = 0, subDeaths = 0;
let stopT = 0, stopFactor = 1;              // hit-stop: sim slows, render breathes
let bombAge = 9, bombX = 0;                 // grid ripple source
let clearT = -1, released = false, relT = 0, holdT = 0; // epiphany sequence
let stageCardT = 0, railP = 0, lastRailP = -1, grazeTO = 0;
let shakeT = 0, sjx = 0, sjy = 0;           // 30 Hz quantized shake
let camY = 10.9, tgtY = 0, pxE = 0, riseE = 0;
let lastWo = -1, lastAscCss = -1, lastPaperCss = '', lastDangerCss = -1;

function resetClearDom() {
  el.cl1.classList.remove('show', 'dim');
  el.cl2.classList.remove('show', 'dim');
  el.clWord.classList.remove('show');
  el.clearStats.classList.remove('show');
  el.clPrompt.classList.remove('show');
  el.white.style.opacity = '0';
}

function updateHud(hud) {
  if (hud[0] !== lastHud[0]) {
    el.score.textContent = pad7(hud[0]);
    if (hud[0] > hiScore) { hiScore = hud[0]; el.hi.textContent = pad7(hiScore); }
  }
  if (hud[1] !== lastHud[1]) el.lives.textContent = '▲ '.repeat(Math.max(0, hud[1])) || '—';
  if (hud[2] !== lastHud[2]) el.bombs.textContent = '◆ '.repeat(Math.max(0, hud[2])) || '—';
  if (hud[3] !== lastHud[3]) for (let i = 0; i < 4; i++) el.power[i].classList.toggle('on', i < hud[3]);
  if (hud[12] !== lastHud[12]) {
    el.graze.textContent = '✦ ' + hud[12];
    if (hud[12] > lastHud[12] && hud[6] === 1) {   // 120 ms scale pop
      el.graze.classList.add('pop');
      clearTimeout(grazeTO);
      grazeTO = setTimeout(() => el.graze.classList.remove('pop'), 130);
    }
  }
  if (hud[15] !== lastHud[15]) el.ringv.textContent = hud[15];

  const state = hud[6];
  const bossOn = hud[5] >= 0;
  el.bossbar.style.display = bossOn ? 'block' : 'none';
  if (bossOn) {
    el.bossfill.style.transform = `scaleX(${hud[5]})`;
    const st = hud[10];
    if (st < 60) el.bossname.textContent = 'GRACE';
    else if (st < 110) el.bossname.textContent = 'INTEREST';
    else {
      const ph = Math.min(2, Math.max(0, Math.round(hud[11])));
      el.bossname.textContent = 'PRINCIPAL · ' + ['TERM', 'BALANCE', 'MATURITY'][ph];
    }
  }

  const warnOn = state === 1 && hud[7] === 1 && hud[8] > 0;
  if (warnOn) el.warnBig.textContent = hud[10] >= 110 ? 'PAST DUE' : 'DUE';
  setVis(el.warn, warnOn);
  setVis(el.title, state === 0);
  setVis(el.pause, state === 5);
  setVis(el.extend, state === 1 && hud[7] === 4 && hud[8] > 0);
  setVis(el.foot, state === 0);
  setVis(el.rail, state === 1 || state === 4 || state === 5);
  cls(el.vig, 'lastlife', state === 1 && hud[1] === 0);
  cls(el.center, 'veil', state === 5);
  el.t1.classList.toggle('on', subDeaths >= 1);
  el.t2.classList.toggle('on', subDeaths >= 2);
  el.t3.classList.toggle('on', epiph || state === 4);

  // near-waking: the dream grays when a life is lost
  if (state === 1 && lastHud[6] === 1 && hud[1] < lastHud[1]) dip = Math.max(dip, 0.85);

  // a fresh run: another night of the recurring dream
  if (state === 1 && (lastHud[6] === 0 || lastHud[6] === 3 || lastHud[6] === 4)) {
    ascendBonus = 0; phaseSteps = 0; subDeaths = 0; epiph = false;
    flash = 0; dip = 0; gridSpike = 0; bombAge = 9;
    if (lastHud[6] !== 0) asc = 0;  // retry: the light starts over
    clearT = -1; released = false; holdT = 0;
    resetClearDom();
    if (lastHud[6] === 0) {         // stage card, first descent only
      stageCardT = 2.7;
      el.stagecard.classList.remove('hidden');
      el.stagecard.classList.add('show');
    }
  }
  if (state === 3 && lastHud[6] !== 3) {   // waking too soon: a jolt
    el.overStats.innerHTML = `SCORE ${pad7(hud[0])} &middot; GRAZE ${hud[12]} &middot; RINGS ${hud[4]}`;
    saveHi();
    ascendBonus = 0; flash = 0; dip = 1;
  }
  if (state === 4 && lastHud[6] !== 4) {
    el.clearStats.innerHTML = `SCORE ${pad7(hud[0])} &middot; GRAZE ${hud[12]} &middot; RINGS ${hud[4]}`;
    saveHi();
    epiph = true;
  }
  setVis(el.over, state === 3);
  setVis(el.clear, state === 4);
  if (Math.abs(hud[13] - lastDangerCss) > 0.005) {
    root.style.setProperty('--danger', hud[13].toFixed(2));
    lastDangerCss = hud[13];
  }
  for (let i = 0; i < 20; i++) lastHud[i] = hud[i];  // no per-frame allocation
}
function saveHi() { try { localStorage.setItem('voidrail_hi', String(Math.round(hiScore))); } catch (e) {} }

// ------------------------------------------------------------ main --------
let playing = false;
WebAssembly.instantiate(b64ToBytes(WASM_B64), {}).then(({ instance }) => {
  const ex = instance.exports;
  ex.vr_init((Math.random() * 0xffffffff) >>> 0);
  const mem = ex.memory.buffer;
  const inst = new Float32Array(mem, ex.vr_inst_ptr(), INST_MAX * STRIDE);
  const hud = new Float32Array(mem, ex.vr_hud_ptr(), 20);
  const snds = new Uint32Array(mem, ex.vr_snd_ptr(), 48);

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = Math.floor(innerWidth * dpr); H = Math.floor(innerHeight * dpr);
    cv.width = W; cv.height = H;
    gl.viewport(0, 0, W, H);
  }
  addEventListener('resize', resize);
  resize();

  const uS = {
    vp: gl.getUniformLocation(pSprite, 'uVP'),
    right: gl.getUniformLocation(pSprite, 'uRight'),
    up: gl.getUniformLocation(pSprite, 'uUp'),
    fwd: gl.getUniformLocation(pSprite, 'uFwd'),
    time: gl.getUniformLocation(pSprite, 'uTime'),
    py: gl.getUniformLocation(pSprite, 'uPY'),
    focus: gl.getUniformLocation(pSprite, 'uFocus'),
    rise: gl.getUniformLocation(pSprite, 'uRise'),
  };
  const uG = {
    vp: gl.getUniformLocation(pGrid, 'uVP'),
    scroll: gl.getUniformLocation(pGrid, 'uScroll'),
    pulse: gl.getUniformLocation(pGrid, 'uPulse'),
    asc: gl.getUniformLocation(pGrid, 'uAsc'),
    bomb: gl.getUniformLocation(pGrid, 'uBomb'),
  };
  const uK = {
    paper: gl.getUniformLocation(pSky, 'uPaper'),
    asc: gl.getUniformLocation(pSky, 'uAsc'),
    flash: gl.getUniformLocation(pSky, 'uFlash'),
    dip: gl.getUniformLocation(pSky, 'uDip'),
    dread: gl.getUniformLocation(pSky, 'uDread'),
    danger: gl.getUniformLocation(pSky, 'uDanger'),
    vanish: gl.getUniformLocation(pSky, 'uVanish'),
    aspect: gl.getUniformLocation(pSky, 'uAspect'),
  };

  let scroll = 0, last = performance.now(), time = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;

    // hit-stop (contract §4): sim slows, the render clock keeps breathing
    const sdt = dt * (stopT > 0 ? stopFactor : 1);
    if (stopT > 0) stopT -= dt;

    const bits = inputBits();
    const n = ex.vr_frame(sdt, bits);
    playing = hud[6] === 1;
    const state = hud[6];

    // sound events -> collected once, consumed by audio AND visuals
    const sc = ex.vr_snd_count();
    const events = [];
    for (let i = 0; i < sc; i++) events.push(snds[i]);
    audioFrame(hud, events, dt);
    for (let i = 0; i < events.length; i++) {
      const ev = events[i];
      if (ev === 4) {              // bomb: ground ripple + partial bleach
        bombAge = 0; bombX = hud[19];
        flash = Math.min(1, flash + 0.35);
      } else if (ev === 11) {      // boss phase change
        ascendBonus += phaseSteps === 0 ? 0.08 : 0.07;
        phaseSteps++;
        flash = 1; gridSpike = 0.6;
        stopT = 0.12; stopFactor = 0.35;
      } else if (ev === 15) {      // GRACE / INTEREST death
        subDeaths++;
        ascendBonus += 0.10;
        flash = 1; gridSpike = 0.6;
      } else if (ev === 10) {      // boss/sub-boss boom
        stopT = 0.18; stopFactor = 0.15;
      } else if (ev === 16) {      // PRINCIPAL death: the epiphany
        epiph = true; flash = 1;
      }
    }

    // ascension scalar A — one number drives the whole arc
    let target;
    if (state === 0) target = 0.15;                       // attract: dawn light
    else if (state === 3) target = 0;                     // waking: light drains
    else if (state === 4 || epiph) target = 1.0;          // epiphany
    else target = Math.min(Math.min(hud[10], 133.5) / 133.5 * 0.55 + ascendBonus, 0.85);
    const kA = state === 3 ? 3.0 : (target - asc > 0.05 ? 1.6 : 0.25);
    asc += (target - asc) * Math.min(1, dt * kA);

    flash *= Math.exp(-dt * 3.5);
    dip *= Math.exp(-dt * 2.2);
    gridSpike *= Math.exp(-dt * 3.0);
    const dreadOn = state === 1 && hud[7] === 1 && hud[8] > 0;
    dread += ((dreadOn ? 1 : 0) - dread) * Math.min(1, dt * 4);
    if (bombAge < 9) bombAge += sdt;
    riseE += (((bits & 256) && state === 1 ? 1 : 0) - riseE) * Math.min(1, dt * 10);

    // stage card timer
    if (stageCardT > 0) {
      stageCardT -= dt;
      if (stageCardT <= 0) { el.stagecard.classList.remove('show'); el.stagecard.classList.add('hidden'); }
    }

    // epiphany sequence (plot §3.9) — clearT clock + the release gate
    if (state === 4) {
      if (clearT < 0) { clearT = 0; released = false; holdT = 0; }
      clearT += dt;
      const wo = Math.min(1, Math.max(0, (clearT - 2.5) / 3.0));
      if (wo !== lastWo) { el.white.style.opacity = wo.toFixed(3); lastWo = wo; }
      cls(el.cl1, 'show', clearT >= 5.5);
      cls(el.cl2, 'show', clearT >= 7.5);
      if (!released && clearT >= 7.5) {
        // the game waits for the player's hands to open
        if (bits === 0 && !touch.active) holdT += dt; else holdT = 0;
        if (holdT >= 0.4 || clearT >= 15.5) { released = true; relT = clearT; }
      }
      const r = released ? clearT - relT : -1;
      cls(el.cl1, 'dim', r >= 1.2);
      cls(el.cl2, 'dim', r >= 1.2);
      cls(el.clWord, 'show', r >= 1.2);
      cls(el.clearStats, 'show', r >= 3.0);
      cls(el.clPrompt, 'show', r >= 4.2);
    } else if (clearT >= 0) {
      clearT = -1; released = false; holdT = 0; lastWo = -1;
      resetClearDom();
    }

    // camera: quantized half-shake (play only) + altitude breathing + parallax
    shakeT -= dt;
    if (shakeT <= 0) { shakeT = 1 / 30; sjx = Math.random() - 0.5; sjy = Math.random() - 0.5; }
    const sh_ = state === 1 ? hud[9] : 0;
    const jx = sjx * sh_ * 0.25;
    const jy = sjy * sh_ * 0.18;
    const pyw = hud[16] * 3.2;
    camY += (10.8 + pyw * 0.30 - camY) * Math.min(1, dt * 3);
    tgtY += (pyw * 0.35 - tgtY) * Math.min(1, dt * 3);
    pxE += (hud[19] - pxE) * Math.min(1, dt * 3);
    let eyeY = camY;
    if (state === 0 || state === 4) eyeY += 0.12 * Math.sin(time * 0.5); // idle breath
    const eye = [jx + pxE * 0.10, eyeY + jy, -8.2];
    const cen = [jx * 0.4, tgtY, 9];
    const view = lookAt(eye, cen);
    const vp = mul(persp(48 * Math.PI / 180, W / H, 1, 80), view.m);
    // world-forward on the billboard plane
    let fx = 0, fy = 0, fz = 1;
    {
      const dirx = cen[0] - eye[0], diry = cen[1] - eye[1], dirz = cen[2] - eye[2];
      const dl = Math.hypot(dirx, diry, dirz);
      const dx = dirx / dl, dy = diry / dl, dz = dirz / dl;
      const dotp = dz; // Z·dir
      fx = 0 - dotp * dx; fy = 0 - dotp * dy; fz = 1 - dotp * dz;
      const fl = Math.hypot(fx, fy, fz);
      fx /= fl; fy /= fl; fz /= fl;
    }
    // vanishing point of the corridor = where the epiphany disc sits
    const vw = vp[11] * FZ + vp[15];
    const vanX = (vp[8] * FZ + vp[12]) / vw;
    const vanY = (vp[9] * FZ + vp[13]) / vw;

    // paper color at current A
    const sA = asc < 0 ? 0 : asc > 1 ? 1 : asc;
    const ss = sA * sA * (3 - 2 * sA);
    const pr = 0.9098 + (1 - 0.9098) * ss;   // #E8E6DF -> #FFFFFF
    const pg = 0.9020 + (1 - 0.9020) * ss;
    const pb = 0.8745 + (1 - 0.8745) * ss;
    if (Math.abs(asc - lastAscCss) > 0.003) {
      root.style.setProperty('--asc', asc.toFixed(3));
      lastAscCss = asc;
    }
    const paperCss = 'rgb(' + Math.round(pr * 255) + ',' + Math.round(pg * 255) + ',' + Math.round(pb * 255) + ')';
    if (paperCss !== lastPaperCss) { root.style.setProperty('--paper', paperCss); lastPaperCss = paperCss; }

    // rail dot: the ascent, eased
    const railTarget = (state === 4 || epiph) ? 1 : Math.min(hud[10], 133.5) / 133.5;
    railP += (railTarget - railP) * Math.min(1, dt * 8);
    if (Math.abs(railP - lastRailP) > 0.002) {
      el.railDot.style.bottom = 'calc(' + (railP * 100).toFixed(2) + '% - 2px)';
      lastRailP = railP;
    }

    if (playing || state === 5) scroll = (scroll + sdt * (playing ? 6.0 : 0)) % 26;
    else scroll = (scroll + dt * 2.0) % 26;

    gl.clearColor(pr, pg, pb, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // sky: paper gradient + epiphany disc + bleach/dip/dread — drawn first
    gl.useProgram(pSky);
    gl.bindVertexArray(vaoSky);
    gl.uniform3f(uK.paper, pr, pg, pb);
    gl.uniform1f(uK.asc, asc);
    gl.uniform1f(uK.flash, flash);
    gl.uniform1f(uK.dip, dip);
    gl.uniform1f(uK.dread, dread);
    gl.uniform1f(uK.danger, hud[13]);
    gl.uniform2f(uK.vanish, vanX, vanY);
    gl.uniform1f(uK.aspect, W / H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(pGrid);
    gl.bindVertexArray(vaoG);
    gl.uniformMatrix4fv(uG.vp, false, vp);
    gl.uniform1f(uG.scroll, scroll);
    gl.uniform1f(uG.pulse, hud[13] * 0.6 + sh_ * 0.4 + dread * 0.35 + gridSpike);
    gl.uniform1f(uG.asc, asc);
    gl.uniform3f(uG.bomb, bombX, 3.0, bombAge);
    gl.drawArrays(gl.LINES, 0, gridVerts);

    if (n > 0) {
      gl.useProgram(pSprite);
      gl.bindVertexArray(vaoS);
      gl.bindBuffer(gl.ARRAY_BUFFER, instB);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst.subarray(0, n * STRIDE));
      gl.uniformMatrix4fv(uS.vp, false, vp);
      gl.uniform3fv(uS.right, view.right);
      gl.uniform3fv(uS.up, view.up);
      gl.uniform3f(uS.fwd, fx, fy, fz);
      gl.uniform1f(uS.time, time);
      gl.uniform1f(uS.py, hud[16]);
      gl.uniform1f(uS.focus, hud[17]);
      gl.uniform1f(uS.rise, riseE);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
    }

    updateHud(hud);
  }
  requestAnimationFrame(frame);
}).catch(e => {
  document.body.innerHTML = '<div style="padding:2em;font-family:monospace;color:#0D0D10">Failed to start: ' + e + '</div>';
});
</script>
</body>
</html>
