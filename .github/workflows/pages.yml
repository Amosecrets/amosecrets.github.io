name: Deploy site
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
 
      - name: Build Gravel story index
        run: python3 games/gravel/build-index.py
 
      - uses: actions/configure-pages@v5
 
      # Builds the site the same way GitHub's default "deploy from branch" does
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
 
      - uses: actions/upload-pages-artifact@v3
 
      - id: deployment
        uses: actions/deploy-pages@v4
