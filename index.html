function bocpd(x) {
  const H = 1 / 30, a0 = 1, b0 = 1, CAP = 150;
  let R = [1], A = [a0], B = [b0];
  for (const v of x) {
    const n = R.length;
    const pred = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = A[i], b = B[i];
      let lp = a * Math.log(b / (b + 1)) + v * Math.log(1 / (b + 1));
      for (let k = 0; k < v; k++) lp += Math.log((a + k) / (k + 1));
      pred[i] = Math.exp(lp);
    }
    const R2 = new Array(n + 1).fill(0);
    let cp = 0;
    for (let i = 0; i < n; i++) {
      const m = R[i] * pred[i];
      R2[i + 1] = m * (1 - H);
      cp += m * H;
    }
    R2[0] = cp;
    let s = 0;
    for (const r of R2) s += r;
    if (!s || !isFinite(s)) { R = [1]; A = [a0]; B = [b0]; continue; }
    const A2 = [a0], B2 = [b0];
    for (let i = 0; i < n; i++) { A2.push(A[i] + v); B2.push(B[i] + 1); }
    R = R2.map(r => r / s); A = A2; B = B2;
    if (R.length > CAP) {
      R = R.slice(0, CAP); A = A.slice(0, CAP); B = B.slice(0, CAP);
      let t = 0; for (const r of R) t += r;
      if (t) R = R.map(r => r / t);
    }
  }
  let erl = 0, map = 0, bm = -1;
  R.forEach((r, i) => { erl += r * i; if (r > bm) { bm = r; map = i; } });
  return { erl, map };
}

function medGap(g) {

  for (let i = 1; i < log.length; i++) gaps.push(log[i] - log[i - 1]);
  gaps.sort((a, b) => a - b);
  return gaps[Math.floor(gaps.length / 2)] || 86400000;
}

const hkCache = {};
function hawkesFit(g) {
  const log = vlog[g];
  if (!log || log.length < 3) return null;
  const key = g + ":" + log.length + ":" + log[log.length - 1];
  if (hkCache[key]) return hkCache[key];
  const t0 = log[0];
  const ts = log.map(t => (t - t0) / 86400000);
  const n = ts.length;
  const T = Math.max((Date.now() - t0) / 86400000, ts[n - 1] + 0.01, 0.1);
  const a = 0.5;
  const mu = Math.max(a * n / T, 1e-3);
  let best = null;
  for (const beta of [0.25, 0.5, 1, 2, 4, 8]) {
    let ll = 0, Ai = 0;
    for (let i = 0; i < n; i++) {
      if (i > 0) Ai = (Ai + a * beta) * Math.exp(-beta * (ts[i] - ts[i - 1]));
      ll += Math.log(mu + Ai);
    }
    let comp = mu * T;
    for (const ti of ts) comp += a * (1 - Math.exp(-beta * (T - ti)));
    ll -= comp;
    if (!best || ll > best.ll) best = { ll, beta };
  }
  let Ai = 0;
  for (let i = 1; i < n; i++) Ai = (Ai + a * best.beta) * Math.exp(-best.beta * (ts[i] - ts[i - 1]));
  const nowT = Math.max((Date.now() - t0) / 86400000, ts[n - 1]);
  Ai = (Ai + a * best.beta) * Math.exp(-best.beta * (nowT - ts[n - 1]));
  const out = { beta: best.beta, mu, lam: mu + Ai };
  hkCache[key] = out;
  return out;
}

function woldEgap(g) {
  const log = vlog[g];
  if (!log || log.length < 7) return null;
  const lg = [];
  for (let i = 1; i < log.length; i++)
    lg.push(Math.log(Math.max(log[i] - log[i - 1], 60000)));
  const a = lg.slice(0, -1), b = lg.slice(1);
  const n = a.length;
  const ma = a.reduce((x, y) => x + y, 0) / n;
  const mb = b.reduce((x, y) => x + y, 0) / n;
  let cv = 0, va = 0;
  for (let i = 0; i < n; i++) {
    cv += (a[i] - ma) * (b[i] - mb);
    va += (a[i] - ma) * (a[i] - ma);
  }
  if (!va) return null;
  const rho = Math.max(-0.9, Math.min(0.9, cv / va));
  if (Math.abs(rho) < 0.15) return null;
  return Math.exp(mb + rho * (lg[lg.length - 1] - ma));
}

function hawkesEgap(g) {
  const m = medGap(g);
  const f = hawkesFit(g);
  let e = f ? 86400000 / Math.max(f.lam, 1e-6) : m;
  const w = woldEgap(g);
  if (w !== null) e = 0.6 * e + 0.4 * w;
  return Math.min(Math.max(e, m / 4), m * 4);
}

function gapBocpd(g) {
  const log = vlog[g];
  if (!log || log.length < 6) return null;
  const key = g + ":" + log.length + ":" + log[log.length - 1];
  if (gbCache[key]) return gbCache[key];
  const gaps = [];
  for (let i = 1; i < log.length; i++)
    gaps.push(Math.max((log[i] - log[i - 1]) / 86400000, 0.001));
  const H = 1 / 12, a0 = 1.5;
  const b0 = gaps.reduce((a, b) => a + b, 0) / gaps.length * 1.5;
  let R = [1], A = [a0], B = [b0];
  for (const v of gaps) {
    const n = R.length;
    const pred = new Array(n);
    for (let i = 0; i < n; i++)
      pred[i] = A[i] / B[i] * Math.pow(B[i] / (B[i] + v), A[i] + 1);
    const R2 = new Array(n + 1).fill(0);
    let cp = 0;
    for (let i = 0; i < n; i++) {
      const m = R[i] * pred[i];
      R2[i + 1] = m * (1 - H);
      cp += m * H;
    }
    R2[0] = cp;
    let s = 0;
    for (const r of R2) s += r;
    if (!s || !isFinite(s)) return null;
    const A2 = [a0], B2 = [b0];
    for (let i = 0; i < n; i++) { A2.push(A[i] + 1); B2.push(B[i] + v); }
    R = R2.map(r => r / s); A = A2; B = B2;
    if (R.length > 30) {

      let t = 0;
      for (const r of R) t += r;

    }
  }
  let erl = 0;
  R.forEach((r, i) => { erl += r * i; });
  return (gbCache[key] = { erl, n: gaps.length });
}

function buildPrefixes() {

  const sorted = games.slice().sort((a, b) =>
    a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0);
  const lower = sorted.map(g => g.toLowerCase());
  const lcp = (a, b) => {
    let i = 0;
    while (i < a.length && i < b.length && a[i] === b[i]) i++;
    return i;
  };
  lower.forEach((t, i) => {
    if (i > 0 && lower[i - 1] === t) return;
    if (i < lower.length - 1 && lower[i + 1] === t) return;
    const l1 = i > 0 ? lcp(t, lower[i - 1]) : 0;
    const l2 = i < lower.length - 1 ? lcp(t, lower[i + 1]) : 0;
    const need = Math.max(l1, l2) + 1;
    if (need <= t.length)
      for (let L = need; L <= t.length; L++) uniq.set(t.slice(0, L), sorted[i]);
  });
}

function boot() {
  let line = 0, ch = 0;
  const lines = shown.slice();
  const base = 9 + Math.floor(dayRng() * 8);

  const pink = (function () {
    const rows = [dayRng(), dayRng(), dayRng(), dayRng(), dayRng()];
    let n = 0;
    return function () {
      n++;
      let k = n, i = 0;
      while (!(k & 1) && i < 4) { k >>= 1; i++; }
      rows[i] = dayRng();
      return rows.reduce((a, b) => a + b, 0) / 5;
    };
  })();

  let mmSt = 0;
  function delay() {
    if (dayRng() < (mmSt ? 0.32 : 0.06)) mmSt ^= 1;
    let u1 = dayRng() || 1e-9;
    const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * dayRng());
    return base * (0.3 + 1.1 * pink()) * Math.exp((mmSt ? 1.2 : 0) + 0.42 * z);
  }

  let glitch = null;
  if (((dayNum * PHI) % 1) < 0.02 && lines.length) {
    const gl = Math.floor(vdc(dayNum) * lines.length);
    if (lines[gl].length) {
      const gc = 1 + Math.floor(dayRng() * lines[gl].length);
      const glyphs = "#@%&?!/\\|~^";
      let H = 0;
      for (let k = 1; k <= glyphs.length; k++) H += 1 / k;
      let r = dayRng() * H, gi = 0;
      for (let k = 1; k <= glyphs.length; k++) { r -= 1 / k; if (r <= 0) { gi = k - 1; break; } }
      const wrong = glyphs[gi];
      glitch = { line: gl, ch: gc, hold: 6,
                 glyph: wrong === lines[gl][gc - 1] ? "$" : wrong };
    }
  }

  function step() {
    if (line >= lines.length) {
      booted = true;
      restoreSession();
      render();
      return;
    }

    if (glitch && line === glitch.line && ch === glitch.ch && glitch.hold > 0) {
      glitch.hold--;
      screen.textContent =
        lines.slice(0, line).join("\n") + (line ? "\n" : "") +
        lines[line].slice(0, ch - 1) + glitch.glyph;
      schedule();
      return;
    }

    ch++;
    if (ch > lines[line].length) { ch = 0; line++; }
    screen.textContent =
      lines.slice(0, line).join("\n") +
      (line < lines.length ? (line ? "\n" : "") + lines[line].slice(0, ch) : "");
    schedule();
  }

  function schedule() { setTimeout(step, delay()); }
  schedule();
}

function ppmModel() {

    for (let o = 0; o <= ORD; o++) {

      if (!m) { m = new Map(); ctx[o].set(key, m); }

}

function ppmDist(hist) {

    let tot = 0, q = 0;
    m.forEach((c, s) => { if (!excl.has(s)) { tot += c; q++; } });
    if (!tot) continue;
    const dPY = 0.5, aPY = 0.25;
    m.forEach((c, s) => { if (!excl.has(s)) out.set(s, (out.get(s) || 0) + mass * Math.max(c - dPY, 1e-6) / (tot + aPY)); });
    mass *= (aPY + dPY * q) / (tot + aPY);
    m.forEach((c, s) => excl.add(s));
    if (mass < 1e-9) break;
  }
  let Z = 0;
  const pf = {};
  const gtU = gtUnseen();
  games.forEach(g => {
    if (!excl.has(g)) {
      pf[g] = frecency(g) + 0.01 + (visits[g] ? 0 : gtU * 0.3);
      Z += pf[g];
    }
  });
  if (Z) games.forEach(g => { if (pf[g] !== undefined) out.set(g, (out.get(g) || 0) + mass * pf[g] / Z); });

}

function ppmEval() {
  const sq = seq.map(x => x[0]).filter(g => games.includes(g));
  if (sq.length < 12) return null;

  const ctx = [];
  for (let o = 0; o <= ORD; o++) ctx.push(new Map());
  const seen = new Set();
  let bits = 0, cnt = 0;
  for (let i = 0; i < sq.length; i++) {
    if (i >= 4) {
      let mass = 1, p = 0;
      const excl = new Set();
      for (let o = Math.min(ORD, i); o >= 0; o--) {
        const key = o ? sq.slice(i - o, i).join("\u0000") : "";
        const m = ctx[o].get(key);
        if (!m) continue;
        let tot = 0, q = 0;
        m.forEach((c, s) => { if (!excl.has(s)) { tot += c; q++; } });
        if (!tot) continue;
        if (m.has(sq[i]) && !excl.has(sq[i])) p += mass * Math.max(m.get(sq[i]) - 0.5, 1e-6) / (tot + 0.25);
        mass *= (0.25 + 0.5 * q) / (tot + 0.25);
        m.forEach((c, s) => excl.add(s));
      }
      if (!excl.has(sq[i])) p += mass / (seen.size + 1);
      bits += -Math.log2(Math.max(p, 1e-9));
      cnt++;
    }
    for (let o = 0; o <= ORD; o++) {
      if (i < o) continue;
      const key = o ? sq.slice(i - o, i).join("\u0000") : "";
      let m = ctx[o].get(key);
      if (!m) { m = new Map(); ctx[o].set(key, m); }
      m.set(sq[i], (m.get(sq[i]) || 0) + 1);
    }
    seen.add(sq[i]);
  }
  return cnt ? bits / cnt : null;
}

  ctww.forEach(w => { W += w; });
  const out = new Map();
  games.forEach(g => {
    let p = 0;
    parts.forEach((d, o) => { p += ctww[o] / W * d.get(g); });
    out.set(g, p);
  });
  ctwDist.parts = parts;
  return out;
}

function ctwObserve(g) {
  const parts = ctwDist.parts;
  if (!parts || !games.length) return;
  const N = games.length;
  const gains = {}, awake = [];
  parts.forEach((d, o) => {
    const p = d.get(g) || 0;
    gains[o] = p / (p + 1 / N);
    awake.push(o);
  });
  anhUpdate(anhC, "anhC", gains, awake);
  for (let o = 0; o < 4; o++) ctww[o] = anhW(anhC, o) + 1e-3;
  fixedShare(ctww, 4);
  localStorage.setItem("ctww", JSON.stringify(ctww));
}

function iohmm() {
  const ev = seq.filter(x => games.includes(x[0]));
  const key = ev.length + ":" + (ev.length ? ev[ev.length - 1][1] : 0);
  if (ioCache && ioCache.key === key) return ioCache;
  const n = games.length;
  if (ev.length < 16 || !n) return (ioCache = { key, ok: false });
  const K = 3, U = 4, T = ev.length;
  const gi = new Map(games.map((g, i) => [g, i]));
  const oi = ev.map(e => gi.get(e[0]));
  const inp = ev.map(e => Math.floor(new Date(e[1]).getHours() / 6));
  if (ev.length >= 48 && workerOK()) {
    heavyRun("iohmm", { oi, inp, n, b: bucketNow() }, out => {
      const dist = new Map();
      games.forEach((g, j) => dist.set(g, out[j]));
      ioCache = { key, ok: true, dist };
    });
    return (ioCache && ioCache.ok) ? ioCache : { key: null, ok: false };
  }
  const rg = mulberry32(0x10AB31);
  let E = [];
  for (let k = 0; k < K; k++) {
    const r = new Float64Array(n);
    let z = 0;
    for (let j = 0; j < n; j++) { r[j] = 0.5 + rg(); z += r[j]; }
    for (let j = 0; j < n; j++) r[j] /= z;
    E.push(r);
  }
  let A = [];
  for (let u = 0; u < U; u++) {
    const rows = [];
    for (let j = 0; j < K; j++) rows.push(new Float64Array(K).fill(1 / K));
    A.push(rows);
  }
  let pi0 = new Float64Array(K).fill(1 / K);
  const fwd = () => {
    const al = [], sc = new Float64Array(T);
    let a = new Float64Array(K);
    for (let k = 0; k < K; k++) a[k] = pi0[k] * E[k][oi[0]];
    let c = 0;
    for (let k = 0; k < K; k++) c += a[k];
    c = c || 1e-300; sc[0] = c;
    for (let k = 0; k < K; k++) a[k] /= c;
    al.push(a);
    for (let t = 1; t < T; t++) {
      const na = new Float64Array(K), Au = A[inp[t]];
      for (let k = 0; k < K; k++) {
        let s = 0;
        for (let j = 0; j < K; j++) s += al[t - 1][j] * Au[j][k];
        na[k] = s * E[k][oi[t]];
      }
      c = 0;
      for (let k = 0; k < K; k++) c += na[k];
      c = c || 1e-300; sc[t] = c;
      for (let k = 0; k < K; k++) na[k] /= c;
      al.push(na);
    }
    return { al, sc };
  };
  for (let em = 0; em < 10; em++) {
    const { al, sc } = fwd();
    const be = new Array(T);
    be[T - 1] = new Float64Array(K).fill(1);
    for (let t = T - 2; t >= 0; t--) {
      const nb = new Float64Array(K), Au = A[inp[t + 1]];
      for (let j = 0; j < K; j++) {
        let s = 0;
        for (let k = 0; k < K; k++) s += Au[j][k] * E[k][oi[t + 1]] * be[t + 1][k];
        nb[j] = s / sc[t + 1];
      }
      be[t] = nb;
    }
    const nE = [];
    for (let k = 0; k < K; k++) nE.push(new Float64Array(n).fill(0.3));
    const nA = [];
    for (let u = 0; u < U; u++) {
      const rows = [];
      for (let j = 0; j < K; j++) rows.push(new Float64Array(K).fill(0.2));
      nA.push(rows);
    }
    const npi = new Float64Array(K).fill(0.1);
    for (let t = 0; t < T; t++) {
      const gk = new Float64Array(K);
      let z = 0;
      for (let k = 0; k < K; k++) { gk[k] = al[t][k] * be[t][k]; z += gk[k]; }
      if (z) for (let k = 0; k < K; k++) gk[k] /= z;
      for (let k = 0; k < K; k++) nE[k][oi[t]] += gk[k];
      if (t === 0) for (let k = 0; k < K; k++) npi[k] += gk[k];
      if (t + 1 < T) {
        const Au = A[inp[t + 1]];
        let zz = 0;
        const xi = [];
        for (let j = 0; j < K; j++) {
          xi.push(new Float64Array(K));
          for (let k = 0; k < K; k++) {
            const v = al[t][j] * Au[j][k] * E[k][oi[t + 1]] * be[t + 1][k];
            xi[j][k] = v; zz += v;
          }
        }
        if (zz) for (let j = 0; j < K; j++)
          for (let k = 0; k < K; k++) nA[inp[t + 1]][j][k] += xi[j][k] / zz;
      }
    }
    for (let k = 0; k < K; k++) {
      let z = 0;
      for (let j = 0; j < n; j++) z += nE[k][j];
      for (let j = 0; j < n; j++) nE[k][j] /= z;
    }
    for (let u = 0; u < U; u++) for (let j = 0; j < K; j++) {
      let z = 0;
      for (let k = 0; k < K; k++) z += nA[u][j][k];
      for (let k = 0; k < K; k++) nA[u][j][k] /= z;
    }
    let zp = 0;
    for (let k = 0; k < K; k++) zp += npi[k];
    for (let k = 0; k < K; k++) npi[k] /= zp;
    E = nE; A = nA; pi0 = npi;
  }
  const { al } = fwd();
  const bel = al[T - 1];
  const Au = A[bucketNow()];
  const nxt = new Float64Array(K);
  for (let k = 0; k < K; k++) {
    let s = 0;
    for (let j = 0; j < K; j++) s += bel[j] * Au[j][k];
    nxt[k] = s;
  }
  const dist = new Map();
  games.forEach((g, j) => {
    let p = 0;
    for (let k = 0; k < K; k++) p += nxt[k] * E[k][j];
    dist.set(g, p);
  });
  return (ioCache = { key, ok: true, dist });
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function tfVec(g) {
  let u = tf3.U[g];
  if (!u) {
    const r = mulberry32(hashStr(g));
    u = [0.1 * (r() - 0.5), 0.1 * (r() - 0.5), 0.1 * (r() - 0.5)];
    tf3.U[g] = u;
  }
  return u;
}

function tfScore(g, hb, wd) {
  const u = tfVec(g), h = tf3.H[hb], w = tf3.W[wd];
  return u[0] * h[0] * w[0] + u[1] * h[1] * w[1] + u[2] * h[2] * w[2];
}

function tfDist() {
  const hb = Math.floor(new Date().getHours() / 4), wd = new Date().getDay();
  const out = new Map();
  let mx = -Infinity;
  games.forEach(g => {
    const s = tfScore(g, hb, wd);
    out.set(g, s);
    if (s > mx) mx = s;
  });
  let Z = 0;
  out.forEach(v => { Z += Math.exp(v - mx); });
  if (Z) out.forEach((v, g) => out.set(g, Math.exp(v - mx) / Z));
  return out;
}

function tfUpdate(g) {
  if (!games.length) return;
  const hb = Math.floor(new Date().getHours() / 4), wd = new Date().getDay();
  const lr = 0.1, ex = [[g, 1]];
  for (let k = 0; k < 4; k++) {
    const ng = games[Math.floor(Math.random() * games.length)];
    if (ng !== g) ex.push([ng, 0]);
  }
  const h = tf3.H[hb], w = tf3.W[wd];
  for (const [x, y] of ex) {
    const u = tfVec(x);
    let s = 0;
    for (let k = 0; k < 3; k++) s += u[k] * h[k] * w[k];
    const p = 1 / (1 + Math.exp(-Math.max(-15, Math.min(15, s))));
    const gr = (y - p) * lr;
    for (let k = 0; k < 3; k++) {
      const du = gr * h[k] * w[k], dh = gr * u[k] * w[k], dw = gr * u[k] * h[k];
      u[k] = Math.max(-3, Math.min(3, u[k] + du - lr * 0.01 * u[k]));
      h[k] = Math.max(-3, Math.min(3, h[k] + dh - lr * 0.01 * h[k]));
      w[k] = Math.max(-3, Math.min(3, w[k] + dw - lr * 0.01 * w[k]));
    }
  }
  for (const k2 in tf3.U) if (!games.includes(k2)) delete tf3.U[k2];
  localStorage.setItem("tf3", JSON.stringify(tf3));
}

function predictNext() {
  if (!games.length) return null;
  const em = ensembleMap();
  if (!em) return null;
  let best = null, bs = -1;
  em.forEach((p, g) => { if (p > bs) { bs = p; best = g; } });
  return best;
}

function predObserve(g) {

  });

          }

        });
      }
      localStorage.setItem("adw", JSON.stringify(adw));
    }
  } catch (e) {}
  localStorage.setItem("predw", JSON.stringify(predw));
}

function hedgeObserve(g, kdisp) {
  const ranks = {}, tops = {};
  for (let m = 0; m < NMODE; m++) {
    if (m === 5 && games.length > 300 && (fiedlerCache === null || fiedlerCache === false)) continue;
    if (m === 7 && games.length > 150 && (oloCache === null || oloCache === false)) continue;
    if (m === 12 && games.length > 150 && (tspCache === null || tspCache === false)) continue;
    let ord = null;
    try { ord = orderingFor(m); } catch (e) { continue; }
    const r = ord.indexOf(g);
    if (r < 0) continue;
    ranks[m] = r;
    tops[m] = ord.slice(0, 20);
  }
  let ips = 1;
  if (kdisp !== undefined && kdisp !== null) {
    try {
      const exm = pbmExam();
      const eK = (kdisp < 20 && exm) ? Math.max(exm.exam[kdisp], 0.25)
        : (kdisp < 20 && pex[kdisp][1] >= 3) ? Math.max((pex[kdisp][0] + 0.5) / (pex[kdisp][1] + 1), 0.25)
        : 0.5;
      ips = Math.min(1 / eK, 4);
    } catch (e) {}
  }
  const awake = Object.keys(ranks).map(Number);
  if (awake.length) {
    const gains = {};
    awake.forEach(m => { gains[m] = 1 / (1 + ranks[m]); });
    anhUpdate(anhS, "anhS", gains, awake);
    for (let m = 0; m < NMODE; m++) hedge[m] = anhW(anhS, m) + 1e-3;
    fixedShare(hedge, NMODE);
    let emDR = null;
    try { emDR = ensembleMap(); } catch (e) {}
    awake.forEach(m => {
      const rObs = 1 / Math.log2(2 + ranks[m]);
      if (emDR) {
        let dm = 0;
        tops[m].forEach((g2, r2) => { dm += (emDR.get(g2) || 0) / Math.log2(2 + r2); });
        ope.s[m] = 0.995 * ope.s[m] + dm + ips * (rObs - dm);
        ope.w[m] = 0.995 * ope.w[m] + 1;
      } else {
        ope.s[m] = 0.995 * ope.s[m] + ips * rObs;
        ope.w[m] = 0.995 * ope.w[m] + ips;
      }
    });
    ope.n++;
    localStorage.setItem("ope", JSON.stringify(ope));
  }
  if (awake.length > 1) {
    const inc = Math.min(ips / 2, 1.6);
    for (let a = 0; a < awake.length; a++)
      for (let b = a + 1; b < awake.length; b++) {
        const i = awake[a], j = awake[b];
        if (ranks[i] === ranks[j]) continue;
        const w = duel[i + "-" + j] || [0, 0];
        w[0] *= 0.995; w[1] *= 0.995;
        w[ranks[i] < ranks[j] ? 0 : 1] += inc;
        duel[i + "-" + j] = w;
      }
    localStorage.setItem("duel", JSON.stringify(duel));
  }
  const mxw = Math.max(...hedge) || 1;
  for (let m = 0; m < NMODE; m++) hedge[m] = Math.max(hedge[m] / mxw, 1e-4);
  localStorage.setItem("hedge", JSON.stringify(hedge));
}

function rankCentrality() {
  const P = [];
  for (let i = 0; i < NMODE; i++) P.push(new Array(NMODE).fill(0));
  let any = false;
  for (let i = 0; i < NMODE; i++) {
    let self = 1;
    for (let j = 0; j < NMODE; j++) {
      if (i === j) continue;
      const w = duelWins(i, j);
      const t = w[0] + w[1];
      if (!t) continue;
      any = true;
      P[i][j] = ((w[1] + 0.5) / (t + 1)) / NMODE;
      self -= P[i][j];
    }
    P[i][i] = self;
  }
  if (!any) return null;
  let p = new Array(NMODE).fill(1 / NMODE);
  for (let it = 0; it < 80; it++) {
    const np = new Array(NMODE).fill(0);
    for (let i = 0; i < NMODE; i++)
      for (let j = 0; j < NMODE; j++) np[j] += p[i] * P[i][j];
    p = np;
  }
  return p;
}

function duelWins(i, j) {
  const kf = duel[i + "-" + j], kb = duel[j + "-" + i];
  return [(kf ? kf[0] : 0) + (kb ? kb[1] : 0),
          (kf ? kf[1] : 0) + (kb ? kb[0] : 0)];
}

function duelCopeland() {
  const cop = new Array(NMODE).fill(0);
  for (let i = 0; i < NMODE; i++)
    for (let j = 0; j < NMODE; j++) {
      if (i === j) continue;
      const w = duelWins(i, j);
      if (!(w[0] + w[1])) continue;
      if (betaSample(w[0] + 1, w[1] + 1) > 0.5) cop[i]++;
    }
  let rc = null;
  try { rc = rankCentrality(); } catch (e) {}
  const dr = ope.s.map((v, i2) => (ope.w && ope.w[i2] > 4) ? v / ope.w[i2] : 0);
  let drMax = 0;
  dr.forEach(v => { if (v > drMax) drMax = v; });
  let bm = 0, bs = -Infinity;
  for (let i = 0; i < NMODE; i++) {
    let s = cop[i];
    if (rc) s += NMODE * 0.5 * rc[i];
    if (ope.n >= 20 && drMax > 0) s += NMODE * 0.3 * dr[i] / drMax;
    if (s > bs || (s === bs && hedge[i] > hedge[bm])) { bs = s; bm = i; }
  }
  return bm;
}

function duelPick() {
  let tot = 0;
  for (const k in duel) tot += duel[k][0] + duel[k][1];
  if (tot < 30) return null;
  const a = duelCopeland();
  const b = duelCopeland();
  if (a === b) return a;
  const w = duelWins(a, b);
  return betaSample(w[0] + 1, w[1] + 1) > 0.5 ? a : b;
}

const FT_A = 0.15, FT_B = 1, FT_L1 = 0.02, FT_L2 = 1;
function ftrlW() {
  const w = new Array(LD).fill(0);
  for (let i = 0; i < LD; i++) {
    const z = ftrl.z[i];
    if (Math.abs(z) > FT_L1)
      w[i] = -(z - Math.sign(z) * FT_L1) / ((FT_B + Math.sqrt(ftrl.n[i])) / FT_A + FT_L2);
  }
  return w;
}

function ftrlUpdate(x, y, sw) {
  const w = ftrlW();
  const s2 = sw === undefined ? 1 : sw;
  let s = 0;
  for (let i = 0; i < LD; i++) s += w[i] * x[i];
  const p = 1 / (1 + Math.exp(-Math.max(-15, Math.min(15, s))));
  for (let i = 0; i < LD; i++) {
    const g = s2 * (p - y) * x[i];
    const sg = (Math.sqrt(ftrl.n[i] + g * g) - Math.sqrt(ftrl.n[i])) / FT_A;
    ftrl.z[i] += g - sg * w[i];
    ftrl.n[i] += g * g;
  }
}

function ftrlTrain(g, losers) {
  let sw = 1;
  try {
    const kpos = Math.min(losers.length, 19);
    const exm = pbmExam();
    const eK = exm ? Math.max(exm.exam[kpos], 0.25)
      : (pex[kpos][1] >= 3) ? Math.max((pex[kpos][0] + 0.5) / (pex[kpos][1] + 1), 0.25)
      : 1;
    sw = Math.max(0.25, Math.min(1 / eK, 4));
  } catch (e) {}
  ftrlUpdate(linFeat(g), 1, sw);
  losers.slice(-8).forEach(l => { if (l !== g) ftrlUpdate(linFeat(l), 0, sw); });
  localStorage.setItem("ftrl", JSON.stringify(ftrl));
}

function pbmAdd(g, p, c) {
  if (p >= 20) return;
  const r = pbmD[g] = pbmD[g] || {};
  const e = r[p] = r[p] || [0, 0];
  e[0]++;
  if (c) e[1]++;
}

function pbmPrune() {
  const ks = Object.keys(pbmD);
  if (ks.length <= 90) return;
  const totI = g => {
    let s = 0;
    for (const p in pbmD[g]) s += pbmD[g][p][0];
    return s;
  };
  ks.sort((a, b) => totI(a) - totI(b)).slice(0, ks.length - 90)
    .forEach(g => { delete pbmD[g]; });
}

function pbmExam() {
  let totC = 0, totI = 0;
  for (const g in pbmD) for (const p in pbmD[g]) {
    totI += pbmD[g][p][0]; totC += pbmD[g][p][1];
  }
  if (totC < 25) return null;
  const key = totI + ":" + totC;
  if (pbmCache && pbmCache.key === key) return pbmCache;
  const exam = [];
  for (let p = 0; p < 20; p++) exam.push(1 / (1 + p * 0.35));
  const attr = {};
  for (const g in pbmD) attr[g] = 0.3;
  for (let it = 0; it < 20; it++) {
    const eN = new Array(20).fill(0.5), eD = new Array(20).fill(1);
    const aN = {}, aD = {};
    for (const g in pbmD) { aN[g] = 0.6; aD[g] = 2; }
    for (const g in pbmD) for (const p in pbmD[g]) {
      const pi2 = +p, I = pbmD[g][p][0], C = pbmD[g][p][1], Un = I - C;
      const ep = exam[pi2], ag = attr[g];
      const den = Math.max(1e-6, 1 - ep * ag);
      eN[pi2] += C + Un * ep * (1 - ag) / den;
      eD[pi2] += I;
      aN[g] += C + Un * ag * (1 - ep) / den;
      aD[g] += I;
    }
    for (let p = 0; p < 20; p++) exam[p] = Math.min(1, Math.max(0.01, eN[p] / eD[p]));
    exam[0] = Math.max(exam[0], 0.98);
    for (const g in pbmD) attr[g] = Math.min(0.98, Math.max(0.01, aN[g] / aD[g]));
  }
  return (pbmCache = { key, exam, attr });
}

function restoreSession() {

          let v = Math.min(R[i] + (i === m ? 0.35 : 1), NR[i - 1] + 1,
                           R[i - 1] + subCost(q[i - 1], c));
          if (st.prow && i > 1 && q[i - 1] === st.pc && q[i - 2] === c)
            v = Math.min(v, st.prow[i - 2] + tc);
          NR[i] = v;
          if (v < mn) mn = v;
        }
        if (mn > CAP) continue;
        const ch = st.nd.ch[c];
        if (ch.g !== null && NR[m] <= CAP) scoreEnd(ch.g, NR[m]);
        next.push({ nd: ch, row: NR, pc: c, prow: R, mn });
      }
    }
    if (next.length > BEAM) {
      next.sort((a, b) => a.mn - b.mn);
      next.length = BEAM;
    }
    frontier = next;
  }
  if (!found.length) return null;
  const best = new Map();
  found.forEach(x => {
    const c = best.get(x.g);
    if (c === undefined || x.d < c) best.set(x.g, x.d);
  });
  return [...best.entries()]
    .sort((a, b) => a[1] - b[1] || byName(a[0], b[0]))
    .slice(0, 3)
    .map(x => x[0]);
}

function filtered() {
  const q = effQuery();
  filtered.fz = false;
  if (!q) return shown;
  const hits = games
    .map(g => ({ g, s: fuzzyScore(q, g) }))
    .filter(x => x.s !== null)
    .sort((a, b) => a.s - b.s || byName(a.g, b.g))
    .map(x => x.g);
  if (hits.length) { filtered.fz = true; return hits; }
  const ql = q.toLowerCase();
  const dq = dmeta(ql);
  const cands = ssCandidates(ql);
  let Zf = 0;
  cands.forEach(g => { Zf += frecency(g) + 0.05; });
  let totN = 0;
  kdc.n.forEach(v => { totN += v; });
  if (totN > 12) {
    let ws = 0, wn = 0;
    kdc.c.forEach((cc, ci) => {
      if (ci === kcur) return;
      ws += kdc.n[ci] * cc[0]; wn += kdc.n[ci];
    });
    typoFast = wn ? kdc.c[kcur][0] <= ws / wn : null;
  } else typoFast = null;
  const tc = typoFast === null ? 0.6 : typoFast ? 0.45 : 0.75;
  const wPh = typoFast === null ? 1 : typoFast ? 0.6 : 1.5;
  try {
    const lat = latticeSearch(ql, tc, wPh);
    if (lat && lat.length) return lat;
  } catch (e) {}
  return cands
    .map(g => {
      const dg = dmeta(g);
      let d = dlDist(ql, g.toLowerCase(), tc)
            - 0.45 * Math.log((frecency(g) + 0.05) / (Zf || 1));
      const eq = dq[0] && (dg[0] === dq[0] || dg[1] === dq[0] ||
                           (dq[1] && dg[0] === dq[1]));
      if (eq) d -= 1.2 * wPh;
      else if (dq[0] && (dg[0].indexOf(dq[0]) === 0 || dg[1].indexOf(dq[0]) === 0))
        d -= 0.6 * wPh;
      return { g, d };
    })
    .sort((a, b) => a.d - b.d || byName(a.g, b.g))
    .slice(0, 3)
    .map(x => x.g);
}

function gtUnseen() {
  const K = 10;
  const f = new Array(K + 1).fill(0);
  let tot = 0, unseen = 0;
  games.forEach(g => {
    const v = visits[g] || 0;
    if (!v) { unseen++; return; }
    tot += v;
    if (v <= K) f[v]++;
  });
  if (!tot) return 1;
  if (!unseen) return 0.02;
  const C = new Array(K + 1).fill(1);
  for (let j = 1; j <= K; j++) C[j] = C[j - 1] * (K - j + 1) / j;
  let U = 0;
  for (let i = 1; i <= K; i++) {
    let pT = 0;
    for (let j = i; j <= K; j++) pT += C[j];
    pT /= Math.pow(2, K);
    U += (i % 2 ? 1 : -1) * pT * f[i];
  }
  return Math.min(1, Math.max(0.02, Math.max(0, U) / unseen));
}

const ACTR_D = 0.5;
function frecency(g) {
  const now = Date.now();
  const log = vlog[g] || [];
  let s = 0;
  for (const t of log) s += Math.pow(Math.max((now - t) / 86400000, 0.02), -ACTR_D);
  return s;
}

function weekdayFactor(g) {
  const w = wday[g];
  if (!w) return 1;
  const tot = w.reduce((a, b) => a + b, 0);
  if (!tot) return 1;
  return (w[new Date().getDay()] + 1) / (tot / 7 + 1);
}

function stationary() {
  if (stationaryCache) return stationaryCache;
  stationaryCache = pagerank(null);
  return stationaryCache;
}

function personalized() {
  if (!last || !games.includes(last)) return null;
  if (pprCache && pprCache.root === last) return pprCache.v;
  pprCache = { root: last,
               v: games.length > 150 ? pprPush(last) : pagerank(last) };
  return pprCache.v;
}

function pprPush(root) {
  const idx = new Map(games.map((g, i) => [g, i]));
  const n = games.length;
  const alpha = 0.15, eps = 1e-6;
  const p = new Float64Array(n), r = new Float64Array(n);
  const ri = idx.get(root);
  r[ri] = 1;
  const deg = games.map(g => {
    const row = trans[g];
    let t = 0;
    if (row) for (const k in row) if (idx.has(k)) t += row[k];
    return t;
  });
  const queue = [ri];
  const inq = new Uint8Array(n);
  inq[ri] = 1;
  let qh = 0, guard = 0;
  while (qh < queue.length && guard++ < 50000) {
    const u = queue[qh++];
    inq[u] = 0;
    const thr = eps * Math.max(deg[u], 1);
    if (r[u] < thr) continue;
    const ru = r[u];
    p[u] += alpha * ru;
    r[u] = 0;
    const rest = (1 - alpha) * ru;
    if (!deg[u]) {
      r[ri] += rest;
      if (!inq[ri] && r[ri] >= eps * Math.max(deg[ri], 1)) { queue.push(ri); inq[ri] = 1; }
      continue;
    }
    const row = trans[games[u]];
    for (const k in row) {
      const v = idx.get(k);
      if (v === undefined) continue;
      r[v] += rest * row[k] / deg[u];
      if (!inq[v] && r[v] >= eps * Math.max(deg[v], 1)) { queue.push(v); inq[v] = 1; }
    }
    if (qh > 4096 && qh * 2 > queue.length) { queue.splice(0, qh); qh = 0; }
  }
  let Z = 0;
  for (let i = 0; i < n; i++) Z += p[i];
  const out = {};
  games.forEach((g, i) => { out[g] = Z ? p[i] / Z : 1 / n; });
  return out;
}

function pagerank(root) {
  const idx = new Map(games.map((g, i) => [g, i]));
  const n = games.length;
  const ri = root != null ? idx.get(root) : -1;
  let p = new Array(n).fill(1 / n);
  const damp = 0.85;
  for (let it = 0; it < 30; it++) {
    const np = new Array(n).fill(0);
    if (ri >= 0) np[ri] = 1 - damp;
    else for (let i = 0; i < n; i++) np[i] = (1 - damp) / n;
    let dangling = 0;
    for (let i = 0; i < n; i++) {
      const row = trans[games[i]];
      let tot = 0;
      if (row) for (const k in row) if (idx.has(k)) tot += row[k];
      if (!tot) { dangling += p[i]; continue; }
      for (const k in row) {
        const j = idx.get(k);
        if (j !== undefined) np[j] += damp * p[i] * row[k] / tot;
      }
    }
    if (ri >= 0) np[ri] += damp * dangling;
    else { const add = damp * dangling / n; for (let i = 0; i < n; i++) np[i] += add; }
    p = np;
  }
  const out = {};
  games.forEach((g, i) => { out[g] = p[i]; });
  return out;
}

function gzSize(str) {
  const cs = new CompressionStream("gzip");
  const w = cs.writable.getWriter();
  w.write(new TextEncoder().encode(str));
  w.close();
  const rd = cs.readable.getReader();
  let n = 0;
  const pump = () => rd.read().then(res => {
    if (res.done) return n;
    n += res.value.length;
    return pump();
  });
  return pump();
}

function ncdCtxString(g) {
  const log = vlog[g] || [];
  let s = "";
  log.forEach(t => {
    const d = new Date(t);
    s += String.fromCharCode(97 + d.getHours()) + String.fromCharCode(65 + d.getDay());
  });
  seq.forEach((e, i) => {
    if (e[0] !== g) return;
    if (i > 0) s += "<" + seq[i - 1][0];
    if (i + 1 < seq.length) s += ">" + seq[i + 1][0];
  });
  return s;
}

function ncdBuild() {
  if (typeof CompressionStream === "undefined") return null;
  const tp = games.filter(g => (vlog[g] || []).length >= 2)
    .sort((a, b) => frecency(b) - frecency(a)).slice(0, 32);
  if (tp.length < 4) return null;
  const str = new Map(tp.map(g => [g, ncdCtxString(g)]));
  const jobs = tp.map(g => gzSize(str.get(g)).then(n => [g, n]));
  return Promise.all(jobs).then(sizes => {
    const sz = new Map(sizes);
    const pj = [];
    for (let i = 0; i < tp.length; i++)
      for (let j = i + 1; j < tp.length; j++) {
        const a = tp[i] < tp[j] ? tp[i] : tp[j];
        const b = tp[i] < tp[j] ? tp[j] : tp[i];
        pj.push(gzSize(str.get(a) + str.get(b)).then(cxy => {
          const ca = sz.get(a), cb = sz.get(b);
          return [a + "\u0000" + b,
                  (cxy - Math.min(ca, cb)) / Math.max(ca, cb, 1)];
        }));
      }
    return Promise.all(pj);
  }).then(pairsArr => {
    ncdCache = { pair: new Map(pairsArr) };
    simCache = null;
  });
}

function simFn() {
  if (simCache) return simCache;
  const n = games.length;
  const idx = new Map(games.map((g, i) => [g, i]));
  const vec = games.map(() => new Map());
  games.forEach((g, i) => {
    const row = trans[g] || {};
    for (const k in row) {
      const j = idx.get(k);
      if (j !== undefined) {
        vec[i].set(j, (vec[i].get(j) || 0) + row[k]);
        vec[j].set(n + i, (vec[j].get(n + i) || 0) + row[k]);
      }
    }
  });
  const nrm = vec.map(v => { let s = 0; v.forEach(x => s += x * x); return Math.sqrt(s); });
  let jl = null, jln = null;
  if (n > 256) {
    const JD = 32;
    try {
      const feats = new Set();
      for (let i = 0; i < n; i++) vec[i].forEach((x, k) => feats.add(k));
      let Y = new Float64Array(n * JD);
      for (let i = 0; i < n; i++)
        vec[i].forEach((x, k) => {
          const w1 = hashStr(k + ""), w2 = hashStr(k + "$");
          for (let d = 0; d < JD; d++) {
            const bit = d < 16 ? (w1 >>> d) & 1 : (w2 >>> (d - 16)) & 1;
            Y[i * JD + d] += bit ? x : -x;
          }
        });
      const tmap = new Map();
      const trow = k => {
        let r = tmap.get(k);
        if (!r) { r = new Float64Array(JD); tmap.set(k, r); }
        return r;
      };
      for (let i = 0; i < n; i++)
        vec[i].forEach((x, k) => {
          const r = trow(k);
          for (let d = 0; d < JD; d++) r[d] += x * Y[i * JD + d];
        });
      const Y2 = new Float64Array(n * JD);
      for (let i = 0; i < n; i++)
        vec[i].forEach((x, k) => {
          const r = tmap.get(k);
          if (r) for (let d = 0; d < JD; d++) Y2[i * JD + d] += x * r[d];
        });
      for (let d = 0; d < JD; d++) {
        for (let e2 = 0; e2 < d; e2++) {
          let dot = 0;
          for (let i = 0; i < n; i++) dot += Y2[i * JD + d] * Y2[i * JD + e2];
          for (let i = 0; i < n; i++) Y2[i * JD + d] -= dot * Y2[i * JD + e2];
        }
        let nn = 0;
        for (let i = 0; i < n; i++) nn += Y2[i * JD + d] * Y2[i * JD + d];
        nn = Math.sqrt(nn);
        if (nn > 1e-10) for (let i = 0; i < n; i++) Y2[i * JD + d] /= nn;
        else for (let i = 0; i < n; i++) Y2[i * JD + d] = 0;
      }
      tmap.clear();
      for (let i = 0; i < n; i++)
        vec[i].forEach((x, k) => {
          const r = trow(k);
          for (let d = 0; d < JD; d++) r[d] += x * Y2[i * JD + d];
        });
      const G = new Float64Array(JD * JD);
      tmap.forEach(r => {
        for (let a2 = 0; a2 < JD; a2++) {
          if (!r[a2]) continue;
          for (let b2 = a2; b2 < JD; b2++) G[a2 * JD + b2] += r[a2] * r[b2];
        }
      });
      for (let a2 = 0; a2 < JD; a2++) {
        G[a2 * JD + a2] += 1e-9;
        for (let b2 = a2 + 1; b2 < JD; b2++) G[b2 * JD + a2] = G[a2 * JD + b2];
      }
      const L = cholFlat(G, JD);
      jl = new Float64Array(n * JD);
      for (let i = 0; i < n; i++)
        for (let e2 = 0; e2 < JD; e2++) {
          const q = Y2[i * JD + e2];
          if (!q) continue;
          for (let d = 0; d <= e2; d++) jl[i * JD + d] += q * L[e2 * JD + d];
        }
    } catch (e) { jl = null; }
    if (!jl) {
      jl = new Float64Array(n * JD);
      for (let i = 0; i < n; i++)
        vec[i].forEach((x, k) => {
          for (let t = 0; t < 2; t++) {
            const h = hashStr(k + "#" + t);
            jl[i * JD + h % JD] += ((h >>> 6) & 1 ? 1 : -1) * x;
          }
        });
    }
    jln = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let s2 = 0;
      for (let d = 0; d < JD; d++) s2 += jl[i * JD + d] * jl[i * JD + d];
      jln[i] = Math.sqrt(s2);
    }
  }
  const cosine = (i, j) => {
    if (jl) {
      if (!jln[i] || !jln[j]) return 0;
      let s2 = 0;
      for (let d = 0; d < 32; d++) s2 += jl[i * 32 + d] * jl[j * 32 + d];
      return Math.max(0, s2 / (jln[i] * jln[j]));
    }
    if (!nrm[i] || !nrm[j]) return 0;
    let s2 = 0;
    vec[i].forEach((x, k) => { const y = vec[j].get(k); if (y) s2 += x * y; });
    return s2 / (nrm[i] * nrm[j]);
  };
  let erZ = null, erMed = 1;
  if (n >= 6 && n <= 160) {
    try {
      const KNN = 6;
      const eu = [], ev2 = [], ew = [];
      const deg = new Float64Array(n);
      const seenE = new Set();
      for (let i = 0; i < n; i++) {
        if (!nrm[i]) continue;
        const cands = [];
        for (let j = 0; j < n; j++) {
          if (j === i || !nrm[j]) continue;
          const sv = cosine(i, j);
          if (sv > 1e-4) cands.push([sv, j]);
        }
        cands.sort((x2, y2) => y2[0] - x2[0]);
        for (let q = 0; q < Math.min(KNN, cands.length); q++) {
          const j = cands[q][1];
          const kk = i < j ? i * n + j : j * n + i;
          if (seenE.has(kk)) continue;
          seenE.add(kk);
          eu.push(i); ev2.push(j); ew.push(cands[q][0]);
          deg[i] += cands[q][0]; deg[j] += cands[q][0];
        }
      }
      const m = eu.length;
      if (m >= n / 2) {
        const RP = 8;
        const rg = mulberry32(0xE5157);
        const Z = new Float64Array(n * RP);
        const lap = x => {
          const y = new Float64Array(n);
          for (let i = 0; i < n; i++) y[i] = deg[i] * x[i];
          for (let e2 = 0; e2 < m; e2++) {
            y[eu[e2]] -= ew[e2] * x[ev2[e2]];
            y[ev2[e2]] -= ew[e2] * x[eu[e2]];
          }
          return y;
        };
        const center = x => {
          let mn = 0;
          for (let i = 0; i < n; i++) mn += x[i];
          mn /= n;
          for (let i = 0; i < n; i++) x[i] -= mn;
        };
        for (let r = 0; r < RP; r++) {
          const bv = new Float64Array(n);
          for (let e2 = 0; e2 < m; e2++) {
            const sgn = rg() < 0.5 ? -1 : 1;
            const v = sgn * Math.sqrt(ew[e2] / RP);
            bv[eu[e2]] += v; bv[ev2[e2]] -= v;
          }
          center(bv);
          const x = new Float64Array(n);
          const rr = bv.slice(), pp = bv.slice();
          let rs = 0;
          for (let i = 0; i < n; i++) rs += rr[i] * rr[i];
          for (let it = 0; it < 60 && rs > 1e-10; it++) {
            const Ap = lap(pp);
            let pAp = 0;
            for (let i = 0; i < n; i++) pAp += pp[i] * Ap[i];
            if (pAp <= 1e-12) break;
            const al = rs / pAp;
            for (let i = 0; i < n; i++) { x[i] += al * pp[i]; rr[i] -= al * Ap[i]; }
            let rs2 = 0;
            for (let i = 0; i < n; i++) rs2 += rr[i] * rr[i];
            const be = rs2 / rs;
            for (let i = 0; i < n; i++) pp[i] = rr[i] + be * pp[i];
            rs = rs2;
          }
          center(x);
          for (let i = 0; i < n; i++) Z[i * RP + r] = x[i];
        }
        const samp = [];
        const rg2 = mulberry32(0x5A17);
        for (let t = 0; t < 40; t++) {
          const i = Math.floor(rg2() * n), j = Math.floor(rg2() * n);
          if (i === j) continue;
          let d2 = 0;
          for (let r = 0; r < RP; r++) {
            const dv = Z[i * RP + r] - Z[j * RP + r];
            d2 += dv * dv;
          }
          if (d2 > 0) samp.push(d2);
        }
        if (samp.length >= 8) {
          samp.sort((x2, y2) => x2 - y2);
          erMed = samp[Math.floor(samp.length / 2)] || 1;
          erZ = Z;
        }
      }
    } catch (e) { erZ = null; }
  }
  const NC = ncdCache;
  simCache = function (i, j) {
    if (i === j) return 1;
    let s = cosine(i, j);
    const E = embed();
    if (E && E.nrm[i] && E.nrm[j]) {
      let d2 = 0;
      for (let d = 0; d < 4; d++) d2 += E.vecs[i][d] * E.vecs[j][d];
      s = 0.6 * s + 0.4 * Math.max(0, d2 / (E.nrm[i] * E.nrm[j]));
    }
    if (NC) {
      const a = games[i] < games[j] ? games[i] : games[j];
      const b = games[i] < games[j] ? games[j] : games[i];
      const v = NC.pair.get(a + "\u0000" + b);
      if (v !== undefined) s = 0.75 * s + 0.25 * Math.max(0, 1 - v);
    }
    if (erZ) {
      let d2 = 0;
      for (let r = 0; r < 8; r++) {
        const dv = erZ[i * 8 + r] - erZ[j * 8 + r];
        d2 += dv * dv;
      }
      s = 0.82 * s + 0.18 * Math.exp(-d2 / (1.4 * erMed));
    }
    return s;
  };
  return simCache;
}

function embed() {
  if (embCache !== null) return embCache;
  const n = games.length;
  if (n < 4 || n > 250) return (embCache = false);
  const idx = new Map(games.map((g, i) => [g, i]));
  const P = [];
  let any = false;
  for (let i = 0; i < n; i++) {
    const r = new Float64Array(n);
    const row = trans[games[i]];
    let tot = 0;
    if (row) for (const k in row) if (idx.has(k)) tot += row[k];
    if (tot) {
      any = true;
      for (const k in row) {
        const j = idx.get(k);
        if (j !== undefined) r[j] = row[k] / tot;

      v0 = new Float64Array(4 * n);

        nrm.push(Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2] + v[3] * v[3]));
      }
      embCache = { vecs, nrm };
      embPrev = {};
      games.forEach((g, i) => { embPrev[g] = vecs[i]; });
      simCache = null;
      fiedlerCache = null;
      oloCache = null;
      tspCache = null;
      commCache = null;
    });

  }

  for (let i = 0; i < n; i++) A.push(Float64Array.from(P[i]));
  for (let i = 0; i < n; i++)
    for (let k = 0; k < n; k++) if (P[i][k])
      for (let j = 0; j < n; j++) if (P[k][j]) A[i][j] += 0.5 * P[i][k] * P[k][j];
  const cs = new Float64Array(n);

'    }',
'    spv.push(v);',
'  }',
'  for (K = 2; K <= maxK; K++) {',
'    var rg = mulb(0x51D0 + K);',
'    var E = [];',
'    for (k = 0; k < K; k++) {',
'      var r = new Float64Array(N), z = 0;',
'      var sv = spv[Math.floor(k / 2) % spv.length];',
'      var sgn = k % 2 ? -1 : 1;',
'      for (i = 0; i < N; i++) { r[i] = 0.3 + (i % K === k ? 0.35 : 0) + 8 * Math.max(sgn * sv[i], 0) + 0.4 * rg(); z += r[i]; }',
'      for (i = 0; i < N; i++) r[i] /= z;',
'      E.push(r);',
'    }',
'    var A = [];',
'    for (j = 0; j < K; j++) {',
'      var row = new Float64Array(K).fill(K > 1 ? 0.4 / (K - 1) : 0);',
'      row[j] = K > 1 ? 0.6 : 1;',
'      A.push(row);',
'    }',
'    var pi0 = new Float64Array(K).fill(1 / K);',
'    var ll = 0, al = null;',
'    for (it = 0; it < 15; it++) {',
'      al = [];',
'      var sc = new Float64Array(T);',
'      var a = new Float64Array(K), c = 0;',
'      for (k = 0; k < K; k++) { a[k] = pi0[k] * E[k][oi[0]]; c += a[k]; }',
'      c = c || 1e-300;',
'      for (k = 0; k < K; k++) a[k] /= c;',
'      sc[0] = c;',
'      al.push(a);',
'      for (t = 1; t < T; t++) {',
'        var na = new Float64Array(K), cz = 0;',
'        for (k = 0; k < K; k++) {',
'          var s = 0;',
'          for (j = 0; j < K; j++) s += al[t - 1][j] * A[j][k];',
'          na[k] = s * E[k][oi[t]];',
'          cz += na[k];',
'        }',
'        cz = cz || 1e-300;',
'        for (k = 0; k < K; k++) na[k] /= cz;',
'        sc[t] = cz;',
'        al.push(na);',
'      }',
'      ll = 0;',
'      for (t = 0; t < T; t++) ll += Math.log(sc[t]);',
'      var be = new Array(T);',
'      be[T - 1] = new Float64Array(K).fill(1);',
'      for (t = T - 2; t >= 0; t--) {',
'        var nb = new Float64Array(K);',
'        for (j = 0; j < K; j++) {',
'          var s3 = 0;',
'          for (k = 0; k < K; k++) s3 += A[j][k] * E[k][oi[t + 1]] * be[t + 1][k];',
'          nb[j] = s3 / (sc[t + 1] || 1e-300);',
'        }',
'        be[t] = nb;',
'      }',
'      var nE = [];',
'      for (k = 0; k < K; k++) nE.push(new Float64Array(N).fill(0.3 / N));',
'      var nA = [];',
'      for (j = 0; j < K; j++) {',
'        var row2 = new Float64Array(K).fill(0.1);',
'        row2[j] += KAP;',
'        nA.push(row2);',
'      }',
'      var npi = new Float64Array(K).fill(0.1);',
'      for (t = 0; t < T; t++) {',
'        var gk = new Float64Array(K), z4 = 0;',
'        for (k = 0; k < K; k++) { gk[k] = al[t][k] * be[t][k]; z4 += gk[k]; }',
'        z4 = z4 || 1e-300;',
'        for (k = 0; k < K; k++) {',
'          gk[k] /= z4;',
'          nE[k][oi[t]] += gk[k];',
'          if (!t) npi[k] += gk[k];',
'        }',
'        if (t + 1 < T)',
'          for (j = 0; j < K; j++)',
'            for (k = 0; k < K; k++)',
'              nA[j][k] += al[t][j] * A[j][k] * E[k][oi[t + 1]] * be[t + 1][k]',
'                          / (sc[t + 1] || 1e-300);',
'      }',
'      for (k = 0; k < K; k++) {',
'        var z5 = 0;',
'        for (i = 0; i < N; i++) z5 += nE[k][i];',
'        for (i = 0; i < N; i++) nE[k][i] /= z5 || 1;',
'      }',
'      for (j = 0; j < K; j++) {',
'        var z6 = 0;',
'        for (k = 0; k < K; k++) z6 += nA[j][k];',
'        for (k = 0; k < K; k++) nA[j][k] /= z6 || 1;',
'      }',
'      var zp = 0;',
'      for (k = 0; k < K; k++) zp += npi[k];',
'      for (k = 0; k < K; k++) npi[k] /= zp || 1;',
'      if (it >= 2) E = nE;',
'      A = nA;',
'      pi0 = npi;',
'    }',
'    var bic = ll - 0.5 * (K * (K - 1) + K * (N - 1) + (K - 1)) * Math.log(T);',
'    if (!best || bic > best.bic) best = { bic: bic, K: K, E: E, A: A, al: al };',
'  }',
'  var bel = best.al[T - 1];',
'  var nxt = new Float64Array(best.K);',
'  for (k = 0; k < best.K; k++) {',
'    var s7 = 0;',
'    for (j = 0; j < best.K; j++) s7 += bel[j] * best.A[j][k];',
'    nxt[k] = s7;',
'  }',
'  var Z = 0, pr = new Array(N);',
'  for (i = 0; i < N; i++) {',
'    var p = 0;',
'    for (k = 0; k < best.K; k++) p += nxt[k] * best.E[k][i];',
'    pr[i] = p + 1e-9;',
'    Z += pr[i];',
'  }',
'  for (i = 0; i < N; i++) pr[i] /= Z;',
'  return pr;',
'}',
'function kEsn(uf, y, N, IN) {',
'  var T = y.length, K = 24, i, j, t, e2, g2;',
'  var rg = mulb(0xE57E57);',
'  var Win = new Float64Array(K * IN);',
'  for (i = 0; i < K * IN; i++) Win[i] = (rg() * 2 - 1) * 0.4;',
'  var Wj = [], Wv = [];',
'  for (i = 0; i < K; i++) {',
'    var js = [], vs = [];',
'    for (e2 = 0; e2 < 5; e2++) { js.push(Math.floor(rg() * K)); vs.push(rg() * 2 - 1); }',
'    Wj.push(js); Wv.push(vs);',
'  }',
'  var v = new Float64Array(K).fill(1 / K), rho = 1;',
'  for (var it = 0; it < 20; it++) {',
'    var nv = new Float64Array(K);',
'    for (i = 0; i < K; i++)',
'      for (e2 = 0; e2 < 5; e2++) nv[i] += Wv[i][e2] * v[Wj[i][e2]];',
'    var nn = 0;',
'    for (i = 0; i < K; i++) nn += nv[i] * nv[i];',
'    nn = Math.sqrt(nn) || 1e-9;',
'    rho = nn;',
'    for (i = 0; i < K; i++) v[i] = nv[i] / nn;',
'  }',
'  var sc = 0.88 / (rho || 1);',
'  var step = function (x, ub) {',
'    var nx = new Float64Array(K);',
'    for (i = 0; i < K; i++) {',
'      var s = 0;',
'      for (j = 0; j < IN; j++) s += Win[i * IN + j] * uf[ub + j];',
'      for (e2 = 0; e2 < 5; e2++) s += sc * Wv[i][e2] * x[Wj[i][e2]];',
'      nx[i] = Math.tanh(s);',
'    }',
'    return nx;',
'  };',
'  var x = new Float64Array(K);',
'  var states = [];',
'  for (t = 1; t < T; t++) {',
'    x = step(x, (t - 1) * IN);',
'    states.push([x, y[t]]);',
'  }',
'  var F = K + 1;',
'  var Wo = new Float64Array(N * F);',
'  var lr = 0.12;',
'  for (var ep = 0; ep < 3; ep++) {',
'    for (var si = 0; si < states.length; si++) {',
'      var xs = states[si][0], yt = states[si][1];',
'      var scr = new Float64Array(N), mx = -Infinity;',
'      for (g2 = 0; g2 < N; g2++) {',
'        var s8 = Wo[g2 * F + K];',
'        for (i = 0; i < K; i++) s8 += Wo[g2 * F + i] * xs[i];',
'        scr[g2] = s8;',
'        if (s8 > mx) mx = s8;',
'      }',
'      var Zs = 0;',
'      for (g2 = 0; g2 < N; g2++) { scr[g2] = Math.exp(scr[g2] - mx); Zs += scr[g2]; }',
'      for (g2 = 0; g2 < N; g2++) {',
'        var gr = (g2 === yt ? 1 : 0) - scr[g2] / Zs;',
'        var b2 = g2 * F;',
'        for (i = 0; i < K; i++) Wo[b2 + i] += lr * (gr * xs[i] - 1e-4 * Wo[b2 + i]);',
'        Wo[b2 + K] += lr * gr;',
'      }',
'    }',
'  }',
'  var xf = step(x, (T - 1) * IN);',
'  var scr2 = new Float64Array(N), mx2 = -Infinity;',
'  for (g2 = 0; g2 < N; g2++) {',
'    var s9 = Wo[g2 * F + K];',
'    for (i = 0; i < K; i++) s9 += Wo[g2 * F + i] * xf[i];',
'    scr2[g2] = s9;',
'    if (s9 > mx2) mx2 = s9;',
'  }',
'  var Z2 = 0, out = new Array(N);',
'  for (g2 = 0; g2 < N; g2++) { scr2[g2] = Math.exp(scr2[g2] - mx2); Z2 += scr2[g2]; }',
'  for (g2 = 0; g2 < N; g2++) out[g2] = scr2[g2] / (Z2 || 1);',
'  return out;',
'}',
'onmessage = function (e) {',
'  var d = e.data, out = null;',
'  try {',
'    if (d.kind === "fiedler") out = kFiedler(d.m, d.n, d.v0);',
'    else if (d.kind === "embed") out = kEmbed(d.m, d.n, d.v0);',
'    else if (d.kind === "olo") out = kOlo(d.m, d.n);',
'    else if (d.kind === "tsp") out = kTsp(d.m, d.n, d.st, d.v0);',
'    else if (d.kind === "iohmm") out = kIohmm(d.oi, d.inp, d.n, d.b);',
'    else if (d.kind === "shdp") out = kShdp(d.oi, d.n);',
'    else if (d.kind === "esn") out = kEsn(d.uf, d.y, d.n, d.IN);',
'  } catch (err) { out = null; }',
'  postMessage({ id: d.id, out: out });',
'};'
].join("\n");

let heavyWorker = null, heavyGen = 0, heavyId = 0;
const heavyCbs = {}, heavyPend = {};

function workerOK() {
  if (heavyWorker === null) {
    try {
      heavyWorker = new Worker(URL.createObjectURL(
        new Blob([WSRC], { type: "text/javascript" })));
      heavyWorker.onmessage = e => {
        const cb = heavyCbs[e.data.id];
        delete heavyCbs[e.data.id];
        if (cb) cb(e.data.out);
      };
    } catch (e) { heavyWorker = false; }
  }
  return !!heavyWorker;
}

function heavyRun(kind, payload, apply) {
  if (heavyPend[kind]) return;
  heavyPend[kind] = true;
  const gen = heavyGen, id = ++heavyId;
  heavyCbs[id] = out => {
    delete heavyPend[kind];
    if (gen !== heavyGen || out === null) return;
    apply(out);
    if (booted && !statsMode) { applySort(); render(); }
  };
  heavyWorker.postMessage(Object.assign({ id, kind }, payload));
}

function fiedlerOrder() {
  if (fiedlerCache !== null) return fiedlerCache;
  const n = games.length;
  if (n < 3) return (fiedlerCache = false);
  const sim = simFn();
  const W = new Float64Array(n * n);
  const D = new Float64Array(n);
  for (let i = 0; i < n; i++)
    for (let j = 0; j < n; j++) {
      const s = i === j ? 0 : sim(i, j);
      W[i * n + j] = s;
      D[i] += s;
    }
  let anyD = false;
  for (let i = 0; i < n; i++) if (D[i] > 0) anyD = true;
  if (!anyD) return (fiedlerCache = false);
  if (n > HEAVY_N && workerOK()) {
    fiedlerCache = false;
    let v0 = null;
    if (fiedlerPrev) {
      v0 = new Float64Array(n);
      const r0 = mulberry32(0x5EEDED);
      games.forEach((g, i) => {
        v0[i] = fiedlerPrev[g] !== undefined ? fiedlerPrev[g] : r0() - 0.5;
      });
    }
    heavyRun("fiedler", { m: W, n, v0 }, out => {
      const o = {};
      games.forEach((g, i) => { o[g] = out[i]; });
      fiedlerCache = o;
      fiedlerPrev = o;
    });
    return fiedlerCache;
  }
  let mxD = 0;
  for (let i = 0; i < n; i++) if (D[i] > mxD) mxD = D[i];
  const c = 2 * mxD + 1;
  const r32 = mulberry32(0x5EEDED);
  let v = games.map(g => (fiedlerPrev && fiedlerPrev[g] !== undefined)
    ? fiedlerPrev[g] : r32() - 0.5);
  let vm = null;
  const IT = fiedlerPrev ? 36 : 80;
  for (let it = 0; it < IT; it++) {
    const mean = v.reduce((a, b) => a + b, 0) / n;
    for (let i = 0; i < n; i++) v[i] -= mean;
    const w = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      w[i] = (c - D[i]) * v[i];
      for (let j = 0; j < n; j++) if (W[i * n + j]) w[i] += W[i * n + j] * v[j];
    }
    if (vm) for (let i = 0; i < n; i++) w[i] += 0.3 * (v[i] - vm[i]);
    vm = v;
    let nn = 0;
    for (let i = 0; i < n; i++) nn += w[i] * w[i];
    nn = Math.sqrt(nn) || 1;
    v = w.map(x => x / nn);
  }
  const out = {};
  games.forEach((g, i) => { out[g] = v[i]; });
  fiedlerPrev = out;
  return (fiedlerCache = out);
}

function communities() {
  if (commCache) return commCache;
  const n = games.length;
  if (n < 3) return (commCache = { lab: {}, k: n });
  const sim = simFn();
  const nb = [];
  const deg = new Array(n).fill(0);
  let m2 = 0;
  for (let i = 0; i < n; i++) {
    const row = [];
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const s = sim(i, j);
      if (s > 0.05) { row.push([j, s]); deg[i] += s; m2 += s; }
    }
    nb.push(row);
  }
  if (!m2) return (commCache = { lab: {}, k: n });
  const lab = games.map((_, i) => i);
  const ctot = deg.slice();
  const idxs = games.map((_, i) => i);
  const rr = mulberry32(0xC0FFEE);
  for (let pass = 0; pass < 2; pass++)
    for (let it = 0; it < 24; it++) {
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(rr() * (i + 1));
        [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
      }
      let changed = false;
      for (const i of idxs) {
        if (!nb[i].length) continue;
        const wl = new Map();
        for (const pr of nb[i]) wl.set(lab[pr[0]], (wl.get(lab[pr[0]]) || 0) + pr[1]);
        ctot[lab[i]] -= deg[i];
        let bl = lab[i];
        let bg2 = (wl.get(lab[i]) || 0) - deg[i] * ctot[lab[i]] / m2;
        wl.forEach((v, l) => {
          const g2 = v - deg[i] * ctot[l] / m2;
          if (g2 > bg2 + 1e-12 || (g2 === bg2 && l < bl)) { bg2 = g2; bl = l; }
        });
        ctot[bl] += deg[i];
        if (bl !== lab[i]) { lab[i] = bl; changed = true; }
      }
      if (!changed) break;
    }
  let soft = null;
  try { soft = sbmRefine(nb, deg, lab, n); } catch (e) {}
  if (soft) {
    const out2 = {}, softM = {};
    const uniq2 = new Set();
    games.forEach((g, i) => {
      let bk = 0;
      for (let k2 = 1; k2 < soft[i].length; k2++)
        if (soft[i][k2] > soft[i][bk]) bk = k2;
      out2[g] = bk;
      uniq2.add(bk);
      softM[g] = soft[i].map(v => +v.toFixed(4));
    });
    return (commCache = { lab: out2, k: uniq2.size, soft: softM });
  }
  const out = {};
  const uniqL = new Set();
  games.forEach((g, i) => { out[g] = lab[i]; uniqL.add(lab[i]); });
  return (commCache = { lab: out, k: uniqL.size });
}

function sbmRefine(nb, deg, lab0, n) {
  if (n < 6 || n > 160) return null;
  const labs = [...new Set(lab0)].sort((a, b) => a - b);
  const K = labs.length;
  if (K < 2 || K > 8) return null;
  const li = new Map(labs.map((l, i) => [l, i]));
  let mdeg = 0;
  for (let i = 0; i < n; i++) mdeg += deg[i];
  mdeg = Math.max(mdeg / n, 1e-6);
  const th = deg.map(d => Math.max(d / mdeg, 1e-3));
  let tau = [];
  for (let i = 0; i < n; i++) {
    const r = new Array(K).fill(0.1 / Math.max(K - 1, 1));
    r[li.get(lab0[i])] = 0.9;
    tau.push(r);
  }
  for (let it = 0; it < 15; it++) {
    const nk = new Array(K).fill(1e-8);
    for (let i = 0; i < n; i++)
      for (let k = 0; k < K; k++) nk[k] += tau[i][k] * th[i];
    const Wm = [];
    for (let k = 0; k < K; k++) Wm.push(new Array(K).fill(1e-8));
    for (let i = 0; i < n; i++)
      for (const pr of nb[i]) {
        const j = pr[0], a = pr[1];
        for (let k = 0; k < K; k++)
          for (let l = 0; l < K; l++) Wm[k][l] += a * tau[i][k] * tau[j][l];
      }
    const om = [];
    for (let k = 0; k < K; k++) {
      om.push(new Array(K));
      for (let l = 0; l < K; l++)
        om[k][l] = Math.max(Wm[k][l] / (nk[k] * nk[l]), 1e-8);
    }
    const nt = [];
    let moved = 0;
    for (let i = 0; i < n; i++) {
      const lg = new Array(K).fill(0);
      for (let k = 0; k < K; k++) {
        let s = 0;
        for (const pr of nb[i]) {
          const j = pr[0], a = pr[1];
          for (let l = 0; l < K; l++)
            s += tau[j][l] * a * Math.log(om[k][l] * th[i] * th[j]);
        }
        for (let l = 0; l < K; l++)
          s -= om[k][l] * th[i] * (nk[l] - tau[i][l] * th[i]);
        lg[k] = s;
      }
      let mx = -Infinity;
      for (let k = 0; k < K; k++) if (lg[k] > mx) mx = lg[k];
      let Z = 0;
      const r = new Array(K);
      for (let k = 0; k < K; k++) { r[k] = Math.exp(lg[k] - mx); Z += r[k]; }
      for (let k = 0; k < K; k++)
        r[k] = 0.5 * tau[i][k] + 0.5 * (Z ? r[k] / Z : 1 / K);
      let a0 = 0, a1 = 0;
      for (let k = 0; k < K; k++) {
        if (r[k] > r[a0]) a0 = k;
        if (tau[i][k] > tau[i][a1]) a1 = k;
      }
      if (a0 !== a1) moved++;
      nt.push(r);
    }
    tau = nt;
    if (!moved && it > 2) break;
  }
  return tau;
}

function oloOrder() {
  if (oloCache !== null) return oloCache;
  const n = games.length;
  if (n < 3 || n > 400) return (oloCache = false);
  const sim = simFn();
  const dm0 = new Float64Array(n * n);
  let any = false;
  for (let i = 0; i < n; i++)
    for (let j = 0; j < n; j++) {
      dm0[i * n + j] = i === j ? 0 : 1 - sim(i, j);
      if (i !== j && dm0[i * n + j] < 1) any = true;
    }
  if (!any) return (oloCache = false);
  if (n > HEAVY_N && workerOK()) {
    oloCache = false;
    heavyRun("olo", { m: dm0, n }, out => {
      const o = {};
      out.forEach((gi, pos) => { o[games[gi]] = pos; });
      oloCache = o;
    });
    return oloCache;
  }
  const act = new Array(n).fill(true);
  const dm = [];
  for (let i = 0; i < n; i++) {
    const row = new Float64Array(n);
    for (let j = 0; j < n; j++) row[j] = dm0[i * n + j];
    dm.push(row);
  }
  let dfull = null;
  if (n <= 150) dfull = dm0;
  const items = games.map((_, i) => [i]);
  const tree = games.map((_, i) => ({ leaf: i, lv: [i] }));
  const size = new Array(n).fill(1);
  let remaining = n, lastIdx = 0;
  while (remaining > 1) {
    let bi = -1, bj = -1, bd = Infinity;
    for (let i = 0; i < n; i++) if (act[i])
      for (let j = i + 1; j < n; j++) if (act[j])
        if (dm[i][j] < bd) { bd = dm[i][j]; bi = i; bj = j; }
    const A = items[bi], B = items[bj];
    const D = (a, b) => 1 - sim(a, b);
    const opts = [
      [A, B], [A, B.slice().reverse()],
      [A.slice().reverse(), B], [A.slice().reverse(), B.slice().reverse()]
    ];
    let best = null, bs = Infinity;
    for (const [a, b] of opts) {
      const dd = D(a[a.length - 1], b[0]);
      if (dd < bs) { bs = dd; best = a.concat(b); }
    }
    items[bi] = best;
    tree[bi] = { L: tree[bi], R: tree[bj], lv: tree[bi].lv.concat(tree[bj].lv) };
    for (let k = 0; k < n; k++) if (act[k] && k !== bi && k !== bj) {
      const d2 = (size[bi] * dm[bi][k] + size[bj] * dm[bj][k]) / (size[bi] + size[bj]);
      dm[bi][k] = d2; dm[k][bi] = d2;

function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function gammaSample(shape) {
  if (shape < 1) return gammaSample(shape + 1) * Math.pow(Math.random(), 1 / shape);
  const d = shape - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) {
    let x, v;
    do { x = gauss(); v = 1 + c * x; } while (v <= 0);
    v = v * v * v;
    const u = Math.random();
    if (u < 1 - 0.0331 * x * x * x * x) return d * v;
    if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;
  }
}
function betaSample(a, b) {
  const x = gammaSample(a);
  return x / (x + gammaSample(b));
}

function betacf(a, b, x) {
  const FPMIN = 1e-30;
  const qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN;
  d = 1 / d;
  let h = d;
  for (let m = 1; m <= 100; m++) {
    const m2 = 2 * m;
    let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d;
    h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d;
    const del = d * c;
    h *= del;
    if (Math.abs(del - 1) < 3e-7) break;
  }
  return h;
}

function ibeta(a, b, x) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const bt = Math.exp(lgam(a + b) - lgam(a) - lgam(b)
    + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2)
    ? bt * betacf(a, b, x) / a
    : 1 - bt * betacf(b, a, 1 - x) / b;
}

function pandoraZ(a, b, c) {
  const mu = a / (a + b);
  const f = z => mu * (1 - ibeta(a + 1, b, z)) - z * (1 - ibeta(a, b, z)) - c;
  if (f(0) <= 0) return 0;
  let lo = 0, hi = 1;
  for (let i = 0; i < 25; i++) {
    const m = (lo + hi) / 2;
    if (f(m) > 0) lo = m; else hi = m;
  }
  return (lo + hi) / 2;
}

function gittinsBL(a, b) {
  const n = a + b, mu = a / n;
  const v = mu * (1 - mu) / (n + 1);
  const t2 = Math.max(mu * (1 - mu), 1e-4);
  const s = v / (0.0202 * t2);
  let psi;
  if (s <= 0.2) psi = s / Math.SQRT2;
  else if (s <= 1) psi = 0.49 - 0.11 / Math.sqrt(s);
  else if (s <= 5) psi = 0.63 - 0.26 / Math.sqrt(s);
  else if (s <= 15) psi = 0.77 - 0.58 / Math.sqrt(s);
  else psi = Math.sqrt(Math.max(0,
    2 * Math.log(s) - Math.log(Math.log(s)) - Math.log(16 * Math.PI)));
  return mu + Math.sqrt(v) * psi;
}

function vmWeights() {

function tsallisP() {

  const eta = 2 / Math.sqrt(T);

  let Lmin = Infinity;
  L.forEach(v => { if (v < Lmin) Lmin = v; });
  const f = Z => {
    let s = 0;
    for (const Li of L) {
      const d = eta * (Li - Z);
      s += 4 / (d * d);

    return s;

  let lo = Lmin - 4 * Math.sqrt(n) / eta - 1, hi = Lmin - 1e-9;
  let guard = 0;
  while (f(lo) > 1 && guard++ < 40) lo = Lmin - (Lmin - lo) * 2 - 1;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) < 1) lo = mid; else hi = mid;

  const p = {};
