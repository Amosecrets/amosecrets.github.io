            for (let d = 0; d < 4; d++) dot += E.vecs[a2][d] * E.vecs[b2][d];
            dv = 1 - Math.max(-1, Math.min(1, dot / (E.nrm[a2] * E.nrm[b2])));
          }
          ds.push(dv);
        }
        const srt = ds.slice().sort((x2, y2) => x2 - y2);
        const q50 = srt[Math.floor(srt.length * 0.5)];
        const q85 = srt[Math.floor(srt.length * 0.85)];
        const q97 = srt[Math.min(srt.length - 1, Math.floor(srt.length * 0.97))];
        if (q85 > q50 + 1e-9)
          gapRows = ds.map(dv =>
            (q97 > q85 + 1e-9 && dv > q97) ? 3 : dv > q85 ? 2 : dv > q50 ? 1 : 0);
      }
    } catch (e) { gapRows = null; }
  }

  const rowPre = "    ";
  const curPre = cursorPrefix(list);
  render.rowPre = rowPre;
  render.curPre = curPre;
  render.list = list;

  rowEls = [];
  rowPres = [];
  list.forEach((g, i) => {
    if (i > 0) {
      let nl = comm && comm[g] !== comm[list[i - 1]] ? 1 : 0;
      if (gapRows) nl = Math.max(nl, gapRows[i - 1]);
      for (let b2 = 0; b2 < nl; b2++)
        screen.appendChild(document.createTextNode("\n"));
    }

    const preNode = document.createTextNode(i === cursor ? curPre : rowPre);
    screen.appendChild(preNode);
    rowPres.push(preNode);

    const a = document.createElement("a");
    a.href = "games/" + g + "/";
    a.textContent = g + markers(g, resurf);
    a.onmouseover = () => {
      const nowD = Date.now();
      if (ddmHov && ddmHov.g !== g && nowD - ddmHov.t > 80) {
        try { ddmObserve(nowD - ddmHov.t, 0); } catch (e) {}
      }
      if (!ddmHov || ddmHov.g !== g) ddmHov = { g, t: nowD };
      if (cursor !== i) moveCursor(i);
    };
    a.onclick = () => {
      if (ddmHov && ddmHov.g === g) {
        try { ddmObserve(Date.now() - ddmHov.t, 1); } catch (e) {}
        ddmHov = null;
      }
      cursor = i;
      if (effQuery() && filtered.fz && i > 0) fzLearn(effQuery(), g, list[0]);
      if (effQuery() && !filtered.fz) { try { ryAdd(effQuery(), g); } catch (e) {} }
      record(g, effQuery() ? null : list.slice(0, i),
             effQuery() ? null : list.slice(i + 1, 20));
      saveSession(g);
    };
    screen.appendChild(a);
    rowEls.push(a);
    screen.appendChild(document.createTextNode("\n"));
  });

  if (query) screen.appendChild(document.createTextNode("\n/" + query));
  if (!list.length) screen.appendChild(document.createTextNode(" || I"));
  if (message) screen.appendChild(document.createTextNode("\n" + message));
  if (idleArt) screen.appendChild(document.createTextNode("\n\n" + idleArt));
  prefetchSoon();
}

function braille(get, W, H) {
  const map = [[0x01, 0x08], [0x02, 0x10], [0x04, 0x20], [0x40, 0x80]];
  const rows = [];
  for (let cy = 0; cy < H; cy += 4) {
    let row = "";
    for (let cx = 0; cx < W; cx += 2) {
      let code = 0;
      for (let dy = 0; dy < 4; dy++)
        for (let dx = 0; dx < 2; dx++)
          if (cy + dy < H && cx + dx < W && get(cx + dx, cy + dy)) code |= map[dy][dx];
      row += String.fromCharCode(0x2800 + code);
    }
    rows.push(row);
  }
  return rows.join("\n");
}

function lzEntropy(sq) {
  const us = [...new Set(sq)];
  if (sq.length < 12 || us.length < 2) return null;
  const mp = new Map(us.map((g, i) => [g, String.fromCharCode(33 + i)]));
  const s = sq.map(g => mp.get(g)).join("");
  const n = s.length;
  let sum = 1;
  for (let i = 1; i < n; i++) {
    let L = 0;
    while (i + L < n && s.substring(0, i + L).indexOf(s.substr(i, L + 1)) !== -1) L++;
    sum += L + 1;
  }
  return { h: Math.min(n * Math.log2(n) / sum, Math.log2(us.length)), S: us.length };
}

function blockH(sq, L) {
  const c = new Map();
  let n = 0;
  for (let i = 0; i + L <= sq.length; i++) {
    const k = sq.slice(i, i + L).join("\u0000");
    c.set(k, (c.get(k) || 0) + 1);
    n++;
  }
  if (!n) return 0;
  let H = 0;
  c.forEach(v => { const p = v / n; H -= p * Math.log2(p); });
  return H;
}

function statComplexity(sq) {
  if (sq.length < 30) return null;
  const ctx = new Map();
  for (let i = 2; i < sq.length; i++) {
    const k = sq[i - 2] + "\u0000" + sq[i - 1];
    let m = ctx.get(k);
    if (!m) { m = { n: 0, d: new Map() }; ctx.set(k, m); }
    m.n++;
    m.d.set(sq[i], (m.d.get(sq[i]) || 0) + 1);
  }
  const ks = [...ctx.keys()].filter(k => ctx.get(k).n >= 2);
  if (ks.length < 2) return null;
  const states = [];
  ks.forEach(k => {
    const m = ctx.get(k);
    let hit = -1;
    for (let si = 0; si < states.length; si++) {
      const s0 = states[si];
      const syms = new Set([...m.d.keys(), ...s0.d.keys()]);
      let tv = 0;
      syms.forEach(sym =>
        tv += Math.abs((m.d.get(sym) || 0) / m.n - (s0.d.get(sym) || 0) / s0.n));
      if (tv / 2 < 0.35) { hit = si; break; }
    }
    if (hit < 0) states.push({ n: m.n, d: new Map(m.d) });
    else {
      const s0 = states[hit];
      s0.n += m.n;
      m.d.forEach((v, sym) => s0.d.set(sym, (s0.d.get(sym) || 0) + v));
    }
  });
  let tot = 0;
  states.forEach(s0 => { tot += s0.n; });
  let C = 0;
  states.forEach(s0 => { const p = s0.n / tot; C -= p * Math.log2(p); });
  return C;
}

function fanoBound(h, S) {
  if (S < 2) return null;
  const Hb = p => (p <= 0 || p >= 1) ? 0 : -p * Math.log2(p) - (1 - p) * Math.log2(1 - p);
  const f = p => Hb(p) + (1 - p) * Math.log2(S - 1) - h;
  let lo = 1 / S, hi = 1 - 1e-9;
  if (f(lo) < 0) return 1 / S;
  for (let i = 0; i < 40; i++) {
    const m = (lo + hi) / 2;
    if (f(m) > 0) lo = m; else hi = m;
  }
  return lo;
}

function sampEn(sq) {
  const N = sq.length;
  if (N < 12) return null;
  let A = 0, B = 0;
  for (let i = 0; i < N - 2; i++)
    for (let j = i + 1; j < N - 2; j++)
      if (sq[i] === sq[j] && sq[i + 1] === sq[j + 1]) {
        B++;
        if (sq[i + 2] === sq[j + 2]) A++;
      }
  if (!B) return null;
  if (!A) return Infinity;
  return -Math.log(A / B);
}

function allanSlope(x) {
  const pts = [];
  for (const tau of [1, 2, 4, 8, 16]) {
    const nb = Math.floor(x.length / tau);
    if (nb < 3) break;
    const y = [];
    for (let b = 0; b < nb; b++) {
      let s = 0;
      for (let k = 0; k < tau; k++) s += x[b * tau + k];
      y.push(s / tau);
    }
    let s = 0;
    for (let i = 0; i + 1 < y.length; i++) s += (y[i + 1] - y[i]) * (y[i + 1] - y[i]);
    const av = s / (2 * (y.length - 1));
    if (av > 0) pts.push([Math.log(tau), 0.5 * Math.log(av)]);
  }
  if (pts.length < 3) return null;
  const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  let cov = 0, vx = 0;
  pts.forEach(p => { cov += (p[0] - mx) * (p[1] - my); vx += (p[0] - mx) * (p[0] - mx); });
  return vx ? cov / vx : null;
}

function dfaAlpha() {
  let mn = Infinity;
  const counts = {};
  for (const g in vlog) if (games.includes(g)) vlog[g].forEach(t => {
    const d = Math.floor(t / 86400000);
    if (d < mn) mn = d;
    counts[d] = (counts[d] || 0) + 1;
  });
  if (mn === Infinity) return null;
  const N = dayNum - mn + 1;
  if (N < 16) return null;
  const x = new Array(N).fill(0);
  for (const d in counts) x[d - mn] = counts[d];
  const mean = x.reduce((a, b) => a + b, 0) / N;
  const Y = [];
  let c = 0;
  x.forEach(v => { c += v - mean; Y.push(c); });
  const pts = [];
  for (let s = 4; s <= Math.floor(N / 4); s = Math.max(s + 1, Math.floor(s * 1.5))) {
    const nb = Math.floor(N / s);
    let F = 0;
    for (let b = 0; b < nb; b++) {
      const seg = Y.slice(b * s, (b + 1) * s);
      const m2 = (s - 1) / 2;
      let sy = 0, sxy = 0, sxx = 0;
      seg.forEach((v, i) => { sy += v; sxy += (i - m2) * v; sxx += (i - m2) * (i - m2); });
      const b1 = sxx ? sxy / sxx : 0, b0 = sy / s;
      seg.forEach((v, i) => { const r = v - (b0 + b1 * (i - m2)); F += r * r; });
    }
    F = Math.sqrt(F / (nb * s));
    if (F > 0) pts.push([Math.log(s), Math.log(F)]);
  }
  if (pts.length < 3) return null;
  const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  let cov = 0, vx = 0;
  pts.forEach(p => { cov += (p[0] - mx) * (p[1] - my); vx += (p[0] - mx) * (p[0] - mx); });
  return vx ? cov / vx : null;
}

let mpCache = null;
function matrixProfile() {
  const x0 = dailyCounts();
  const m = 7;
  if (!x0 || x0.length < m * 4) return null;
  const xs = x0.slice(-180);
  const n = xs.length - m + 1;
  const key = xs.length + ":" + dayNum + ":" + seq.length;
  if (mpCache && mpCache.key === key) return mpCache.v;
  const mu = new Array(n), sg = new Array(n);
  let s = 0, s2 = 0;
  for (let i = 0; i < xs.length; i++) {
    s += xs[i]; s2 += xs[i] * xs[i];
    if (i >= m) { s -= xs[i - m]; s2 -= xs[i - m] * xs[i - m]; }
    if (i >= m - 1) {
      const k = i - m + 1;
      mu[k] = s / m;
      sg[k] = Math.sqrt(Math.max(s2 / m - mu[k] * mu[k], 1e-9));
    }
  }
  const mp = new Array(n).fill(Infinity), mpi = new Array(n).fill(-1);
  const excl = Math.floor(m / 2);
  let QT = new Array(n);
  for (let j = 0; j < n; j++) {
    let q = 0;
    for (let k = 0; k < m; k++) q += xs[k] * xs[j + k];
    QT[j] = q;
  }
  const QT0 = QT.slice();
  const dProf = i => {
    for (let j = 0; j < n; j++) {
      if (Math.abs(j - i) <= excl) continue;
      const den = Math.max(m * sg[i] * sg[j], 1e-9);
      const corr = Math.max(-1, Math.min(1, (QT[j] - m * mu[i] * mu[j]) / den));
      const d2 = 2 * m * (1 - corr);
      if (d2 < mp[i]) { mp[i] = d2; mpi[i] = j; }
    }
  };
  dProf(0);
  for (let i = 1; i < n; i++) {
    for (let j = n - 1; j >= 1; j--)
      QT[j] = QT[j - 1] - xs[j - 1] * xs[i - 1] + xs[j + m - 1] * xs[i + m - 1];
    QT[0] = QT0[i];
    dProf(i);
  }
  for (let i = 0; i < n; i++) mp[i] = Math.sqrt(Math.max(mp[i], 0));
  let mi = 0, di = 0;
  for (let i = 1; i < n; i++) {
    if (mp[i] < mp[mi]) mi = i;
    if (isFinite(mp[i]) && mp[i] > mp[di]) di = i;
  }
  const arc = new Array(n + 1).fill(0);
  for (let i = 0; i < n; i++) {
    if (mpi[i] < 0) continue;
    arc[Math.min(i, mpi[i])] += 1;
    arc[Math.max(i, mpi[i])] -= 1;
  }
  const cac = new Array(n).fill(1);
  let run = 0;
  for (let k = 0; k < n; k++) {
    run += arc[k];
    const iac = 2 * (k + 1) * (n - k - 1) / n;
    cac[k] = iac > 0 ? Math.min(1, run / iac) : 1;
  }
  for (let k = 0; k < Math.min(m, n); k++) { cac[k] = 1; cac[n - 1 - k] = 1; }
  let ri = 0;
  cac.forEach((v, k) => { if (v < cac[ri]) ri = k; });
  const v = { mp, mpi, cac, motif: [Math.min(mi, mpi[mi]), Math.max(mi, mpi[mi])],
              discord: di, reg: ri, n };
  mpCache = { key, v };
  return v;
}

let dmdCache = null;
function dmdModes() {
  const x0 = dailyCounts();
  if (!x0 || x0.length < 30) return null;
  const x = x0.slice(-96);
  const key = x.length + ":" + dayNum;
  if (dmdCache && dmdCache.key === key) return dmdCache.v;
  const L = 12, T = x.length, C = T - L + 1, CX = C - 1;
  const mu2 = x.reduce((a, b) => a + b, 0) / T;
  const Hk = (a, j) => x[a + j] - mu2;
  const K = Array.from({ length: L }, () => new Array(L).fill(0));
  for (let a = 0; a < L; a++)
    for (let b = a; b < L; b++) {
      let s6 = 0;
      for (let j = 0; j < CX; j++) s6 += Hk(a, j) * Hk(b, j);
      K[a][b] = s6; K[b][a] = s6;
    }
  const U = Array.from({ length: L }, (_, i) => {
    const r0 = new Array(L).fill(0); r0[i] = 1; return r0;
  });
  for (let sw = 0; sw < 30; sw++) {
    let off = 0;
    for (let p2 = 0; p2 < L - 1; p2++)
      for (let q2 = p2 + 1; q2 < L; q2++) off += K[p2][q2] * K[p2][q2];
    if (off < 1e-10) break;
    for (let p2 = 0; p2 < L - 1; p2++)
      for (let q2 = p2 + 1; q2 < L; q2++) {
        if (Math.abs(K[p2][q2]) < 1e-12) continue;
        const th = (K[q2][q2] - K[p2][p2]) / (2 * K[p2][q2]);
        const t2 = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
        const c6 = 1 / Math.sqrt(t2 * t2 + 1), s7 = t2 * c6;
        for (let k = 0; k < L; k++) {
          const kp = K[k][p2], kq = K[k][q2];
          K[k][p2] = c6 * kp - s7 * kq;
          K[k][q2] = s7 * kp + c6 * kq;
        }
        for (let k = 0; k < L; k++) {
          const pk = K[p2][k], qk = K[q2][k];
          K[p2][k] = c6 * pk - s7 * qk;
          K[q2][k] = s7 * pk + c6 * qk;
        }
        for (let k = 0; k < L; k++) {
          const up2 = U[k][p2], uq = U[k][q2];
          U[k][p2] = c6 * up2 - s7 * uq;
          U[k][q2] = s7 * up2 + c6 * uq;
        }
      }
  }
  const lam = [];
  for (let i = 0; i < L; i++) lam.push([K[i][i], i]);
  lam.sort((a, b) => b[0] - a[0]);
  const lmax = Math.max(lam[0][0], 1e-12);
  const rSel = [], lamv = {};
  lam.forEach(pr => { lamv[pr[1]] = pr[0]; });
  for (const pr of lam)
    if (pr[0] > 1e-6 * lmax && rSel.length < 6) rSel.push(pr[1]);
  if (rSel.length < 2) { dmdCache = { key, v: null }; return null; }
  const M1 = Array.from({ length: L }, () => new Array(L).fill(0));
  for (let a = 0; a < L; a++)
    for (let b = 0; b < L; b++) {
      let s6 = 0;
      for (let j = 0; j < CX; j++) s6 += Hk(a, j + 1) * Hk(b, j);
      M1[a][b] = s6;
    }
  const R = rSel.length;
  let A2 = Array.from({ length: R }, () => new Array(R).fill(0));
  for (let i = 0; i < R; i++)
    for (let k = 0; k < R; k++) {
      let s6 = 0;
      for (let a = 0; a < L; a++) {
        let rowS = 0;
        for (let b = 0; b < L; b++) rowS += M1[a][b] * U[b][rSel[k]];
        s6 += U[a][rSel[i]] * rowS;
      }
      A2[i][k] = s6 / Math.max(lamv[rSel[k]], 1e-12);
    }
  for (let it = 0; it < 160; it++) {
    const Q = Array.from({ length: R }, () => new Array(R).fill(0));
    const R2 = Array.from({ length: R }, () => new Array(R).fill(0));
    for (let j = 0; j < R; j++) {
      const v2 = [];
      for (let i = 0; i < R; i++) v2.push(A2[i][j]);
      for (let k = 0; k < j; k++) {
        let d6 = 0;
        for (let i = 0; i < R; i++) d6 += Q[i][k] * A2[i][j];
        R2[k][j] = d6;
        for (let i = 0; i < R; i++) v2[i] -= d6 * Q[i][k];
      }
      let nn = 0;
      for (let i = 0; i < R; i++) nn += v2[i] * v2[i];
      nn = Math.sqrt(nn);
      R2[j][j] = nn;
      for (let i = 0; i < R; i++) Q[i][j] = nn > 1e-12 ? v2[i] / nn : 0;
    }
    const NA = Array.from({ length: R }, () => new Array(R).fill(0));
    for (let i = 0; i < R; i++)
      for (let j2 = 0; j2 < R; j2++) {
        let s6 = 0;
        for (let k = 0; k < R; k++) s6 += R2[i][k] * Q[k][j2];
        NA[i][j2] = s6;
      }
    A2 = NA;
  }
  const modes = [];
  let ii = 0;
  while (ii < R) {
    if (ii + 1 < R && Math.abs(A2[ii + 1][ii]) >
        1e-4 * (Math.abs(A2[ii][ii]) + Math.abs(A2[ii + 1][ii + 1]) + 1e-9)) {
      const a6 = A2[ii][ii], b6 = A2[ii][ii + 1];
      const c7 = A2[ii + 1][ii], d7 = A2[ii + 1][ii + 1];
      const tr2 = a6 + d7, det2 = a6 * d7 - b6 * c7;
      const disc = tr2 * tr2 / 4 - det2;
      if (disc < 0) {
        const re = tr2 / 2, im = Math.sqrt(-disc);
        const om = Math.abs(Math.atan2(im, re));
        if (om > 0.05 && om < Math.PI - 0.05)
          modes.push({ om, rho: Math.hypot(re, im) });
      }
      ii += 2;
    } else ii++;
  }
  modes.sort((a, b) => b.rho - a.rho);
  const v = modes.length ? modes : null;
  dmdCache = { key, v };
  return v;
}

function renderStats() {
  statsMode = true;
  idleArt = null;
  idleState = null;
  const played = games
    .filter(g => visits[g])
    .sort((a, b) => visits[b] - visits[a] || byName(a, b));
  const pad = Math.max(0, ...games.map(g => g.length));
  const max = played.length ? visits[played[0]] : 1;

  let out = played.map(g => {
    const n = visits[g];
    const len = Math.max(1, Math.round(Math.log(n + 1) / Math.log(max + 1) * 30));
    return g.padEnd(pad + 2) + "#".repeat(len) + " " + n;
  }).join("\n");

  const unplayed = games.length - played.length;
  if (!played.length) out = "\u00b7";
  if (unplayed) out += "\n\n? " + unplayed;

  const sq = seq.map(x => x[0]).filter(g => games.includes(g));
  const sqT = seq.filter(x => games.includes(x[0])).map(x => x[1]);

  if (played.length > 1) {
    const total = played.reduce((s, g) => s + visits[g], 0);

    const H = -played.reduce((s, g) => {
      const p = visits[g] / total;
      return s + p * Math.log2(p);
    }, 0);

    const vals = games.map(g => visits[g] || 0).sort((a, b) => a - b);
    const nAll = vals.length;
    let wi = 0;
    vals.forEach((v, i) => { wi += (i + 1) * v; });
    const G = total ? (2 * wi) / (nAll * total) - (nAll + 1) / nAll : 0;

    out += "\n\nH = " + H.toFixed(2) +
           "   E = " + Math.pow(2, H).toFixed(1) +
           "   G = " + G.toFixed(2);

    if (played.length > 2) {
      const xs = played.map((g, i) => Math.log(i + 1));
      const ys = played.map(g => Math.log(visits[g]));
      const mx = xs.reduce((a, b) => a + b) / xs.length;
      const my = ys.reduce((a, b) => a + b) / ys.length;
      let cov = 0, varx = 0;
      for (let i = 0; i < xs.length; i++) {
        cov += (xs[i] - mx) * (ys[i] - my);
        varx += (xs[i] - mx) * (xs[i] - mx);
      }
      if (varx) out += "   Z = " + (cov / varx).toFixed(2);
    }

    let line2 = [];
    const lz = lzEntropy(sq);
    if (lz) {
      line2.push("h = " + lz.h.toFixed(2));
      const pi = fanoBound(lz.h, lz.S);
      if (pi !== null) line2.push("\u03a0 = " + pi.toFixed(2));
    }
    const hp = ppmEval();
    if (hp !== null) line2.push("h' = " + hp.toFixed(2));
    const cnts = played.map(g => visits[g]);
    const n1 = cnts.filter(c2 => c2 === 1).length;
    const n2c = cnts.filter(c2 => c2 === 2).length;
    line2.push("U = " + (n1 / total).toFixed(2));
    line2.push("C = " + (played.length + n1 * (n1 - 1) / (2 * (n2c + 1))).toFixed(1));
    if (line2.length) out += "\n" + line2.join("   ");

    let line3 = [];
    if (sqT.length >= 6) {
      const gaps = [];
      for (let i = 1; i < sqT.length; i++) gaps.push(sqT[i] - sqT[i - 1]);
      const a1 = gaps.slice(0, -1), b1 = gaps.slice(1);
      const m1 = a1.reduce((a, b) => a + b, 0) / a1.length;
      const m2 = b1.reduce((a, b) => a + b, 0) / b1.length;
      let cv = 0, s1 = 0, s2 = 0;
      for (let i = 0; i < a1.length; i++) {
        cv += (a1[i] - m1) * (b1[i] - m2);
        s1 += (a1[i] - m1) * (a1[i] - m1);
        s2 += (b1[i] - m2) * (b1[i] - m2);

    const K = Math.min(24, sq.length);
    if (K >= 8) {
      const tail = sq.slice(-K);
      const Rm = (i, j) => tail[i] === tail[j];

      for (let i = 0; i < K; i++) for (let j = 0; j < K; j++) {

        rec++;
        if ((i > 0 && j > 0 && Rm(i - 1, j - 1)) ||
            (i < K - 1 && j < K - 1 && Rm(i + 1, j + 1))) det++;
        const up = j > 0 && i !== j - 1 && Rm(i, j - 1);
        const dn = j < K - 1 && i !== j + 1 && Rm(i, j + 1);
        if (up || dn) lam++;
      }
      if (rec) {

        line3.push("V = " + (lam / rec).toFixed(2));

    }
    const al = dfaAlpha();

    let line4 = [];

    let line5 = [], hmB = null;

    let line6 = [];

    let lineC = [];
    if (sq.length >= 30) {
      const H2b = blockH(sq, 2), H3b = blockH(sq, 3);

    const rows = 32, cols = 48;

    const pts = new Set();

    if (played.length > 2) {
      const psH = played.map(g => visits[g] / total);
      const colsH = 32, rowsH = 12;

      for (let x = 0; x < colsH; x++) {

      out += "\n\n" + braille((x, y) => ptsH.has(x + "," + y), colsH, rowsH);

  }

  const daysPlayed = new Set();
  for (const g in vlog) if (games.includes(g))
    vlog[g].forEach(t => daysPlayed.add(Math.floor(t / 86400000)));
  if (daysPlayed.size) {
    let cur = 0, d = daysPlayed.has(dayNum) ? dayNum : dayNum - 1;
    while (daysPlayed.has(d)) { cur++; d--; }
    let best = 0, run = 0, prev = null;
    [...daysPlayed].sort((a, b) => a - b).forEach(x => {

    const wdf = d2 => new Date(d2 * 86400000 + 43200000).getDay();

  const bins = new Array(24).fill(0);
  for (const g in vlog) if (games.includes(g)) vlog[g].forEach(t => bins[new Date(t).getHours()]++);
  if (bins.some(b => b)) {
    const mxb = Math.max(...bins);

    out += "\n\n" + braille((x, y) => {
      const h = Math.floor(x / 2);

  const sparkTop = played.slice(0, 8);
  if (sparkTop.length) {

    out += "\n\n" + sparkTop.map(g => {
      const row = new Array(days).fill(0);
      (vlog[g] || []).forEach(t => {

      });

  const top = played.slice(0, 12);
  if (top.length > 1) {
    let mxt = 0;

  const K2 = Math.min(24, sq.length);
  if (K2 >= 4) {

  const gapsAll = [];
  for (let i = 1; i < sqT.length; i++) gapsAll.push(sqT[i] - sqT[i - 1]);
  if (gapsAll.length >= 8) {

  if (gapsAll.length >= 16) {

  if (gapsAll.length >= 12) {

  if (gapsAll.length >= 10) {

  const played2 = games.filter(g => visits[g]).sort(byName);
  if (played2.length >= 3 && sq.length >= 24) {
    const S3 = 48;
    const vi3 = new Map(played2.map((g, i) => [g, i]));

      if (i === undefined) return;
      const a3 = 2 * Math.PI * i / played2.length;

      g3[Math.floor(cy3 * (S3 - 1)) * S3 + Math.floor(cx3 * (S3 - 1))] = 1;
    });

  const xd2 = dailyCounts();
  if (xd2 && xd2.length >= 40) {
    const WW = 28, ST = 4;

    for (let per2 = 2; per2 <= 14; per2++) {

      for (let st2 = 0; st2 + WW <= xd2.length; st2 += ST) {
        const wG = 2 * Math.PI / per2;

  if (xd2 && xd2.length >= 32) {
    try {
      const xs2 = xd2.slice(-360);
      const N2 = xs2.length;
      const mean2 = xs2.reduce((a, b) => a + b, 0) / N2;
      const Y2 = [];
      let c4 = 0;
      xs2.forEach(v => { c4 += v - mean2; Y2.push(c4); });
      const qs2 = [-4, -3, -2, -1, -0.5, 0.5, 1, 2, 3, 4];
      const scales = [];
      for (let s5 = 4; s5 <= Math.floor(N2 / 4); s5 = Math.max(s5 + 1, Math.floor(s5 * 1.4)))
        scales.push(s5);
      if (scales.length >= 3) {
        const logFq = qs2.map(() => []);
        scales.forEach(s5 => {
          const nb = Math.floor(N2 / s5);
          const f2s = [];
          for (let b3 = 0; b3 < nb; b3++) {
            const seg = Y2.slice(b3 * s5, (b3 + 1) * s5);
            const mI = (s5 - 1) / 2;
            let sy = 0, sxy = 0, sxx = 0;
            seg.forEach((v, i) => { sy += v; sxy += (i - mI) * v; sxx += (i - mI) * (i - mI); });
            const b1 = sxx ? sxy / sxx : 0, b0 = sy / s5;
            let F = 0;
            seg.forEach((v, i) => { const r = v - (b0 + b1 * (i - mI)); F += r * r; });
            f2s.push(Math.max(F / s5, 1e-12));
          }
          qs2.forEach((q4, qi) => {
            let acc = 0;
            f2s.forEach(f => { acc += Math.pow(f, q4 / 2); });
            logFq[qi].push([Math.log(s5),
              Math.log(Math.pow(acc / f2s.length, 1 / q4))]);
          });
        });
        const hq = logFq.map(pts5 => ptsSlope(pts5));
        if (hq.every(v => v !== null && isFinite(v))) {
          const tauQ = qs2.map((q4, i) => q4 * hq[i] - 1);
          const alp = [], fal = [];
          for (let i = 1; i + 1 < qs2.length; i++) {
            const a4 = (tauQ[i + 1] - tauQ[i - 1]) / (qs2[i + 1] - qs2[i - 1]);
            alp.push(a4);
            fal.push(Math.max(0, Math.min(1, qs2[i] * a4 - tauQ[i])));
          }
          const aMin = Math.min(...alp), aMax = Math.max(...alp);
          if (aMax > aMin + 1e-6) {
            const S7 = 32, R7 = 12;
            const pts7 = new Set();
            for (let i = 0; i < alp.length; i++) {
              const px = Math.round((alp[i] - aMin) / (aMax - aMin) * (S7 - 1));
              const py = R7 - 1 - Math.round(fal[i] * (R7 - 1));
              pts7.add(px + "," + py);
              pts7.add(Math.min(S7 - 1, px + 1) + "," + py);
            }
            out += "\n\n" + braille((x, y) => pts7.has(x + "," + y), S7, R7);
          }
        }
      }
    } catch (e) {}
  }

  let mpr = null;
  try { mpr = matrixProfile(); } catch (e) {}
  if (mpr && mpr.n >= 16) {
    const W2 = 64;
    let mmx = 0;
    mpr.mp.forEach(v => { if (isFinite(v) && v > mmx) mmx = v; });
    if (mmx) {
      out += "\n\n" + braille((x, y) => {
        const i = Math.min(mpr.n - 1, Math.floor(x * mpr.n / W2));
        const h = isFinite(mpr.mp[i]) ? Math.round(mpr.mp[i] / mmx * 4) : 0;
        return h > 0 && y >= 4 - h;
      }, W2, 4);
      const rx = Math.floor(mpr.reg * W2 / mpr.n);
      const m1x = Math.floor(mpr.motif[0] * W2 / mpr.n);
      const m2x = Math.floor(mpr.motif[1] * W2 / mpr.n);
      out += "\n" + braille((x, y) => {
        if (x === rx) return true;
        if (y === 3 && (x === m1x || x === m2x)) return true;
        const i = Math.min(mpr.n - 1, Math.floor(x * mpr.n / W2));
        const h = Math.round((1 - mpr.cac[i]) * 4);
        return h > 0 && y >= 4 - h;
      }, W2, 4);
      try {
        const cns = consensusMotif();
        if (cns) {
          let cmn = Infinity, cmx = -Infinity;
          cns.w.forEach(v => { if (v < cmn) cmn = v; if (v > cmx) cmx = v; });
          const rng = Math.max(cmx - cmn, 1e-9);
          const cx0 = Math.floor(cns.idx * W2 / mpr.n);
          out += "\n" + braille((x, y) => {
            if (x === cx0 && y === 0) return true;
            if (x < 4 || x >= 4 + 28) return false;
            const p = (x - 4) / 27 * 6;
            const i0 = Math.min(5, Math.floor(p));
            const fr = p - i0;
            const v = cns.w[i0] * (1 - fr) + cns.w[i0 + 1] * fr;
            const h = Math.round((v - cmn) / rng * 3);
            return y === 3 - h || y === Math.min(3, 4 - h);
          }, W2, 4);
        }
      } catch (e) {}
    }
  }

  const topB = games.filter(g => visits[g])
    .sort((a, b) => frecency(b) - frecency(a)).slice(0, 12);
  if (topB.length >= 4) {
    const giB = new Map(games.map((g, i) => [g, i]));
    let simB = null;
    try { simB = simFn(); } catch (e) {}
    if (simB) {
      const edgesB = [];
      for (let i = 0; i < topB.length; i++)
        for (let j = i + 1; j < topB.length; j++)
          edgesB.push([1 - simB(giB.get(topB[i]), giB.get(topB[j])), i, j]);
      edgesB.sort((a, b) => a[0] - b[0]);
      const parB = topB.map((_, i) => i);
      const findB = i0 => { let i = i0; while (parB[i] !== i) i = parB[i] = parB[parB[i]]; return i; };

  const y = x.map(v => v - mean);
  let vy = 0;
  y.forEach(v => { vy += v * v; });
  if (!vy) return null;
  let bp = 0, bP = -1;
  for (let per = 2; per <= Math.min(30, N / 2); per += 0.25) {
    const w = 2 * Math.PI / per;
    let s2 = 0, c2 = 0;
    for (let t = 0; t < N; t++) { s2 += Math.sin(2 * w * t); c2 += Math.cos(2 * w * t); }
    const tau = Math.atan2(s2, c2) / (2 * w);
    let cs = 0, sc3 = 0, cc = 0, ss = 0;
    for (let t = 0; t < N; t++) {
      const a = w * (t - tau);
      const co = Math.cos(a), si = Math.sin(a);
      cs += y[t] * co; sc3 += y[t] * si;
      cc += co * co; ss += si * si;
    }
    const P = 0.5 * ((cs * cs) / (cc || 1) + (sc3 * sc3) / (ss || 1)) / (vy / N);
    if (P > bP) { bP = P; bp = per; }
  }
  return { per: bp, pow: bP };
}

function wassersteinDrift() {
  const now = Date.now();
  const c1 = {}, c2 = {};
  let t1 = 0, t2 = 0;
  for (const g in vlog) if (games.includes(g)) vlog[g].forEach(t => {
    const d = (now - t) / 86400000;
    if (d <= 30) { c1[g] = (c1[g] || 0) + 1; t1++; }
    else if (d <= 60) { c2[g] = (c2[g] || 0) + 1; t2++; }
  });
  if (t1 < 5 || t2 < 5) return null;
  let ordv = null;
  try { ordv = fiedlerOrder() || null; } catch (e) {}
  const base = games.slice();
  if (ordv) base.sort((a, b) => ordv[a] - ordv[b]);
  else base.sort(byName);
  let cum = 0, W1 = 0;
  base.forEach(g => {
    cum += (c1[g] || 0) / t1 - (c2[g] || 0) / t2;

  });

}

function mmdDrift() {
  const now = Date.now();
  const A = [], B = [];
  let co = null;
  try { co = communities(); } catch (e) {}
  const kC = co && co.k > 1 ? co.k : 1;
  for (const g in vlog) {
    if (!games.includes(g)) continue;
    const cm = co && co.lab[g] !== undefined ? co.lab[g] / kC : 0.5;
    vlog[g].forEach(t => {
      const d = (now - t) / 86400000;
      if (d > 60) return;
      const dt = new Date(t);
      const ha = 2 * Math.PI * (dt.getHours() + dt.getMinutes() / 60) / 24;
      const wa = 2 * Math.PI * dt.getDay() / 7;
      (d <= 30 ? A : B).push([Math.cos(ha), Math.sin(ha),
                              Math.cos(wa), Math.sin(wa), 2 * cm - 1]);
    });
  }
  if (A.length < 8 || B.length < 8) return null;
  const sub = arr => {
    if (arr.length <= 80) return arr;
    const o = [];
    for (let i = 0; i < 80; i++) o.push(arr[Math.floor(i * arr.length / 80)]);
    return o;
  };
  const X = sub(A), Y = sub(B);
  const d2 = (a, b) => {
    let s = 0;
    for (let i = 0; i < 5; i++) { const d = a[i] - b[i]; s += d * d; }
    return s;
  };
  const pool = X.concat(Y);
  const ds = [];
  for (let i = 0; i < pool.length; i += 3)
    for (let j = i + 1; j < pool.length; j += 7) ds.push(d2(pool[i], pool[j]));
  ds.sort((a, b) => a - b);
  const sg2 = Math.max(ds[Math.floor(ds.length / 2)] || 0, 1e-6);
  const kf = (a, b) => Math.exp(-d2(a, b) / sg2);
  const nx = X.length, ny = Y.length;
  let kxx = 0, kyy = 0, kxy = 0;
  for (let i = 0; i < nx; i++)
    for (let j = 0; j < nx; j++) { if (i !== j) kxx += kf(X[i], X[j]); }
  for (let i = 0; i < ny; i++)
    for (let j = 0; j < ny; j++) { if (i !== j) kyy += kf(Y[i], Y[j]); }
  for (let i = 0; i < nx; i++)
    for (let j = 0; j < ny; j++) kxy += kf(X[i], Y[j]);
  const mmd2 = kxx / (nx * (nx - 1)) + kyy / (ny * (ny - 1)) - 2 * kxy / (nx * ny);
  return Math.sqrt(Math.max(mmd2, 0));
}

let cnsCache = null;
function consensusMotif() {
  const x0 = dailyCounts();

  if (cnsCache && cnsCache.key === key) return cnsCache.v;
  const n = xs.length - m + 1;
  const zn = [];
  for (let i = 0; i < n; i++) {
    let s = 0, s2 = 0;
    for (let k = 0; k < m; k++) { s += xs[i + k]; s2 += xs[i + k] * xs[i + k]; }
    const mu = s / m, sg = Math.sqrt(Math.max(s2 / m - mu * mu, 1e-9));
    const w = new Array(m);
    for (let k = 0; k < m; k++) w[k] = (xs[i + k] - mu) / sg;
    zn.push(w);
  }
  const dist = (a, b) => {
    let s = 0;
    for (let k = 0; k < m; k++) { const d = zn[a][k] - zn[b][k]; s += d * d; }
    return Math.sqrt(s);
  };
  const SEG = 3;
  const bnd = [];
  for (let s = 0; s <= SEG; s++) bnd.push(Math.floor(s * xs.length / SEG));
  let best = null;
  const excl = Math.floor(m / 2);
  for (let i = 0; i < n; i++) {
    let rad = 0, ok = true;
    for (let s = 0; s < SEG && ok; s++) {
      let mn = Infinity;
      const j1 = bnd[s], j2 = Math.min(bnd[s + 1] - m + 1, n);
      for (let j = j1; j < j2; j++) {
        if (Math.abs(j - i) <= excl) continue;
        const d = dist(i, j);
        if (d < mn) mn = d;
      }
      if (!isFinite(mn)) ok = false;
      else if (mn > rad) rad = mn;
    }
    if (ok && (!best || rad < best.rad)) best = { idx: i, rad };
  }
  const v = best
    ? { idx: best.idx, rad: best.rad, w: xs.slice(best.idx, best.idx + m) }
    : null;
  cnsCache = { key, v };
  return v;
}

function matInv(Af, n) {
  const M = [];
  for (let i = 0; i < n; i++) {
    const row = new Array(2 * n).fill(0);
    for (let j = 0; j < n; j++) row[j] = Af[i * n + j];
    row[n + i] = 1;
    M.push(row);
  }
  for (let c = 0; c < n; c++) {
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (Math.abs(M[piv][c]) < 1e-12) return null;
    const tmp = M[c]; M[c] = M[piv]; M[piv] = tmp;
    const dv = M[c][c];
    for (let j = 0; j < 2 * n; j++) M[c][j] /= dv;
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r][c];
      if (!f) continue;
      for (let j = 0; j < 2 * n; j++) M[r][j] -= f * M[c][j];
    }
  }
  const out = new Array(n * n);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) out[i * n + j] = M[i][n + j];
  return out;
}

function cholFlat(Af, n) {
  const L = new Array(n * n).fill(0);
  for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
    let v = Af[i * n + j];
    for (let k = 0; k < j; k++) v -= L[i * n + k] * L[j * n + k];
    if (i === j) L[i * n + i] = Math.sqrt(Math.max(v, 1e-12));
    else L[i * n + j] = v / L[j * n + j];
  }
  return L;
}

function linFeat(g) {

  const e = glk[g];
  const dw = now.getDay();
  return [1, Math.sin(ha), Math.cos(ha),
          (dw === 0 || dw === 6) ? 1 : 0,
          Math.log1p(frecency(g)) / 3,
          same, rec,
          e ? Math.max(-1, Math.min(1, (e[0] - 1500) / 400)) : 0];
}

function linSample() {

function mvHawkes() {
  const ev = seq.filter(x => games.includes(x[0]));
  const key = ev.length + ":" + (ev.length ? ev[ev.length - 1][1] : 0) +
              ":" + Math.floor(Date.now() / 900000);
  if (mvhCache && mvhCache.key === key) return mvhCache;
  if (ev.length < 5) return (mvhCache = { key, lam: null, mu: null });
  const t0 = ev[0][1];
  const T = Math.max((Date.now() - t0) / 86400000, 0.1);
  const cnt = {};
  ev.forEach(e => { cnt[e[0]] = (cnt[e[0]] || 0) + 1; });
  const eta = 0.5;
  const rowT = {};
  for (const a in trans) {
    let tot = 0;
    for (const k in trans[a]) if (games.includes(k)) tot += trans[a][k];
    if (!tot) continue;
    rowT[a] = {};
    for (const k in trans[a]) if (games.includes(k)) rowT[a][k] = trans[a][k] / tot;
  }
  const BI = 12;
  const selfK = new Array(ev.length).fill(0);
  for (let i = 1; i < ev.length; i++) {
    const g = ev[i][0], t = ev[i][1];
    let s2 = 0;
    for (let j = Math.max(0, i - 30); j < i; j++)
      if (ev[j][0] === g) s2 += Math.exp(-BI * (t - ev[j][1]) / 86400000);
    selfK[i] = Math.min(s2, 1);
  }
  let best = null;
  for (const beta of [0.5, 1, 2, 4, 8]) {
    const base = new Array(ev.length).fill(0);
    for (let i = 1; i < ev.length; i++) {
      const g = ev[i][0], t = ev[i][1];
      let lam0 = Math.max((cnt[g] || 1) * 0.5 / T, 1e-3);
      for (let j = Math.max(0, i - 30); j < i; j++) {
        const a = (rowT[ev[j][0]] || {})[g] || 0;
        if (a) lam0 += eta * a * beta * Math.exp(-beta * (t - ev[j][1]) / 86400000);
      }
      base[i] = lam0;
    }
    for (const gam of [0, 0.3, 0.6, 0.9]) {
      let ll = 0;
      for (let i = 1; i < ev.length; i++)
        ll += Math.log(base[i] * Math.max(1 - gam * selfK[i], 0.1));
      if (!best || ll > best.ll) best = { ll, beta, gam };
    }
  }
  const beta = best.beta, gam = best.gam;
  const mu = {}, lam = {};
  games.forEach(g => {
    mu[g] = Math.max((cnt[g] || 0) * 0.5 / T, 1e-4);
    lam[g] = mu[g];
  });
  const nw = Date.now();
  for (let j = Math.max(0, ev.length - 40); j < ev.length; j++) {
    const row = rowT[ev[j][0]];
    if (!row) continue;
    const dec = beta * Math.exp(-beta * (nw - ev[j][1]) / 86400000);
    if (dec < 1e-6) continue;
    for (const g in row) if (lam[g] !== undefined) lam[g] += eta * row[g] * dec;
  }
  if (gam) {
    games.forEach(g => {
      const lg = vlog[g];
      if (!lg || !lg.length) return;
      let s2 = 0;
      for (let j = Math.max(0, lg.length - 10); j < lg.length; j++)
        s2 += Math.exp(-BI * (nw - lg[j]) / 86400000);
      lam[g] *= Math.max(1 - gam * Math.min(s2, 1), 0.1);
    });
  }
  games.forEach(g => {
    try {
      const lf = pvmLift(g, nw);
      if (lf !== null) lam[g] *= Math.max(0.5, Math.min(2, lf));
    } catch (e) {}
  });
  return (mvhCache = { key, lam, mu, beta, gam });
}

let poincCache = null;
function poincEmbed() {
  const tp = games.filter(g => visits[g])
    .sort((a, b) => frecency(b) - frecency(a)).slice(0, 14);
  if (tp.length < 5) return null;
  const key = tp.join("|") + ":" + seq.length;
  if (poincCache && poincCache.key === key) return poincCache.v;
  const sim = simFn();
  const gi = new Map(games.map((g, i) => [g, i]));
  const n = tp.length;
  const D = [];
  for (let i = 0; i < n; i++) {
    D.push(new Array(n).fill(0));
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const s2 = sim(gi.get(tp[i]), gi.get(tp[j]));
      D[i][j] = Math.min(4, -Math.log(Math.max(s2, 0.02)));
    }
  }
  const rg = mulberry32(hashStr(key) >>> 0);
  const P = [];
  for (let i = 0; i < n; i++) {
    const an = 2 * Math.PI * i / n + 0.3 * rg();
    const rr2 = 0.2 + 0.55 * i / n;
    P.push([rr2 * Math.cos(an), rr2 * Math.sin(an)]);
  }
  const dP = (u, v) => {
    const dx = u[0] - v[0], dy = u[1] - v[1];
    const nu = 1 - u[0] * u[0] - u[1] * u[1];
    const nv = 1 - v[0] * v[0] - v[1] * v[1];
    const x = 1 + 2 * (dx * dx + dy * dy) / Math.max(nu * nv, 1e-9);
    return Math.log(x + Math.sqrt(Math.max(x * x - 1, 0)));
  };
  for (let it = 0; it < 80; it++) {
    const lr = 0.04 * (1 - it / 90);
    for (let i = 0; i < n; i++) {
      let gx = 0, gy = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const d = dP(P[i], P[j]);
        const err = d - D[i][j];
        const h2 = 1e-4;
        const d1 = dP([P[i][0] + h2, P[i][1]], P[j]);
        const d2 = dP([P[i][0], P[i][1] + h2], P[j]);
        gx += err * (d1 - d) / h2;
        gy += err * (d2 - d) / h2;
      }
      const nu = 1 - P[i][0] * P[i][0] - P[i][1] * P[i][1];
      const sc = lr * nu * nu / 4;
      P[i][0] -= sc * gx;
      P[i][1] -= sc * gy;
      const nr = Math.hypot(P[i][0], P[i][1]);
      if (nr > 0.92) { P[i][0] *= 0.92 / nr; P[i][1] *= 0.92 / nr; }
    }
  }
  poincCache = { key, v: P };
  return P;
}

function reachability() {
  if (!last || !games.includes(last)) return null;
  if (reachCache && reachCache.root === last) return reachCache.v;
  const idx = new Map(games.map((g, i) => [g, i]));
  const n = games.length;
  const rows = games.map(g => {
    const r = trans[g];
    if (!r) return null;
    let tot = 0;
    const out = [];
    for (const k in r) {
      const j = idx.get(k);
      if (j !== undefined) { out.push([j, r[k]]); tot += r[k]; }
    }
    if (!tot) return null;
    return out.map(pr => [pr[0], pr[1] / tot]);
  });
  let v = new Array(n).fill(0);
  v[idx.get(last)] = 1;
  const acc = new Array(n).fill(0);
  let gp = 1;
  for (let t = 1; t <= 15; t++) {
    const nv = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      if (!v[i] || !rows[i]) continue;
      for (const pr of rows[i]) nv[pr[0]] += v[i] * pr[1];
    }
    v = nv;
    gp *= 0.7;
    for (let i = 0; i < n; i++) acc[i] += gp * v[i];
  }
  const out = {};
  games.forEach((g, i) => { out[g] = acc[i]; });
  reachCache = { root: last, v: out };

}

function hlFeat(g) {
  const log = vlog[g] || [];
  const gaps = [];
  for (let i = 1; i < log.length; i++) gaps.push(log[i] - log[i - 1]);
  let B = 0;
  if (gaps.length) {
    const mean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    let sd = 0;
    gaps.forEach(gp => { sd += (gp - mean) * (gp - mean); });
    sd = Math.sqrt(sd / gaps.length);
    B = (sd + mean) ? (sd - mean) / (sd + mean) : 0;
  }
  return [1, Math.log1p(log.length) / 3, B,
          Math.log(medGap(g) / 86400000 + 0.05) / 4];
}

function hlMult(g) {
  const x = hlFeat(g);
  let v = 0;
  for (let i = 0; i < 4; i++) v += hlw[i] * x[i];
  return Math.min(2, Math.max(0.5, Math.exp(v)));
}

function hlwUpdate(g, y, elapsed) {
  const x = hlFeat(g);
  const nlog = (vlog[g] || []).length;
  const base = medGap(g) * (1 + 0.1 * Math.max(0, nlog - 3)) * (hlm[g] || 1);
  const hl = base * hlMult(g);
  if (!(hl > 0) || !(elapsed > 0)) return;
  const pr = Math.pow(2, -elapsed / hl);
  const gr = Math.max(-4, Math.min(4,
    (y - pr) / Math.max(1 - pr, 0.1) * Math.LN2 * Math.min(elapsed / hl, 4)));
  for (let i = 0; i < 4; i++)
    hlw[i] = Math.max(-1.5, Math.min(1.5, hlw[i] + 0.12 * gr * x[i]));
  localStorage.setItem("hlw", JSON.stringify(hlw));
}

let coxCache = null;
function coxFit() {
  const key = seq.length + ":" + games.length + ":" + dayNum;
  if (coxCache && coxCache.key === key) return coxCache.b ? coxCache : null;
  const evs = [];
  const nowC = Date.now();
  for (const g in vlog) {
    if (!games.includes(g)) continue;
    const lg = vlog[g];
    if (lg.length < 3) continue;
    const x = hlFeat(g).slice(1);
    for (let i = 1; i < lg.length; i++) evs.push([lg[i] - lg[i - 1], 1, x]);
    evs.push([nowC - lg[lg.length - 1], 0, x]);
  }
  let nEv = 0;
  evs.forEach(e => { nEv += e[1]; });
  if (nEv < 12) { coxCache = { key, b: null }; return null; }
  if (evs.length > 400) evs.splice(0, evs.length - 400);
  evs.sort((a, b) => a[0] - b[0]);
  const P = 3, b = [0, 0, 0];
  for (let it = 0; it < 25; it++) {
    const grad = [0, 0, 0], S1 = [0, 0, 0];
    let S0 = 0;
    for (let i = evs.length - 1; i >= 0; i--) {
      const e = evs[i];
      let dot = 0;
      for (let k = 0; k < P; k++) dot += b[k] * e[2][k];
      const w = Math.exp(Math.max(-8, Math.min(8, dot)));
      S0 += w;
      for (let k = 0; k < P; k++) S1[k] += w * e[2][k];
      if (e[1]) for (let k = 0; k < P; k++) grad[k] += e[2][k] - S1[k] / S0;
    }
    for (let k = 0; k < P; k++)
      b[k] = Math.max(-2, Math.min(2, b[k] + 0.6 * grad[k] / nEv - 0.01 * b[k]));
  }
  let mean = 0, cnt = 0;
  for (const g in vlog) {
    if (!games.includes(g) || (vlog[g] || []).length < 3) continue;
    const x = hlFeat(g).slice(1);
    for (let k = 0; k < P; k++) mean += b[k] * x[k];
    cnt++;
  }
  coxCache = { key, b, mean: cnt ? mean / cnt : 0 };
  return coxCache;
}

function ptsSlope(pts) {

  const my = pts.reduce((a, pt) => a + pt[1], 0) / pts.length;
  let cov = 0, vx = 0;
  pts.forEach(pt => {
    cov += (pt[0] - mx) * (pt[1] - my);
    vx += (pt[0] - mx) * (pt[0] - mx);

  return vx ? cov / vx : null;
}

function permEntropy(x, m) {

    cnt.set(key, (cnt.get(key) || 0) + 1);

  cnt.forEach(c => { const pr = c / n; H -= pr * Math.log2(pr); });

function hurstRS(x) {
  if (x.length < 16) return null;
  const pts = [];
  for (let sz = 8; sz <= Math.floor(x.length / 2); sz = Math.max(sz + 1, Math.floor(sz * 1.6))) {
    const nb = Math.floor(x.length / sz);

      let cum = 0, mxc = -Infinity, mnc = Infinity, sd = 0;

function lyapRosen(x) {

function higuchiFD(x) {

function specEntropy(x) {

    let re = 0, im = 0;
    for (let t = 0; t < N; t++) {

      re += (x[t] - mean) * Math.cos(a);
      im -= (x[t] - mean) * Math.sin(a);

    const p = re * re + im * im;

  let H = 0;
  P.forEach(p => {

function taylorB() {

function ricciCurv() {
  const top = games.filter(g => visits[g])

    for (let qi = 0; qi < q.length; qi++) {
      const u = q[qi];
      for (const v of adj[u]) if (d[v] < 0) { d[v] = d[u] + 1; q.push(v); }

    const m = new Map([[i, 0.5]]);

  return edges.map(([i, j]) => {

    mi.forEach((si, a) => mj.forEach((dj, b) => pairs.push([hop[a][b], a, b])));

function transferEntropy() {
  const ev = seq.filter(x => games.includes(x[0]));

  for (let i = 1; i < ev.length; i++) {

    const h = Math.floor(new Date(ev[i][1]).getHours() / 6);

    inc(c3, gp + "|" + h + "|" + g);

function vnEntropy() {
  const top = games.filter(g => visits[g])
    .sort((a, b) => frecency(b) - frecency(a)).slice(0, 48);
  const n = top.length;
  if (n < 4) return null;
  const gi = new Map(games.map((g, i) => [g, i]));
  const sim = simFn();
  const A = [];
  for (let i = 0; i < n; i++) A.push(new Float64Array(n));
  let tr = 0, any = false;
  for (let i = 0; i < n; i++) {
    let d = 0;
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const w = sim(gi.get(top[i]), gi.get(top[j]));
      A[i][j] = -w;
      d += w;
      if (w > 0) any = true;
    }
    A[i][i] = d;
    tr += d;
  }
  if (!any || !tr) return null;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) A[i][j] /= tr;
  for (let sweep = 0; sweep < 30; sweep++) {
    let off = 0;
    for (let pi = 0; pi < n - 1; pi++)
      for (let qi = pi + 1; qi < n; qi++) off += A[pi][qi] * A[pi][qi];
    if (off < 1e-14) break;
    for (let pi = 0; pi < n - 1; pi++) for (let qi = pi + 1; qi < n; qi++) {
      if (Math.abs(A[pi][qi]) < 1e-12) continue;
      const th = (A[qi][qi] - A[pi][pi]) / (2 * A[pi][qi]);
      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
      const c = 1 / Math.sqrt(t * t + 1), sn = t * c;

        A[k][pi] = c * akp - sn * akq;
        A[k][qi] = sn * akp + c * akq;

        const apk = A[pi][k], aqk = A[qi][k];

let ddmHov = null;
function ddmObserve(rt, hit) {
  const t = Math.max(0.08, Math.min(rt / 1000, 8));

  ddm.pc += lr * (hit - ddm.pc);

function ddmDrift() {

  let pc = Math.max(0.02, Math.min(0.98, ddm.pc));
  if (Math.abs(pc - 0.5) < 0.005) pc = 0.505;

  const x = L * (L * pc * pc - L * pc + pc - 0.5) / ddm.v;

function immStep(st, z, dt) {
  if (!st) return { a: [z, 0, 0], b: [z, 0, 0], mu: [0.5, 0.5], f: [z, 0, 0] };
  const TP = [[0.94, 0.06], [0.10, 0.90]];
  const mix = (m0, m1, w0, w1) => {
    const Wm = w0 + w1 || 1;
    return [(m0[0] * w0 + m1[0] * w1) / Wm,
            (m0[1] * w0 + m1[1] * w1) / Wm,
            (m0[2] * w0 + m1[2] * w1) / Wm];
  };
  const a0 = mix(st.a, st.b, TP[0][0] * st.mu[0], TP[1][0] * st.mu[1]);
  const b0 = mix(st.a, st.b, TP[0][1] * st.mu[0], TP[1][1] * st.mu[1]);
  const step = (m, AL, BE, GA) => {
    const pp = m[0] + m[1] * dt + 0.5 * m[2] * dt * dt;
    const pv = m[1] + m[2] * dt;
    const r = z - pp;
    return [[pp + AL * r, pv + BE * r / dt, m[2] + GA * 2 * r / (dt * dt)], r];
  };
  const ra = step(a0, 0.30, 0.10, 0.02);
  const rb = step(b0, 0.75, 0.50, 0.15);
  const SA = 60, SB = 14;
  const la = Math.exp(-0.5 * (ra[1] / SA) * (ra[1] / SA)) / SA;
  const lb = Math.exp(-0.5 * (rb[1] / SB) * (rb[1] / SB)) / SB;
  const cj0 = TP[0][0] * st.mu[0] + TP[1][0] * st.mu[1];
  const cj1 = TP[0][1] * st.mu[0] + TP[1][1] * st.mu[1];
  let m0 = cj0 * la, m1 = cj1 * lb;
  const Z = m0 + m1 || 1;
  m0 = Math.max(0.02, Math.min(0.98, m0 / Z));
  m1 = 1 - m0;

}
let gTrail = [], gT = null;

  const dur = tr[tr.length - 1][2] - tr[0][2];

  for (let i = 1; i < tr.length; i++)
    L += Math.hypot(tr[i][0] - tr[i - 1][0], tr[i][1] - tr[i - 1][1]);
  if (L < 240) return;
  const dx = tr[tr.length - 1][0] - tr[0][0];
  const dy = tr[tr.length - 1][1] - tr[0][1];
  const closure = Math.hypot(dx, dy) / L;
  const step = Math.max(1, Math.floor(tr.length / 24));
  const rs = [];
  for (let i = 0; i < tr.length; i += step) rs.push(tr[i]);
  let turn = 0;
  for (let i = 2; i < rs.length; i++) {
    const a1 = Math.atan2(rs[i - 1][1] - rs[i - 2][1], rs[i - 1][0] - rs[i - 2][0]);
    const a2 = Math.atan2(rs[i][1] - rs[i - 1][1], rs[i][0] - rs[i - 1][0]);
    let d = a2 - a1;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    turn += d;
  }
  let mnX = Infinity, mxX = -Infinity, mnY = Infinity, mxY = -Infinity;

function bubbleRow(ey) {
  const out = { i: -1, d: Infinity, p: 0 };
  if (!rowEls.length || !render.list ||
      rowEls.length !== render.list.length) return out;
  let em = null;
  try { em = ensembleMap(); } catch (e) {}
  let pmx = 0;
  if (em) em.forEach(p => { if (p > pmx) pmx = p; });
  const rh = rowPx();

  for (let i = 0; i < rowEls.length; i++) {

function trackPt(x, y) {
  const tN = performance.now();
  mmPts.push([x, y, tN]);
  if (mmPts.length > 6) mmPts.shift();
  if (gTrail.length && tN - gTrail[gTrail.length - 1][2] > 300) gTrail = [];
  gTrail.push([x, y, tN]);
  if (gTrail.length > 200) gTrail.shift();
  if (gT) clearTimeout(gT);
  gT = setTimeout(gestClass, 170);

  kfX = immStep(kfX, x, dtK);

function predictEndpoint() {
  if (!kfX || !kfY || !rowEls.length) return;
  const vx = kfX.f[1], vy = kfY.f[1];
  const sp = Math.hypot(vx, vy);
  if (sp < 0.25) return;
  const dec = (vx * kfX.f[2] + vy * kfY.f[2]) / (sp || 1);
  let T, FJ;
  if (dec < -1e-4) {
    T = Math.min(420, -sp / dec);
    FJ = 0.6;
  } else {
    T = 120;
    FJ = 0.5;

  const muH = (kfX.mu[1] + kfY.mu[1]) / 2;
  T *= 1 - 0.35 * muH;
  const ex = Math.max(0, Math.min(innerWidth - 1, kfX.f[0] + vx * T * FJ));
  const ey = Math.max(0, Math.min(innerHeight - 1, kfY.f[0] + vy * T * FJ));

  const th = (srt[Math.floor(srt.length * 0.25)] +
              srt[Math.floor(srt.length * 0.75)]) / 2;
  for (let y = 0; y < SYNC_CH; y++) {
    const row = [];
    for (let x = 0; x < SYNC_CW; x++)
      row.push(lum[y * SYNC_CW + x] < th ? 1 : 0);
    g.push(row);
  }
  return g;
}
function syncRxTick(vid, cv) {
  if (!syncMode || !syncMode.rx) return;
  try {
    const w = vid.videoWidth || 0, h = vid.videoHeight || 0;
    if (!w || !h) return;
    cv.width = w; cv.height = h;
    const ctx2 = cv.getContext("2d");
    if (!ctx2) return;
    ctx2.drawImage(vid, 0, 0, w, h);
    let found = null;
    for (const sc of [0.82, 0.62, 0.45]) {
      const gw = w * sc, gh = gw * (SYNC_CH / SYNC_CW) * 0.9;
      if (gh > h) continue;
      const x0 = (w - gw) / 2, y0 = (h - gh) / 2;
      const g = syncRxSample(ctx2, w, h, x0, y0, gw / SYNC_CW, gh / SYNC_CH);
      if (!g) continue;
      const p = syncCellsParse(g);
      if (p) { found = p; break; }
    }
    if (!found) return;
    if (found.par === syncMode.lastPar) return;
    syncMode.lastPar = found.par;
    syncAbsorbBits(found.bits);
  } catch (e) {}
}

function syncAbsorbBits(bits) {
  if (!syncMode || !syncMode.rx) return;
  const pkt = syncParseBits(bits);
  if (!pkt) return;
  if (!syncMode.dec) syncMode.dec = ltNewDecoder(pkt.K, pkt.len);
  if (pkt.K !== syncMode.dec.K || pkt.len !== syncMode.dec.len) return;
  syncMode.got++;
  if (ltAbsorb(syncMode.dec, pkt.seed, pkt.data)) {
    const bytes = ltResult(syncMode.dec);
    if (bytes) {
      try { syncApply(ltUnpack(bytes)); } catch (e) {}
    }
    syncStop();
  }
}

const FSK_TONES = 16, FSK_F0 = 1500, FSK_DF = 150;
const FSK_PRE = [1200, 4000], FSK_SYM = 0.025, FSK_PREDUR = 0.06;
function fskMod(bits, sr) {
  const nSym = Math.ceil(bits.length / 4);
  const spS = Math.round(sr * FSK_SYM);
  const spP = Math.round(sr * FSK_PREDUR);
  const out = new Float32Array(spP * 2 + nSym * spS);
  let o = 0;
  const tone = (f, n) => {
    for (let i = 0; i < n; i++) {
      let g = 1;
      const r = Math.min(i, n - 1 - i) / (sr * 0.003);
      if (r < 1) g = 0.5 - 0.5 * Math.cos(Math.PI * Math.max(r, 0));
      out[o++] = 0.6 * g * Math.sin(2 * Math.PI * f * i / sr);
    }
  };
  tone(FSK_PRE[0], spP);
  tone(FSK_PRE[1], spP);
  for (let s = 0; s < nSym; s++) {
    let v = 0;
    for (let b = 0; b < 4; b++) v = v * 2 + (bits[s * 4 + b] || 0);
    tone(FSK_F0 + v * FSK_DF, spS);
  }
  return out;
}
function goertzel(buf, off, n, f, sr) {
  const w = 2 * Math.PI * f / sr;
  const cw = 2 * Math.cos(w);
  let s1 = 0, s2 = 0;
  for (let i = 0; i < n; i++) {
    const s0 = buf[off + i] + cw * s1 - s2;
    s2 = s1;
    s1 = s0;
  }
  return s1 * s1 + s2 * s2 - cw * s1 * s2;
}
function fskDemod(buf, sr, nBits) {
  const spS = Math.round(sr * FSK_SYM);
  const spP = Math.round(sr * FSK_PREDUR);
  const nSym = Math.ceil(nBits / 4);
  const need = spP * 2 + nSym * spS;
  const stride = Math.max(1, Math.round(sr * 0.005));
  let bestSt = -1, bestSc = 0;
  for (let st = 0; st + need <= buf.length; st += stride) {
    const eA = goertzel(buf, st, spP, FSK_PRE[0], sr);
    const eB = goertzel(buf, st, spP, FSK_PRE[1], sr);
    if (!(eA > 4 * (eB + 1e-9))) continue;
    const eA2 = goertzel(buf, st + spP, spP, FSK_PRE[0], sr);
    const eB2 = goertzel(buf, st + spP, spP, FSK_PRE[1], sr);
    if (!(eB2 > 4 * (eA2 + 1e-9))) continue;
    const sc = eA * eB2;
    if (sc > bestSc) { bestSc = sc; bestSt = st; }
  }
  if (bestSt < 0) return null;
  let st = bestSt;
  let bsc = -1;
  const fine = Math.max(1, Math.round(stride / 8));
  for (let o2 = -stride; o2 <= stride; o2 += fine) {
    const p = bestSt + o2;
    if (p < 0 || p + need > buf.length) continue;
    const sc = goertzel(buf, p, spP, FSK_PRE[0], sr) *
               goertzel(buf, p + spP, spP, FSK_PRE[1], sr);
    if (sc > bsc) { bsc = sc; st = p; }
  }
  const bits = [];
  let o = st + spP * 2;
  for (let s = 0; s < nSym; s++) {
    let bi = 0, bv = -1;
    for (let k = 0; k < FSK_TONES; k++) {
      const e = goertzel(buf, o + 2, spS - 4, FSK_F0 + k * FSK_DF, sr);
      if (e > bv) { bv = e; bi = k; }
    }
    for (let b = 3; b >= 0; b--) bits.push((bi >> b) & 1);
    o += spS;
  }
  return { bits: bits.slice(0, nBits), end: o };
}
function fskTxTick() {
  if (!syncMode || !syncMode.tx) return;
  if (!ac || !audioOn) {
    syncMode.aT = setTimeout(fskTxTick, 800);
    return;
  }
  try {
    const bits = syncFrameBits(syncMode.msg, syncMode.K,
                               syncMode.seed++, syncMode.cdf);
    const sm = fskMod(bits, ac.sampleRate);
    const buf = ac.createBuffer(1, sm.length, ac.sampleRate);
    buf.getChannelData(0).set(sm);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const gn = ac.createGain();
    gn.gain.value = 0.5;
    src.connect(gn);
    gn.connect(ac.destination);
    src.onended = () => {
      if (syncMode && syncMode.tx)
        syncMode.aT = setTimeout(fskTxTick, 150);
    };
    syncMode.aSrc = src;
    src.start();
  } catch (e) {
    if (syncMode && syncMode.tx)
      syncMode.aT = setTimeout(fskTxTick, 1200);
  }
}
function fskRxStart() {
  try {
    if (typeof navigator === "undefined" || !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) return;
    const AC = (typeof AudioContext !== "undefined") ? AudioContext
      : (typeof webkitAudioContext !== "undefined") ? webkitAudioContext : null;
    if (!AC) return;
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        if (!syncMode || !syncMode.rx) {
          try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
          return;
        }
        syncMode.aStream = stream;
        const rc = new AC();
        syncMode.rc = rc;
        const srcN = rc.createMediaStreamSource(stream);
        const sp = rc.createScriptProcessor(4096, 1, 1);
        srcN.connect(sp);
        const sink = rc.createGain();
        sink.gain.value = 0;
        sp.connect(sink);
        sink.connect(rc.destination);
        const sr = rc.sampleRate;
        const NBITS = 80 + LT_B * 8;
        const spS = Math.round(sr * FSK_SYM);
        const spP = Math.round(sr * FSK_PREDUR);
        const need = spP * 2 + Math.ceil(NBITS / 4) * spS + 4096;
        const ring = [];
        let ringLen = 0;
        sp.onaudioprocess = ev => {
          if (!syncMode || !syncMode.rx) return;
          try {
            ring.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
            ringLen += ring[ring.length - 1].length;
            if (ringLen < need) return;
            const buf = new Float32Array(ringLen);
            let o = 0;
            ring.forEach(c => { buf.set(c, o); o += c.length; });
            const r = fskDemod(buf, sr, NBITS);
            if (r) {
              syncAbsorbBits(r.bits);
              let drop = r.end;
              while (ring.length && drop >= ring[0].length) {
                drop -= ring[0].length;
                ringLen -= ring[0].length;
                ring.shift();
              }
            } else {
              while (ringLen > 2 * need) {
                ringLen -= ring[0].length;
                ring.shift();
              }
            }
          } catch (e) {}
        };
      })
      .catch(() => {});
  } catch (e) {}
}

try { aoCheck(); } catch (e) {}
try {
  if (typeof addEventListener === "function")
    addEventListener("pageshow", ev => { if (ev && ev.persisted) aoCheck(); });
} catch (e) {}

let wlLead = true;
try {
  if (typeof navigator !== "undefined" && navigator.locks &&
      typeof navigator.locks.request === "function") {
    wlLead = false;
    navigator.locks.request("wl0", () => {
      wlLead = true;
      return new Promise(() => {});
    }).catch(() => { wlLead = true; });
  }
} catch (e) { wlLead = true; }

["keydown", "mousemove", "mousedown"].forEach(ev =>
  document.addEventListener(ev, () => {
    lastAct = Date.now();
    if (idleArt) {
      if (idleT0) {
        try { idleObserve(idleKind, Date.now() - idleT0, icp.prog); } catch (e) {}
        idleT0 = 0;
      }
      try { icpReset(); } catch (e) {}
      idleArt = null;
      idleState = null;
      if (booted && !statsMode) render();
    }
  }));

setInterval(() => {
  if (!booted || statsMode || syncMode || !wlLead) return;
  if (Date.now() - lastAct < 30000) return;
  if (inputPending()) return;
  const go = () => {
    if (!booted || statsMode || Date.now() - lastAct < 30000) return;
    if (inputPending()) return;
    if (!idleArt) {
      try { idleKind = chooseIdle(); } catch (e) {}
      idleState = null;
      idleT0 = Date.now();
      icpReset();
    }
    stepIdle();
    try { icpStep(); } catch (e) {}
    render();
  };
  if (typeof requestIdleCallback === "function") requestIdleCallback(go, { timeout: 300 });
  else go();
}, 350);

setInterval(() => {
  if (!booted || statsMode) return;
  try { prefetchTop(); } catch (e) {}
}, 600000);

document.addEventListener("keydown", e => {
  if (!booted) return;
  audioInit();

  if (syncMode) {
    if (e.key === ";" || e.key === ":" || e.key === "Escape") syncStop();
    e.preventDefault();
    return;
  }
  if (statsMode) { render(); e.preventDefault(); return; }
  if (e.key === "=") { renderStats(); e.preventDefault(); return; }
  if (e.key === ";" && !query) { syncTxStart(); e.preventDefault(); return; }
  if (e.key === ":" && !query) { syncRxStart(); e.preventDefault(); return; }

  if (dsh) {
    if (e.key === "Escape" || e.key === "/") {
      dsh = null;
      render();
      e.preventDefault();
      return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const ch = dshChoices();
      if (ch.length)
        dsh.hi = ((dsh.hi || 0) + (e.key === "ArrowDown" ? 1 : -1) + ch.length) % ch.length;
      render();
      e.preventDefault();
      return;
    }
    if (e.key === "Enter") {
      const ch = dshChoices();
      if (ch.length) dshCommit(ch[Math.min(dsh.hi || 0, ch.length - 1)].c);
      e.preventDefault();
      return;
    }
    if (e.key === "Backspace") {
      dsh.prefix = dsh.prefix.slice(0, -1);
      dsh.hi = 0;
      render();
      e.preventDefault();
      return;
    }
    if (e.key.length === 1 && /[a-z0-9 \-_.]/i.test(e.key)) {
      dshCommit(e.key.toLowerCase());
      e.preventDefault();
      return;
    }
    e.preventDefault();
    return;
  }
  if (e.key === "/") {
    dsh = { prefix: "", hi: 0 };
    query = "";
    cursor = 0;
    render();
    e.preventDefault();
    return;
  }

  const list = filtered();

  if (e.key === "ArrowDown") {
    if (list.length) { cursor = (cursor + 1) % list.length; render(); }
    e.preventDefault();
  }
  else if (e.key === "ArrowUp") {
    if (list.length) { cursor = (cursor - 1 + list.length) % list.length; render(); }
    e.preventDefault();
  }
  else if (e.key === "Enter") {
    if (effQuery() && filtered.fz && cursor > 0)
      fzLearn(effQuery(), list[cursor], list[0]);
    if (effQuery() && !filtered.fz && list[cursor]) {
      try { ryAdd(effQuery(), list[cursor]); } catch (e2) {}
    }
    open(list[cursor], effQuery() ? null : list.slice(0, cursor),
         effQuery() ? null : list.slice(cursor + 1, 20));
  }
  else if (e.key === "Tab") {
    query = localStorage.getItem("savedq") || "";
    cursor = 0;
    render();
    e.preventDefault();
  }
  else if (e.key === "Escape") { query = ""; cursor = 0; pendingFix = null; render(); }
  else if (e.key === "Backspace") {
    pendingFix = query.slice(-1) || pendingFix;
    query = query.slice(0, -1);
    if (effQuery()) localStorage.setItem("savedq", query);
    render();
    e.preventDefault();
  }
  else if (e.key === "!") {
    const g = banditPick();
    if (g) {
      const t = Date.now();
      pendingBandit = { g, t, d: t + Math.max(86400000, Math.round(3 * bTau())),
                        b: bucketNow(), x: banditPick.lastX || null,
                        p: banditPick.lastP || null };
      localStorage.setItem("bandit", JSON.stringify(pendingBandit));
    }
    open(g);
  }
  else if (e.key === "s" && !query) {
    sortMode = (sortMode + 1) % NMODE;
    applySort();
    vtRender();
  }
  else if (e.key === "r" && !query) {
    const rr = mulberry32(dayNum ^ 0x51ED270B);
    const sim = simFn();
    const gIdx = new Map(games.map((g, i) => [g, i]));
    const base = games.slice().sort(byName);
    const n = base.length;
    const Lv = (i, j) => i === j ? 1.04 : sim(gIdx.get(base[i]), gIdx.get(base[j]));
    const d = new Array(n).fill(1.04);
    const cs = [];
    const alive = new Set(base.map((_, i) => i));
    const order = [];
    while (alive.size) {
      let tot = 0;
      alive.forEach(i => { tot += Math.max(d[i], 1e-9); });
      let r2 = rr() * tot, pick = -1;
      for (const i of alive) {
        r2 -= Math.max(d[i], 1e-9);
        if (r2 <= 0) { pick = i; break; }
      }
      if (pick < 0) pick = [...alive].pop();
      order.push(base[pick]);
      alive.delete(pick);
      const dj = Math.sqrt(Math.max(d[pick], 1e-9));
      const cj = new Array(n).fill(0);
      alive.forEach(i => {
        let dot = 0;
        cs.forEach(cv => { dot += cv[i] * cv[pick]; });
        cj[i] = (Lv(i, pick) - dot) / dj;
        d[i] = Math.max(d[i] - cj[i] * cj[i], 0);
      });
      cj[pick] = dj;
      cs.push(cj);
    }
    shown = order;
    tdi = null;
    cursor = 0;
    render();
  }
  else if (e.key === "'") {
    audioOn = !audioOn;
    localStorage.setItem("aud", audioOn ? "1" : "0");
    if (audioOn && ac === null) audioInit();
    else { geigerLoop(); droneUpdate(); euclidLoop(); shepLoop(); risLoop();
           vossLoop(); reichLoop(); tonnetzLoop(); binLoop(); }
  }
  else if (e.key.length === 1 && /[a-z0-9 \-_.]/i.test(e.key)) {
    if (pendingFix && pendingFix !== e.key &&
        /[a-z0-9]/i.test(pendingFix) && /[a-z0-9]/i.test(e.key)) {
      const ck = (pendingFix + e.key).toLowerCase();
      conf[ck] = (conf[ck] || 0) + 1;
      confTotCache = null;
      localStorage.setItem("conf", JSON.stringify(conf));
    }
    const nowK = Date.now();
    if (kdT && nowK - kdT < 2000) {
      kdF.push(Math.log(nowK - kdT));
      if (kdF.length > 12) kdF.shift();
      if (kdF.length >= 6) {
        const mK = kdF.reduce((a2, b2) => a2 + b2, 0) / kdF.length;
        let vK = 0;
        kdF.forEach(v2 => { vK += (v2 - mK) * (v2 - mK); });
        vK = Math.sqrt(vK / kdF.length);
        let totK = 0;
        kdc.n.forEach(nc => { totK += nc; });
        const ln2d = (c0, c1, sg) =>
          -2 * Math.log(sg) -
          ((mK - c0) * (mK - c0) + (vK - c1) * (vK - c1)) / (2 * sg * sg);
        let bi = 0, bl = -Infinity;
        kdc.c.forEach((cc, ci) => {
          const l = Math.log(kdc.n[ci] / (totK + KDP_A)) + ln2d(cc[0], cc[1], KDP_SIG);
          if (l > bl) { bl = l; bi = ci; }
        });
        const lNew = Math.log(KDP_A / (totK + KDP_A)) + ln2d(5.4, 0.8, KDP_SIG0);
        if (lNew > bl && totK > 24 && kdc.c.length < KDP_MAX) {
          kdc.c.push([mK, vK]);
          kdc.n.push(1);
          kcur = kdc.c.length - 1;
        } else {
          kcur = bi;
          const cN = kdc.c[kcur], lrK = 1 / Math.min(kdc.n[kcur] + 1, 200);
          cN[0] += lrK * (mK - cN[0]);
          cN[1] += lrK * (vK - cN[1]);
          kdc.n[kcur]++;
        }
        for (let ci = kdc.c.length - 1; ci > 0; ci--)
          for (let cj = 0; cj < ci; cj++) {
            if (Math.hypot(kdc.c[ci][0] - kdc.c[cj][0],
                           kdc.c[ci][1] - kdc.c[cj][1]) < 0.08) {
              const nT = kdc.n[ci] + kdc.n[cj];
              kdc.c[cj][0] = (kdc.c[cj][0] * kdc.n[cj] + kdc.c[ci][0] * kdc.n[ci]) / nT;
              kdc.c[cj][1] = (kdc.c[cj][1] * kdc.n[cj] + kdc.c[ci][1] * kdc.n[ci]) / nT;
              kdc.n[cj] = nT;
              kdc.c.splice(ci, 1);
              kdc.n.splice(ci, 1);
              if (kcur === ci) kcur = cj;
              else if (kcur > ci) kcur--;
              break;
            }
          }
        localStorage.setItem("kdp", JSON.stringify(kdc));
      }
    }
    kdT = nowK;
    pendingFix = null;
    query += e.key;
    cursor = 0;
    if (effQuery()) localStorage.setItem("savedq", query);
    const q = effQuery();
    if (!query.startsWith(" ")) {
      const hit = uniq.get(q.toLowerCase());
      if (hit && q.length >= 2) { open(hit); return; }
      if (q.length >= 2 && confd.n >= 15) {
        try {
          const lst2 = filtered();
          if (filtered.fz && lst2.length > 1) {
            const em = ensembleMap();
            if (em) {
              let Zq = 0;
              lst2.forEach(g2 => { Zq += (em.get(g2) || 0) + 1e-6; });
              const qc = confQ();
              let cnt2 = 0, hg = null;
              lst2.forEach(g2 => {
                if (1 - ((em.get(g2) || 0) + 1e-6) / Zq <= qc) { cnt2++; hg = g2; }
              });
              if (cnt2 === 1 && hg === lst2[0] && aoeOK()) { aoMark(hg); open(hg); return; }
            }
          }
        } catch (e2) {}
      }
    }
    render();
  }
});
